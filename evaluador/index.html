<title>M.O.R.A Evaluador Inmobiliario</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap">
<style>
/* Layout: plano de obra — barra lateral tipo carátula de lámina + hoja de cálculo limpia; cifras en mono tabular */
:root{
  /* ÖRÖK · mismos tokens y paleta terracota que el CRM inmobiliario (glass.css / theme.css) */
  --orok-brand:#85442a; --orok-dark:#35190f; --orok-accent:#eb6834;
  --bg:#f3ebe5; --surface:rgba(255,255,255,.78); --sunk:rgba(255,255,255,.5); --ink:#1c1917; --muted:#6b625c; --line:rgba(133,68,42,.15);
  --solid:#fdf9f6; --solid-sunk:#f6eee8;
  --accent:var(--orok-brand); --accent-soft:color-mix(in srgb,var(--orok-brand) 12%,transparent); --warn:#a8641a; --warn-soft:#f8e8d3; --neg:#b42318; --neg-soft:#fbe2dc; --ok:#2f7d4a;
  --side:var(--orok-dark); --side-fg:#fff; --side-muted:#8a817c; --side-hi:rgba(133,68,42,.1);
  --d1:var(--orok-brand); --d2:#2a78d6; --d3:var(--orok-accent); --d4:#19a397; --d5:#6c5ce7;
  --orb-1:var(--orok-accent); --orb-2:#b5654a; --orb-3:#f2c38f; --orb-4:#d98aa0; --orb-op:.78;
  --glass-grad:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.56));
  --glass-strong:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.7));
  --glass-soft:rgba(255,255,255,.5); --glass-border:rgba(255,255,255,.65);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(255,255,255,.18),0 22px 50px -24px rgba(70,35,20,.45);
  --bar-grad:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.5));
  --blur:blur(26px) saturate(175%); --ease:cubic-bezier(.2,.8,.2,1);
  --f-display:'Outfit', 'Helvetica Neue', Arial, sans-serif;
  --f-body:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1a120e; --surface:rgba(44,30,24,.78); --sunk:rgba(255,255,255,.05); --ink:#f3ebe5; --muted:#b3a59c; --line:rgba(242,195,143,.14);
  --solid:#271b16; --solid-sunk:#2f221c; --accent:#e8946b; --accent-soft:rgba(232,148,107,.16); --warn:#e0a548; --warn-soft:#3a2a16; --neg:#ef8a74; --neg-soft:#3b1f19; --ok:#6cc48d;
  --d1:#e8946b; --d2:#6aa6e6; --d3:#f2c38f; --d4:#4cc3b5; --d5:#a493e0; --orb-op:.32;
  --glass-grad:linear-gradient(135deg,rgba(52,36,29,.82),rgba(36,25,20,.66)); --glass-strong:linear-gradient(135deg,rgba(48,33,27,.92),rgba(34,24,19,.84));
  --glass-soft:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.1); --glass-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 22px 50px -24px rgba(0,0,0,.7);
  --bar-grad:linear-gradient(180deg,rgba(30,21,17,.86),rgba(30,21,17,.7)); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1a120e; --surface:rgba(44,30,24,.78); --sunk:rgba(255,255,255,.05); --ink:#f3ebe5; --muted:#b3a59c; --line:rgba(242,195,143,.14);
  --solid:#271b16; --solid-sunk:#2f221c; --accent:#e8946b; --accent-soft:rgba(232,148,107,.16); --warn:#e0a548; --warn-soft:#3a2a16; --neg:#ef8a74; --neg-soft:#3b1f19; --ok:#6cc48d;
  --d1:#e8946b; --d2:#6aa6e6; --d3:#f2c38f; --d4:#4cc3b5; --d5:#a493e0; --orb-op:.32;
  --glass-grad:linear-gradient(135deg,rgba(52,36,29,.82),rgba(36,25,20,.66)); --glass-strong:linear-gradient(135deg,rgba(48,33,27,.92),rgba(34,24,19,.84));
  --glass-soft:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.1); --glass-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 22px 50px -24px rgba(0,0,0,.7);
  --bar-grad:linear-gradient(180deg,rgba(30,21,17,.86),rgba(30,21,17,.7)); color-scheme:dark }
/* La paleta del CRM se aplica solo dentro del Evaluador. La franja superior del ERP vive
   fuera de este documento y conserva su identidad fija. */
:root[data-palette="oceano"]{
  --orok-brand:#1d5fa8;--orok-dark:#0b2a4a;--orok-accent:#19b3a6;
  --bg:#e7f0f8;--surface:rgba(248,252,255,.86);--sunk:rgba(226,240,249,.72);--line:rgba(29,95,168,.16);
  --solid:#f7fbfe;--solid-sunk:#e7f2f9;--accent:var(--orok-brand);--accent-soft:rgba(29,95,168,.12);
  --side:#e7f0f8;--side-fg:#10283e;--side-muted:#547086;--side-hi:rgba(29,95,168,.11);
  --orb-1:#2a78d6;--orb-2:#19b3a6;--orb-3:#8fd3f4;--orb-4:#5b7cfa;--orb-op:.62;
  --glass-grad:linear-gradient(135deg,rgba(250,253,255,.9),rgba(222,239,249,.7));
  --glass-strong:linear-gradient(135deg,rgba(250,253,255,.94),rgba(225,241,250,.82));
  --glass-soft:rgba(236,247,253,.7);--glass-border:rgba(255,255,255,.76);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.94),inset 0 -1px 0 rgba(255,255,255,.28),0 22px 50px -24px rgba(10,40,80,.38);
  --bar-grad:linear-gradient(180deg,rgba(246,252,255,.88),rgba(224,240,250,.76))
}
:root[data-palette="lavanda"]{
  --orok-brand:#5b4bc4;--orok-dark:#2a2163;--orok-accent:#c05bd6;
  --bg:#e9e8fa;--surface:rgba(252,251,255,.86);--sunk:rgba(235,232,252,.74);--line:rgba(91,75,196,.16);
  --solid:#fbfaff;--solid-sunk:#eeecfb;--accent:var(--orok-brand);--accent-soft:rgba(91,75,196,.12);
  --side:#e9e8fa;--side-fg:#2a2163;--side-muted:#746d99;--side-hi:rgba(91,75,196,.11);
  --orb-1:#6c5ce7;--orb-2:#c05bd6;--orb-3:#9fb4ff;--orb-4:#e3a3f0;--orb-op:.58;
  --glass-grad:linear-gradient(135deg,rgba(253,252,255,.9),rgba(235,232,252,.72));
  --glass-strong:linear-gradient(135deg,rgba(253,252,255,.94),rgba(238,235,253,.84));
  --glass-soft:rgba(244,241,254,.72);--glass-border:rgba(255,255,255,.76);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.94),inset 0 -1px 0 rgba(255,255,255,.28),0 22px 50px -24px rgba(40,30,110,.36);
  --bar-grad:linear-gradient(180deg,rgba(251,249,255,.9),rgba(237,234,252,.78))
}
:root[data-palette="esmeralda"]{
  --orok-brand:#1f7a5a;--orok-dark:#0f3b2c;--orok-accent:#d6a33a;
  --bg:#ecf3ee;--surface:rgba(250,253,250,.86);--sunk:rgba(229,242,234,.74);--line:rgba(31,122,90,.16);
  --solid:#f9fcfa;--solid-sunk:#e9f4ed;--accent:var(--orok-brand);--accent-soft:rgba(31,122,90,.12);
  --side:#ecf3ee;--side-fg:#173f31;--side-muted:#5f776d;--side-hi:rgba(31,122,90,.11);
  --orb-1:#1f9a6e;--orb-2:#d6a33a;--orb-3:#8fd6b4;--orb-4:#5fb3a1;--orb-op:.58;
  --glass-grad:linear-gradient(135deg,rgba(251,254,252,.9),rgba(228,242,234,.72));
  --glass-strong:linear-gradient(135deg,rgba(251,254,252,.94),rgba(231,244,236,.84));
  --glass-soft:rgba(239,248,242,.72);--glass-border:rgba(255,255,255,.76);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.94),inset 0 -1px 0 rgba(255,255,255,.28),0 22px 50px -24px rgba(15,60,40,.36);
  --bar-grad:linear-gradient(180deg,rgba(250,254,251,.9),rgba(231,243,236,.78))
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
aside{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px 18px;border-bottom:1px solid var(--side-hi);margin-bottom:14px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.14em}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted)}
.navg{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.navg h6{margin:0 0 4px;padding:0 8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-muted);font-weight:600}
.navg button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 8px;border-radius:6px;font-size:13.5px;color:var(--side-fg)}
.navg button:hover{background:var(--side-hi)}
.navg button[aria-current="true"]{background:var(--side-hi);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.navg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.navg small{font-family:var(--f-mono);font-size:10px;color:var(--side-muted)}
main{min-width:0;padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:14px 12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.titlebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px;margin-bottom:10px}
.titlebar h1{margin:0;font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.titlebar .meta{color:var(--muted);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:8px 12px;min-width:0}
.kpi label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi output{display:block;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi output.good{color:var(--ok)} .kpi output.bad{color:var(--neg)}
.content{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:22px 0;display:flex;flex-direction:column;gap:22px}
.sect-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.sect-h h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700}
.sect-h p{margin:0;color:var(--muted);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.panel h3{margin:0 0 10px;font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px}
.scope-box{display:grid;grid-template-columns:minmax(260px,2fr) repeat(3,minmax(160px,1fr));gap:12px;align-items:end;padding:12px 14px;margin:0 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.scope-sep td{background:var(--warn-soft);color:var(--warn);border-top:3px solid var(--warn);white-space:normal}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:11.5px;color:var(--muted)}
.f.src label{color:var(--accent);font-weight:600}
input,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input[type=number],input.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.f.src input{background:var(--accent-soft);border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td input{padding:4px 6px;font-size:12.5px}
td input.w{min-width:170px} td input.s{width:84px} td input.xs{width:64px} td select{min-width:150px;padding:4px 6px;font-size:12.5px}
tr.grp td{background:var(--sunk);font-weight:600;font-family:var(--f-display);letter-spacing:.03em}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.sub td{color:var(--muted)}
td.stick,th.stick{position:sticky;left:0;background:var(--surface);z-index:1}
th.stick{background:var(--sunk);z-index:2}
tr.grp td.stick{background:var(--sunk)}
.neg{color:var(--neg)} .pos{color:var(--ok)} .mut{color:var(--muted)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.03em}
.chip.ok{background:var(--accent-soft);color:var(--accent)} .chip.w{background:var(--warn-soft);color:var(--warn)} .chip.b{background:var(--neg-soft);color:var(--neg)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)} .btn:focus-visible{outline:2px solid var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)} .btn.pri:hover{color:#fff;filter:brightness(1.08)}
.btn.x{padding:2px 8px;border:none;color:var(--muted)} .btn.x:hover{color:var(--neg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:12.5px;color:var(--muted);max-width:80ch;margin:8px 0 0}
@media(max-width:980px){.scope-box{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.scope-box{grid-template-columns:1fr}}
.lola{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.lola li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.lola li i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.lola li.ok i{background:var(--accent-soft);color:var(--accent)} .lola li.w i{background:var(--warn-soft);color:var(--warn)} .lola li.b i{background:var(--neg-soft);color:var(--neg)}
.big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.big div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.big label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big output{display:block;font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big small{color:var(--muted);font-size:12px}
svg text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.chart{width:100%;height:auto;display:block}
.bar{height:10px;border-radius:5px;background:var(--sunk);position:relative;overflow:hidden;min-width:120px}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bar em{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.gantt td{padding:4px 2px} .gantt td.c{width:22px;min-width:22px;padding:0} .gantt .on{display:block;height:14px;border-radius:3px;background:var(--accent)}
.gantt .on.w{background:var(--warn)} .gantt .on.m{background:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
textarea{width:100%;min-height:120px;font-family:var(--f-mono);font-size:11.5px;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.heat td.n{font-weight:500}
/* ---- app shell + asesora ---- */
.app{grid-template-columns:248px minmax(0,1fr)}
.app.ai-open{grid-template-columns:248px minmax(0,1fr) clamp(360px,30vw,420px)}
.ai{width:clamp(360px,30vw,420px);background:var(--surface);border-left:1px solid var(--line);position:sticky;top:0;height:100vh;display:none;flex-direction:column;min-width:0}
.app.ai-open .ai{display:flex}
.ai-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.ai-h .row{justify-content:space-between}
.ai-h b{font-family:var(--f-display);font-size:16px;letter-spacing:.06em}
.ai-h small{color:var(--muted);font-size:12px;line-height:1.4}
.ai-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px;box-shadow:0 0 0 3px var(--accent-soft)}
.ai-dot.off{background:var(--muted);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);line-height:1.3}
.chips button:hover{border-color:var(--accent);color:var(--accent)} .chips button:focus-visible{outline:2px solid var(--accent)}
.ai-log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0;padding-right:max(16px,env(safe-area-inset-right,0px))}
.msg{font-size:13.5px;line-height:1.55;max-width:100%;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent-soft);color:var(--ink);padding:8px 12px;border-radius:12px 12px 2px 12px;max-width:88%}
.msg.a p{margin:0 0 8px} .msg.a ul,.msg.a ol{margin:0 0 8px;padding-left:20px} .msg.a li{margin-bottom:3px}
.msg.a strong{font-weight:600} .msg.a h4{margin:6px 0 4px;font-family:var(--f-display);font-size:13.5px}
.msg.a code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:1px 4px;border-radius:4px}
.msg.t{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);display:flex;gap:6px;align-items:center}
.msg.t::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.msg.e{font-size:12.5px;color:var(--neg)}
.msg.thinking{color:var(--muted);font-style:italic}
.ai-f{border-top:1px solid var(--line);padding:10px 16px 14px;display:flex;flex-direction:column;gap:8px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.ai-f textarea{min-height:64px;max-height:160px;resize:vertical;font-family:var(--f-body);font-size:13.5px}
.ai-f .row{justify-content:space-between}
.ai-empty{color:var(--muted);font-size:13px;line-height:1.5}

.ai-toggle::before{display:none}
