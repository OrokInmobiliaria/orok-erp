function projFor(mod,uiKey){
  const ps=projList().filter(p=>modOn(p,mod));const s=projSel();
  if(s)return {p:s,ps};
  const p=ps.find(x=>x.id===S[uiKey])||ps[0]||null;if(p)S[uiKey]=p.id;return {p,ps};
}
function projPicker(ps,p,uiKey){if(projSel()||ps.length<2)return '';return `<select data-ui="${uiKey}" aria-label="Proyecto">${ps.map(x=>`<option value="${esc(x.id)}" ${p&&x.id===p.id?'selected':''}>${esc(x.nombre)}${empCol()?' · '+x.empresa:''}</option>`).join('')}</select>`}
const sameProj=(x,p)=>x.empresa===p.empresa&&slug(x.proyecto)===slug(p.nombre);
const pct=v=>nf(v*100,1)+' %';

/* ---------- Control de obra: valorizaciones ---------- */
function valsOf(p){return Object.values(D.obra).filter(x=>x.clase==='valorizacion'&&sameProj(x,p)).sort((a,b)=>(a.periodo||'').localeCompare(b.periodo||'')||a.n-b.n)}
function cuadernoOf(p){return Object.values(D.obra).filter(x=>x.clase==='cuaderno'&&sameProj(x,p)).sort((a,b)=>b.n-a.n)}
function obraModel(p){
  const M=presModel(p.nombre),parts=M.rows.filter(r=>r.monto>0),total=parts.reduce((a,r)=>a+r.monto,0);
  const vs=valsOf(p),ok=vs.filter(v=>v.estado==='Aprobada');
  const acum=v=>parts.reduce((a,r)=>a+r.monto*Math.min(100,Math.max(0,+(v?.avance||{})[r.n]||0))/100,0);
  const prevOf=v=>{const i=ok.indexOf(v);const prior=ok.filter(x=>(x.periodo||'')<(v.periodo||'')||(x.periodo===v.periodo&&x.n<v.n));return i===0?null:prior.at(-1)||null};
  const planAt=m=>{const c=M.curve.filter(x=>x.m<=m).at(-1);return c&&M.tot.monto?c.aPlan/M.tot.monto:0};
  const compAt=m=>{let b=0;for(const c of M.curve)if(c.m<=m)b+=c.comp;return b};
  const rows=vs.map(v=>{const prev=v.estado==='Aprobada'?prevOf(v):ok.filter(x=>(x.periodo||'')<=(v.periodo||'')&&x.id!==v.id).at(-1)||null;
    const a=acum(v),ap=prev?acum(prev):0,real=total?a/total:0,plan=planAt(v.periodo||ym(today())),comp=compAt(v.periodo||ym(today()));
    return {v,prev,acum:a,periodo:a-ap,real,plan,spi:plan?real/plan:null,comp,cpi:comp?a/comp:null}});
  const last=rows.filter(r=>r.v.estado==='Aprobada').at(-1)||null;
  return {M,parts,total,vs,rows,last};
}
function valFlags(r,parts){const f=[],v=r.v,prev=r.prev;
  for(const x of parts){const a=+(v.avance||{})[x.n]||0,b=+((prev&&prev.avance)||{})[x.n]||0;if(a>100)f.push(`${x.n}: avance mayor a 100 %`);else if(a<b-0.001)f.push(`${x.n}: ${nf(a,1)} % es menor que la valorización anterior (${nf(b,1)} %)`)}
  if(r.plan&&(r.plan-r.real)*100>(+PO().tolerancia_atraso_pct||5))f.push(`Atraso: real ${pct(r.real)} contra ${pct(r.plan)} programado`);
  return f}
function obraChart(O){
  const cv=O.M.curve;if(cv.length<2||!O.M.tot.monto)return '<p class="mut">La curva aparece cuando el presupuesto tiene al menos dos meses programados.</p>';
  const W=720,H=220,pl=46,pb=28,pt=10,pr=26,x=i=>pl+i*(W-pl-pr)/(cv.length-1),y=v=>pt+(H-pt-pb)*(1-Math.min(1.2,v)/1.2);
  const idx=m=>cv.findIndex(c=>c.m===m);
  const plan=cv.map((c,i)=>`${x(i).toFixed(1)},${y(c.aPlan/O.M.tot.monto).toFixed(1)}`).join(' ');
  const real=O.rows.filter(r=>r.v.estado==='Aprobada'&&idx(r.v.periodo)>=0).map(r=>[idx(r.v.periodo),r.real]);
  const comp=cv.map((c,i)=>c.aComp==null?null:`${x(i).toFixed(1)},${y(c.aComp/O.M.tot.monto).toFixed(1)}`).filter(Boolean).join(' ');
  const ticks=[0,.25,.5,.75,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(f)}" y2="${y(f)}" stroke="currentColor" stroke-opacity=".12"/><text x="${pl-6}" y="${y(f)+3}" text-anchor="end">${f*100} %</text>`).join('');
  const step=Math.ceil(cv.length/10),xl=cv.map((c,i)=>i%step===0||i===cv.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${c.m.slice(2).replace('-','/')}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Avance programado, avance físico real y costo comprometido, en porcentaje del presupuesto">${ticks}${xl}<polyline fill="none" stroke="var(--muted)" stroke-width="2.4" stroke-dasharray="5 4" points="${plan}"/>${comp?`<polyline fill="none" stroke="var(--d2)" stroke-width="2" points="${comp}"/>`:''}${real.length>1?`<polyline fill="none" stroke="var(--accent)" stroke-width="2.6" points="${real.map(([i,v])=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>`:''}${real.map(([i,v])=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--accent)"/>`).join('')}</svg>
  <div class="legend"><span><i style="background:var(--muted)"></i>Avance programado</span><span><i style="background:var(--accent)"></i>Avance físico real (valorizaciones aprobadas)</span><span><i style="background:var(--d2)"></i>Costo comprometido (órdenes)</span></div>`;
}

function hitosOf(p){return Object.values(D.cobranzas).filter(h=>sameProj(h,p)).sort((a,b)=>(a.fecha_prevista||'').localeCompare(b.fecha_prevista||'')||(a.creado||'').localeCompare(b.creado||''))}
function detTipo(p){const t=PC().detraccion_pct_por_tipo||{};return +(t[p.tipo]??P().detraccion.tasa_referencial_servicios??12)}
function hitoBase(p,x={}){return {id:uid(p.empresa+'-CB'),empresa:p.empresa,proyecto:p.nombre,proyecto_id:p.id,cliente:p.cliente||'',concepto:'Nuevo hito',monto:0,moneda:'PEN',comprobante:'Factura electrónica',igv:true,detraccion_pct:detTipo(p),cliente_retiene:true,fecha_prevista:addDays(today(),30),estado:'Programado',serie:'',emision:'',plazo_dias:+PC().plazo_cobro_dias||15,cobros:[],notas:'',creado:new Date().toISOString(),...x}}
function cobCalc(h){
  const p=P(),sub=r2(h.monto),fac=h.comprobante!=='Recibo por honorarios',igv=fac&&h.igv?r2(sub*p.igv):0,total=r2(sub+igv);
  const det=fac&&+h.detraccion_pct>0&&total>=p.detraccion.desde_monto?Math.round(total*h.detraccion_pct/100):0;
  const ret=!fac&&h.cliente_retiene!==false&&sub>p.retencion_4ta.desde_monto?r2(sub*p.retencion_4ta.tasa):0;

  const neto=r2(total-det-ret),saldo=r2(neto-cob),saldoDet=r2(det-detC),fact=h.estado==='Facturado'&&!!h.emision,vence=fact?addDays(h.emision,h.plazo_dias||0):h.fecha_prevista,dias=vence?diffDays(vence,today()):null;

function cobEstado(h,k=cobCalc(h)){if(h.estado==='Anulado')return['Anulado','n'];if(k.cobrado)return['Cobrado','ok'];
  if(!k.fact)return k.dias!=null&&k.dias<0?[`Por facturar (previsto ${fdate(h.fecha_prevista)})`,'w']:['Programado','i'];
  if(k.saldo<=0.01&&k.saldoDet>0.01)return['Falta detracción del cliente','w'];
  if(k.dias<0)return[`Vencido hace ${-k.dias} d`,'b'];if(k.dias<=7)return[`Vence en ${k.dias} d`,'w'];return[k.cob>0?'Cobro parcial':'Facturado','i']}
function cobStats(hs){let contratado=0,facturado=0,cobrado=0,porCobrar=0,vencido=0;
  for(const h of hs){if(h.estado==='Anulado')continue;const k=cobCalc(h),v=x=>toPEN(x,h.moneda);contratado+=v(k.total);if(k.fact){facturado+=v(k.total);porCobrar+=v(Math.max(0,k.saldo)+Math.max(0,k.saldoDet));if(k.dias<0&&k.saldo>0.01)vencido+=v(k.saldo)}cobrado+=v(k.cob+k.detC)}
  return {contratado,facturado,cobrado,porCobrar,vencido}}

function cobAlertas(A){
  for(const h of Object.values(D.cobranzas).filter(x=>inEmp(x)&&inProy('cobranzas',x))){if(h.estado==='Anulado')continue;const k=cobCalc(h);if(k.cobrado)continue;
    const base={id:h.id,emp:h.empresa,tab:'cobranzas',cur:h.moneda};
    if(!k.fact){if(k.dias!=null&&k.dias<0&&+h.monto>0)A.push({...base,sev:'w',grp:'Cobros por facturar',t:`${h.proyecto} · ${h.concepto}`,d:`Previsto para el ${fdate(h.fecha_prevista)}: emite el comprobante al cliente`,monto:cobCalc(h).total});continue}
    if(k.saldo>0.01){if(k.dias<0)A.push({...base,sev:'b',grp:'Cobros vencidos',t:`${h.proyecto} · ${h.serie}`,d:`${h.cliente||'Cliente'} debía pagar el ${fdate(k.vence)} (hace ${-k.dias} días)`,monto:k.saldo});else if(k.dias<=7)A.push({...base,sev:'i',grp:'Cobros por vencer (7 días)',t:`${h.proyecto} · ${h.serie}`,d:`Vence el ${fdate(k.vence)}`,monto:k.saldo})}
    if(k.saldoDet>0.01&&k.cob>0)A.push({...base,sev:'n',grp:'Detracciones de clientes por confirmar',t:`${h.proyecto} · ${h.serie}`,d:'Confirma el depósito en la cuenta de detracciones del Banco de la Nación',monto:k.saldoDet});
  }
  const mes=ym(today());
  for(const p of projList().filter(p=>modOn(p,'obra')&&p.fase==='En ejecución'&&(!S.proyF||p.id===S.proyF))){const vs=valsOf(p);if(!presModel(p.nombre).rows.some(r=>r.monto>0))continue;
    const b=vs.find(v=>v.estado==='Borrador');if(b){const dd=diffDays(today(),(b.hist||[])[0]?.f||today());if(dd>(+PO().dias_valorizacion_borrador||7))A.push({id:b.id,emp:p.empresa,tab:'obra',sev:'w',grp:'Valorizaciones por aprobar',t:`${p.nombre} · N.º ${b.n}`,d:`En borrador hace ${dd} días`})}
    else if(!vs.some(v=>v.estado==='Aprobada'&&v.periodo>=mes)&&today().slice(8,10)>='25')A.push({id:p.id,emp:p.empresa,tab:'obra',sev:'n',grp:'Valorizaciones del mes',t:p.nombre,d:'Aún no hay valorización de '+mes})
    const last=obraModel(p).last;if(last&&last.plan&&(last.plan-last.real)*100>(+PO().tolerancia_atraso_pct||5))A.push({id:p.id,emp:p.empresa,tab:'obra',sev:'w',grp:'Obras con atraso',t:p.nombre,d:`Real ${pct(last.real)} contra ${pct(last.plan)} programado (valorización N.º ${last.v.n})`})}
  return A;
}

function cadenaDe(o){return APROB.cadena(o,Object.values(D.proyectos),Object.values(D.aprobadores).filter(x=>!x.eliminado),AP_())}
function turnoMio(o){const ap=o.aprobacion;if(o.estado!=='En aprobación'||!ap)return [];const t=APROB.turno(ap,ap.secuencial!==false);return CRM?t.filter(i=>ap.pasos[i].user_id===myUid()):t}
function aplicarOrden(o){if(o&&o.id){D.ordenes={...D.ordenes,[o.id]:o};delete HASHES[o.id];refreshHash(o);if(mode==='local')saveLocal();else if(mode==='db')writeDoc('ordenes',o).catch(writeErr)}}
function avisoTxt(ap){const a=(ap?.avisos||[]).slice(-3);if(!a.length)return '';const ok=a.filter(x=>x.ok).map(x=>x.para),ko=a.filter(x=>!x.ok);return (ok.length?'Aviso enviado a '+ok.join(', ')+'. ':'')+(ko.length?'No se pudo avisar por correo ('+ko.map(x=>x.error).join('; ')+'): usa «Avisar desde mi correo». ':'')}

    for(const p of Object.values(D.proyectos).filter(p=>!p.eliminado&&p.fase==='En ejecución'&&!p.jefe_obra&&inEmp(p)&&!ds.some(d=>((d.cargos||{})['Jefe de Obra']||[]).includes(p.empresa))))
      if(AP.reglas.some(r=>r.pasos.includes('Jefe de Obra')&&(!r.empresa||[].concat(r.empresa).includes(p.empresa))&&(!r.tipos||r.tipos.includes(p.tipo))&&(!r.modulo||(p.modulos||[]).includes(r.modulo))))
        P_.push({sev:'w',t:`Asigna el Jefe de Obra de ${p.nombre}`,d:`${p.empresa} · la obra está en ejecución y sus órdenes no pueden enviarse a aprobación`,go:'proyectos',id:p.id})}

function parseNum(s){if(typeof s==='number')return s;s=String(s??'').trim();if(!s||s==='-')return 0;const neg=/^\(.*\)$/.test(s)||/-\s*$/.test(s)||/^-/.test(s);s=s.replace(/[^\d.,]/g,'');if(/,\d{1,2}$/.test(s)&&!/\.\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const n=parseFloat(s)||0;return neg?-n:n}

  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[0];if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return ''}
function tableToMovs(rows){
  const norm=s=>String(s??'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').trim();
  let hi=rows.findIndex(r=>r.some(c=>/fecha/.test(norm(c)))&&r.some(c=>/monto|importe|cargo|abono|debe|haber|retiro|deposito/.test(norm(c))));if(hi<0)throw new Error('No encontré una fila de encabezados con «Fecha» y «Monto» (o «Cargo»/«Abono»).');
  const H=rows[hi].map(norm),ix=re=>H.findIndex(h=>re.test(h));
  const iF=ix(/fecha( de)? (operacion|proceso)|^fecha/),iD=ix(/descrip|concepto|detalle|glosa|referencia/),iM=ix(/^monto|importe/),iC=ix(/cargo|debe|retiro|egreso/),iA=ix(/abono|haber|deposito|ingreso/),iO=ix(/operacion|n.? ?op/);
  const out=[];for(const r of rows.slice(hi+1)){const f=parseDate(r[iF]);if(!f)continue;let m=iM>=0?parseNum(r[iM]):(iA>=0?Math.abs(parseNum(r[iA])):0)-(iC>=0?Math.abs(parseNum(r[iC])):0);if(!m)continue;
    out.push({fecha:f,desc:[r[iD],iO>=0&&iO!==iF?r[iO]:''].filter(Boolean).join(' · ').toString().slice(0,200),monto:r2(m)})}
  if(!out.length)throw new Error('No se encontraron movimientos con fecha y monto.');return out;
}

  if(aiTools)opts.tools=aiTools_();else opts.cache=false;
  try{const {text:out,truncated}=await sampleFn([{role:'user',content:RULES_FN()+'\n\n'+contextBlock()},...aiTurns.slice(-12)],opts);aiTurns.push({role:'assistant',content:out});bubble.className='msg a';bubble.innerHTML=md(out)+(truncated?'<p class="mut">Respuesta recortada: pide menos detalle.</p>':'')}
  catch(e){const c=e&&e.code;if(e&&e.text){bubble.className='msg a';bubble.innerHTML=md(e.text)}else bubble.remove();if(c!=='cancelled')addMsg('e',esc(ERRCOPY[c]||ERRCOPY.upstream_error));if(c==='not_granted'||c==='sampling_disabled'){sampleFn=null;aiState='off'}if(!e||!e.text)aiTurns.pop()}
  finally{aiCtl=null;setBusy(false);aiSync()}
}
function aiSync(){if(!$('#aiRole'))return;const info=TABINFO[S.tab]||TABINFO.panel;$('#aiRole').textContent=`En ${TABLABEL[S.tab]}: ${info[0]}`;
  $('#aiChips').innerHTML=info[1].map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join('');$('#aiDot').className='ai-dot'+(sampleFn||aiState==='crm'?'':' off');
  const l=$('#aiLog');if(!l.children.length)l.innerHTML=`<div class="ai-empty" id="aiEmpty">${aiState==='off'?'C.L.A.R.A no está disponible aquí. Abre la app dentro de Claude y acepta el permiso de IA.':aiState==='crm'?'Dentro del ERP, C.L.A.R.A usa el proveedor de IA configurado para L.O.L.A. Pregúntame por pagos, vencimientos, órdenes o estados financieros; propongo y tú registras.':'Pregúntame por pagos, vencimientos, órdenes, proveedores o estados financieros. Puedo leer cualquier sección, proponer partidas, preparar borradores de órdenes y leer vouchers y estados de cuenta en foto. Tú o Gerencia aprueban.'}</div>`;
  $('#aiUndo').hidden=!undoStack.length;$('#aiUndoTxt').textContent=`${undoStack.length} cambio${undoStack.length===1?'':'s'} de C.L.A.R.A`;$('#aiTier').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tier===aiTier)))}
function toggleAI(open){const a=$('#app');const o=open??!a.classList.contains('ai-open');a.classList.toggle('ai-open',o);$('#aiToggle').setAttribute('aria-expanded',String(o));if(o)setTimeout(()=>$('#aiIn').focus({preventScroll:true}),50)}
$('#aiToggle').onclick=()=>toggleAI();$('#aiClose').onclick=()=>toggleAI(false);
$('#aiNew').onclick=()=>{aiCtl?.abort();aiTurns=[];$('#aiLog').innerHTML='';aiSync()};$('#aiStop').onclick=()=>aiCtl?.abort();
$('#aiSend').onclick=()=>{const t=$('#aiIn').value;$('#aiIn').value='';aiSend(t)};
$('#aiIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#aiSend').click()}});
$('#aiChips').addEventListener('click',e=>{const b=e.target.closest('button[data-q]');if(b)aiSend(b.dataset.q)});
$('#aiTier').addEventListener('click',e=>{const b=e.target.closest('button[data-tier]');if(b){aiTier=b.dataset.tier;aiSync()}});
$('#aiUndoBtn').onclick=async()=>{await popUndo();addMsg('t','Cambio deshecho');aiSync()};
if(window.matchMedia('(min-width:1281px)').matches)toggleAI(true);
if(CRM){aiState='crm';sampleFn=null;setTimeout(()=>{$('#aiLog').innerHTML='';aiSync()},0)}else (async()=>{try{const s=window.claude&&await window.claude.use('sample');if(!s){aiState='off';aiSync();return}sampleFn=s;const lim=await s.limits().catch(()=>null);aiTools=!!(lim&&lim.tools);aiImages=!!(lim&&lim.images);aiState='on'}catch(_){aiState='off'}$('#aiLog').innerHTML='';aiSync()})();

/* lectura de imágenes: voucher y estado de cuenta */
async function leerVoucher(){
  const m=t=>{PF.msg=t;const x=$('#vMsg');if(x)x.textContent=t};
  if(CRM){m('Dentro del ERP, deja la foto o PDF en la carpeta «01 Entrada» de Drive: n8n la lee con C.L.A.R.A y aparece en «Bandeja de Drive». Aquí ingresa los datos a mano.');return}
  if(!sampleFn||!aiImages){m('La lectura con C.L.A.R.A necesita abrir la app dentro de Claude con permiso de IA e imágenes. Ingresa los datos a mano.');return}
  m('C.L.A.R.A está leyendo el voucher…');
  const c=D.cxp[PF.cxp],k=c&&cxpCalc(c);
  try{const r=await sampleFn.json(`Lee esta constancia de transferencia o depósito bancario de Perú. Responde solo un objeto JSON con: {"fecha":"AAAA-MM-DD","monto":número,"moneda":"PEN"|"USD","banco":"banco de origen","operacion":"número de operación","beneficiario":"nombre del destinatario","cuenta_destino":"cuenta o CCI destino","es_detraccion":boolean,"legible":boolean,"nota":"lo dudoso"}. Usa null si un dato no se ve. ${c?`Pago esperado: ${c.proveedor}, ${money(PF.tipo==='detraccion'?k.saldoDet:k.saldo,c.moneda)}.`:''}`,{images:[PF.file],modelTier:'default'});
    if(!r||typeof r!=='object')throw {code:'invalid_json'};PF.lectura=r;
    if(r.fecha)PF.fecha=String(r.fecha).slice(0,10);if(+r.monto>0)PF.monto=+r.monto;if(r.banco)PF.banco=String(r.banco);if(r.operacion)PF.operacion=String(r.operacion);if(r.es_detraccion===true)PF.tipo='detraccion';
    const diff=c&&+r.monto>0?r2(+r.monto-(PF.tipo==='detraccion'?k.saldoDet:k.saldo)):0;
    PF.msg=`Leído: ${r.beneficiario||'beneficiario no visible'} · ${money(+r.monto||0,r.moneda||'PEN')} · op. ${r.operacion||'—'}.${Math.abs(diff)>0.5?` Ojo: difiere en ${money(diff)} del saldo esperado.`:''}${r.nota?' Nota: '+r.nota:''} Revisa los campos antes de guardar.`;renderModal();
  }catch(e){m(ERRCOPY[e&&e.code]||'No se pudo leer el voucher. Ingresa los datos a mano.')}
}
async function leerEstadoImg(file){
  const m=t=>{const x=$('#bankMsg');if(x)x.textContent=t};
  if(!sampleFn||!aiImages){m('La lectura de fotos necesita abrir la app dentro de Claude con permiso de IA. Usa el Excel o CSV del banco.');return}
  m('C.L.A.R.A está leyendo el estado de cuenta…');
  try{const r=await sampleFn.json('Extrae los movimientos de este estado de cuenta bancario peruano. Responde solo JSON: {"cuenta":"banco y número si se ve","movimientos":[{"fecha":"AAAA-MM-DD","descripcion":"texto","monto":número}]} con cargos negativos y abonos positivos. No inventes filas.',{images:[file],modelTier:'default'});
    const rows=(r&&r.movimientos||[]).map(x=>({fecha:parseDate(x.fecha),desc:String(x.descripcion||'').slice(0,200),monto:r2(x.monto)})).filter(x=>x.fecha&&x.monto);if(!rows.length)throw {code:'invalid_json'};
    if(r.cuenta&&!S.cuentaImp)S.cuentaImp=String(r.cuenta);BI={rows,src:'Foto '+file.name+' (leída por C.L.A.R.A)',file};render();m('Revisa las filas leídas antes de guardarlas.');
  }catch(e){m(ERRCOPY[e&&e.code]||'No se pudo leer la imagen.')}
}
