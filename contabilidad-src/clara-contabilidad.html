<title>C.L.A.R.A Contabilidad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap">
<style>
/* Layout: plano de obra — barra lateral tipo carátula de lámina + hoja de cálculo limpia; cifras en mono tabular */
:root{
  /* ÖRÖK · mismos tokens y paleta terracota que el CRM inmobiliario (glass.css / theme.css) */
  --orok-brand:#85442a; --orok-dark:#35190f; --orok-accent:#eb6834;
  --bg:#f3ebe5; --surface:rgba(255,255,255,.78); --sunk:rgba(255,255,255,.5); --ink:#1c1917; --muted:#6b625c; --line:rgba(133,68,42,.15);
  --solid:#fdf9f6; --solid-sunk:#f6eee8;
  --accent:var(--orok-brand); --accent-soft:color-mix(in srgb,var(--orok-brand) 12%,transparent); --warn:#a8641a; --warn-soft:#f8e8d3; --neg:#b42318; --neg-soft:#fbe2dc; --ok:#2f7d4a;
  --side:var(--orok-dark); --side-fg:#fff; --side-muted:#8a817c; --side-hi:rgba(133,68,42,.1);
  --d1:var(--orok-brand); --d2:#2a78d6; --d3:var(--orok-accent); --d4:#19a397; --d5:#6c5ce7;
  --orb-1:var(--orok-accent); --orb-2:#b5654a; --orb-3:#f2c38f; --orb-4:#d98aa0; --orb-op:.78;
  --glass-grad:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.56));
  --glass-strong:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.7));
  --glass-soft:rgba(255,255,255,.5); --glass-border:rgba(255,255,255,.65);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(255,255,255,.18),0 22px 50px -24px rgba(70,35,20,.45);
  --bar-grad:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.5));
  --blur:blur(26px) saturate(175%); --ease:cubic-bezier(.2,.8,.2,1);
  --f-display:'Outfit', 'Helvetica Neue', Arial, sans-serif;
  --f-body:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1a120e; --surface:rgba(44,30,24,.78); --sunk:rgba(255,255,255,.05); --ink:#f3ebe5; --muted:#b3a59c; --line:rgba(242,195,143,.14);
  --solid:#271b16; --solid-sunk:#2f221c; --accent:#e8946b; --accent-soft:rgba(232,148,107,.16); --warn:#e0a548; --warn-soft:#3a2a16; --neg:#ef8a74; --neg-soft:#3b1f19; --ok:#6cc48d;
  --d1:#e8946b; --d2:#6aa6e6; --d3:#f2c38f; --d4:#4cc3b5; --d5:#a493e0; --orb-op:.32;
  --glass-grad:linear-gradient(135deg,rgba(52,36,29,.82),rgba(36,25,20,.66)); --glass-strong:linear-gradient(135deg,rgba(48,33,27,.92),rgba(34,24,19,.84));
  --glass-soft:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.1); --glass-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 22px 50px -24px rgba(0,0,0,.7);
  --bar-grad:linear-gradient(180deg,rgba(30,21,17,.86),rgba(30,21,17,.7)); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1a120e; --surface:rgba(44,30,24,.78); --sunk:rgba(255,255,255,.05); --ink:#f3ebe5; --muted:#b3a59c; --line:rgba(242,195,143,.14);
  --solid:#271b16; --solid-sunk:#2f221c; --accent:#e8946b; --accent-soft:rgba(232,148,107,.16); --warn:#e0a548; --warn-soft:#3a2a16; --neg:#ef8a74; --neg-soft:#3b1f19; --ok:#6cc48d;
  --d1:#e8946b; --d2:#6aa6e6; --d3:#f2c38f; --d4:#4cc3b5; --d5:#a493e0; --orb-op:.32;
  --glass-grad:linear-gradient(135deg,rgba(52,36,29,.82),rgba(36,25,20,.66)); --glass-strong:linear-gradient(135deg,rgba(48,33,27,.92),rgba(34,24,19,.84));
  --glass-soft:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.1); --glass-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 22px 50px -24px rgba(0,0,0,.7);
  --bar-grad:linear-gradient(180deg,rgba(30,21,17,.86),rgba(30,21,17,.7)); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
aside{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px 18px;border-bottom:1px solid var(--side-hi);margin-bottom:14px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.14em}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted)}
.navg{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.navg h6{margin:0 0 4px;padding:0 8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-muted);font-weight:600}
.navg button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 8px;border-radius:6px;font-size:13.5px;color:var(--side-fg)}
.navg button:hover{background:var(--side-hi)}
.navg button[aria-current="true"]{background:var(--side-hi);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.navg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.navg small{font-family:var(--f-mono);font-size:10px;color:var(--side-muted)}
main{min-width:0;padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:14px 12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.titlebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 20px;margin-bottom:10px}
.titlebar h1{margin:0;font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.titlebar .meta{color:var(--muted);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:8px 12px;min-width:0}
.kpi label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi output{display:block;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi output.good{color:var(--ok)} .kpi output.bad{color:var(--neg)}
.content{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:22px 0;display:flex;flex-direction:column;gap:22px}
.sect-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.sect-h h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700}
.sect-h p{margin:0;color:var(--muted);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.panel h3{margin:0 0 10px;font-family:var(--f-display);font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:11.5px;color:var(--muted)}
.f.src label{color:var(--accent);font-weight:600}
input,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input[type=number],input.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.f.src input{background:var(--accent-soft);border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td input{padding:4px 6px;font-size:12.5px}
td input.w{min-width:170px} td input.s{width:84px} td input.xs{width:64px} td select{min-width:150px;padding:4px 6px;font-size:12.5px}
tr.grp td{background:var(--sunk);font-weight:600;font-family:var(--f-display);letter-spacing:.03em}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.sub td{color:var(--muted)}
td.stick,th.stick{position:sticky;left:0;background:var(--surface);z-index:1}
th.stick{background:var(--sunk);z-index:2}
tr.grp td.stick{background:var(--sunk)}
.neg{color:var(--neg)} .pos{color:var(--ok)} .mut{color:var(--muted)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.03em}
.chip.ok{background:var(--accent-soft);color:var(--accent)} .chip.w{background:var(--warn-soft);color:var(--warn)} .chip.b{background:var(--neg-soft);color:var(--neg)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)} .btn:focus-visible{outline:2px solid var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)} .btn.pri:hover{color:#fff;filter:brightness(1.08)}
.btn.x{padding:2px 8px;border:none;color:var(--muted)} .btn.x:hover{color:var(--neg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:12.5px;color:var(--muted);max-width:80ch;margin:8px 0 0}
.lola{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.lola li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.lola li i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-mono)}
.lola li.ok i{background:var(--accent-soft);color:var(--accent)} .lola li.w i{background:var(--warn-soft);color:var(--warn)} .lola li.b i{background:var(--neg-soft);color:var(--neg)}
.big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.big div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.big label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big output{display:block;font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big small{color:var(--muted);font-size:12px}
svg text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.chart{width:100%;height:auto;display:block}
.bar{height:10px;border-radius:5px;background:var(--sunk);position:relative;overflow:hidden;min-width:120px}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bar em{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.gantt td{padding:4px 2px} .gantt td.c{width:22px;min-width:22px;padding:0} .gantt .on{display:block;height:14px;border-radius:3px;background:var(--accent)}
.gantt .on.w{background:var(--warn)} .gantt .on.m{background:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
textarea{width:100%;min-height:120px;font-family:var(--f-mono);font-size:11.5px;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.heat td.n{font-weight:500}
/* ---- app shell + asesora ---- */
.app{grid-template-columns:248px minmax(0,1fr) auto}
.ai{width:400px;background:var(--surface);border-left:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;min-width:0}
.app:not(.ai-open) .ai{display:none}
.ai-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.ai-h .row{justify-content:space-between}
.ai-h b{font-family:var(--f-display);font-size:16px;letter-spacing:.06em}
.ai-h small{color:var(--muted);font-size:12px;line-height:1.4}
.ai-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px;box-shadow:0 0 0 3px var(--accent-soft)}
.ai-dot.off{background:var(--muted);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);line-height:1.3}
.chips button:hover{border-color:var(--accent);color:var(--accent)} .chips button:focus-visible{outline:2px solid var(--accent)}
.ai-log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0;padding-right:max(16px,env(safe-area-inset-right,0px))}
.msg{font-size:13.5px;line-height:1.55;max-width:100%;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent-soft);color:var(--ink);padding:8px 12px;border-radius:12px 12px 2px 12px;max-width:88%}
.msg.a p{margin:0 0 8px} .msg.a ul,.msg.a ol{margin:0 0 8px;padding-left:20px} .msg.a li{margin-bottom:3px}
.msg.a strong{font-weight:600} .msg.a h4{margin:6px 0 4px;font-family:var(--f-display);font-size:13.5px}
.msg.a code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:1px 4px;border-radius:4px}
.msg.t{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);display:flex;gap:6px;align-items:center}
.msg.t::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.msg.e{font-size:12.5px;color:var(--neg)}
.msg.thinking{color:var(--muted);font-style:italic}
.ai-f{border-top:1px solid var(--line);padding:10px 16px 14px;display:flex;flex-direction:column;gap:8px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.ai-f textarea{min-height:64px;max-height:160px;resize:vertical;font-family:var(--f-body);font-size:13.5px}
.ai-f .row{justify-content:space-between}
.ai-empty{color:var(--muted);font-size:13px;line-height:1.5}
.ai-toggle{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--side);color:var(--side-fg);font-size:12.5px;font-weight:600;letter-spacing:.04em}
.ai-toggle:hover{filter:brightness(1.2)} .ai-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.undo{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;padding:6px 10px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.saved{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.titlebar .acts{display:flex;align-items:center;gap:12px}
@media (max-width:1280px){.ai{position:fixed;right:0;top:0;bottom:0;height:auto;z-index:20;box-shadow:-12px 0 32px color-mix(in srgb,var(--ink) 18%,transparent);padding-top:env(safe-area-inset-top,0px)}}
@media (max-width:860px){.ai{left:0;width:auto;top:auto;height:82vh;border-left:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -12px 32px color-mix(in srgb,var(--ink) 22%,transparent)}.ai-h,.ai-log,.ai-f{padding-left:max(16px,env(safe-area-inset-left,0px))}}
/* ---- presentación a inversionistas ---- */
.inv-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.inv-head h2{margin:2px 0 4px;font-family:var(--f-display);font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.inv-head p{margin:0;color:var(--muted);max-width:70ch}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hero>div{background:var(--surface);padding:18px 20px;min-width:0}
.hero label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero output{display:block;font-family:var(--f-display);font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero small{color:var(--muted);font-size:12.5px}
.narr p{font-size:15px;line-height:1.65;max-width:78ch;margin:10px 0 0}
details.help{margin-top:10px;font-size:12.5px;color:var(--muted)} details.help summary{cursor:pointer;color:var(--accent);font-weight:600;width:max-content} details.help p{margin:6px 0 0;max-width:75ch;line-height:1.55}
.donut{display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:16px;align-items:center}
.donut svg{width:100%;height:auto}
.leg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.leg li{display:grid;grid-template-columns:12px 1fr auto;gap:2px 8px;align-items:center;font-size:13px}
.leg li i{width:12px;height:12px;border-radius:3px} .leg li b{font-variant-numeric:tabular-nums} .leg li small{grid-column:2/4;color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.scen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.scen>div{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--sunk)}
.scen>div.mid{border-color:var(--accent);background:var(--accent-soft)}
.scen label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.scen output{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.scen dl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:10px 0;font-size:13px} .scen dt{color:var(--muted)} .scen dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scen p{margin:0;font-size:12px;color:var(--muted)}
.hb{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;margin-bottom:8px;font-size:13px} .hb b{font-family:var(--f-mono);font-size:12px;font-weight:500}
.risks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.risks>div{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.risks b{font-family:var(--f-display)} .risks p{margin:6px 0 0;font-size:13px;line-height:1.5} .risks p.mit{color:var(--accent)}
.miles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:relative;gap:6px}

/* R38 · cadena de aprobación y campanita */
ol.chain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:ch}
ol.chain li{counter-increment:ch;position:relative;padding:8px 10px 8px 38px;border:1px solid var(--line);border-radius:12px;font-size:13.5px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
ol.chain li::before{content:counter(ch);position:absolute;left:10px;top:8px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--line);color:var(--ink)}
ol.chain li.ok::before{content:'✓';background:var(--ok);color:#fff}
ol.chain li.now{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
ol.chain li.now::before{background:var(--accent);color:#fff}
ol.chain small{color:var(--muted)}
.bell{position:relative}
.bell-btn{all:unset;cursor:pointer;position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--ink);background:var(--glass-grad,var(--surface));border:1px solid var(--glass-border,var(--line))}
.bell-btn:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.bell-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bell-n{position:absolute;top:-5px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-sizing:border-box}
.bell-n.urg{background:#C0392B}
.bell-pop{position:absolute;right:0;top:48px;z-index:60;width:min(380px,calc(100vw - 32px));max-height:min(70vh,520px);overflow:auto;background:#FCFAF8;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -16px rgba(60,30,15,.35)}
.bell-h{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:inherit}
.bell-pop ul{list-style:none;margin:0;padding:4px}
.bell-pop li button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%;box-sizing:border-box;padding:9px 10px;border-radius:10px}
.bell-pop li button:hover,.bell-pop li button:focus-visible{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.bell-pop li .dot{margin-top:6px;flex:none}
.bell-pop li b{display:block;font-size:13.5px}
.bell-pop li small{display:block;color:var(--muted);font-size:12px;line-height:1.35}

<script>
(function syncPaletteWithCRM(){
  const allowed=new Set(['terracota','oceano','lavanda','esmeralda']);
  const apply=()=>{
    let value='terracota';
    try{
      const host=window.parent!==window?window.parent.document.documentElement:null;
      value=(host&&host.dataset.palette)||window.parent.localStorage.getItem('orok-palette')||'terracota';
    }catch(_){
      try{value=localStorage.getItem('orok-palette')||'terracota'}catch(__){}
    }
    document.documentElement.dataset.palette=allowed.has(value)?value:'terracota';
    if(window.parent!==window)document.documentElement.dataset.theme='light';
  };
  apply();
  try{
    if(window.parent!==window){
      new MutationObserver(apply).observe(window.parent.document.documentElement,{attributes:true,attributeFilter:['data-palette']});
    }
  }catch(_){}
  window.addEventListener('storage',e=>{if(e.key==='orok-palette')apply()});
})();

// R38 · Cadenas de aprobación de órdenes OC/OS del ERP ÖRÖK. Fuente única: el servidor y la pantalla usan este mismo archivo.
// Las reglas salen de la skill erp-orok-contabilidad (parámetro «aprobaciones»): la primera regla que calza define los pasos.
// Ninguna orden pasa a «Aprobada» (ni se emite al proveedor) sin todos los pasos aprobados por la persona asignada.
(function (root) {
  'use strict';
  const r2 = n => Math.round((+n || 0) * 100) / 100;

  const PRE_APROBACION = ['Borrador', 'En aprobación'];

  function canonical(o, igvRate) {
    const sub = r2((o.items || []).reduce((a, i) => a + r2((+i.cant || 0) * (+i.pu || 0)), 0));

    return JSON.stringify({ e: o.empresa, t: o.tipo, n: o.n, f: o.fecha, p: o.proveedor, c: o.comprobante, m: o.moneda, i: o.igv, d: o.detraccion_pct, it: (o.items || []).map(i => [i.descripcion, i.unidad, +i.cant, +i.pu]), pr: o.proyecto, pa: o.partida, co: o.condiciones, tot: total.toFixed(2) });
  }
  // Contenido que se bloquea desde que la orden entra a aprobación (incluye entrega y observaciones del documento).
  function contenido(o, igvRate) { return canonical(o, igvRate) + '|' + JSON.stringify(o.destino || {}) + '|' + String(o.obs || ''); }
  function totalOrden(o, igvRate) { const sub = r2((o.items || []).reduce((a, i) => a + r2((+i.cant || 0) * (+i.pu || 0)), 0)); return r2(sub + (o.igv ? r2(sub * igvRate) : 0) + (+o.otros || 0)); }

  function proyectoDe(o, proyectos) {
    const n = slug(o.proyecto); if (!o.proyecto) return null;
    return (proyectos || []).find(p => !p.eliminado && p.empresa === o.empresa && (slug(p.nombre) === n || p.id === o.proyecto_id)) || null;
  }
  function reglaPara(o, proyecto, A) {
    const cumple = r => (!r.empresa || [].concat(r.empresa).includes(o.empresa))
      && (!r.tipos || (proyecto && r.tipos.includes(proyecto.tipo)))
      && (!r.modulo || (proyecto && (proyecto.modulos || []).includes(r.modulo)));
    return (A.reglas || []).find(cumple) || null;
  }
  // Devuelve los pasos con la persona asignada a cada cargo. «faltan» lista los cargos sin persona (la orden no puede enviarse).
  function cadena(o, proyectos, directorio, A) {
    const proyecto = proyectoDe(o, proyectos), errores = [];
    if ((A.requiere_proyecto || []).includes(o.empresa) && !proyecto) errores.push(o.proyecto ? `El proyecto «${o.proyecto}» no está registrado en ${o.empresa}: regístralo en Proyectos.` : `Las órdenes de ${o.empresa} deben indicar un proyecto registrado.`);
    const regla = reglaPara(o, proyecto, A);
    if (!regla) { errores.push('Ninguna regla de aprobación aplica a esta orden. Revisa la skill erp-orok-contabilidad.'); return { regla: null, proyecto, pasos: [], faltan: [], errores }; }
    const activos = (directorio || []).filter(d => d && d.activo !== false && d.user_id);
    const faltan = [], gerencia = esGerencia(o.solicitante, directorio, A);
    // Si la orden la elabora Gerencia, se omiten los pasos de jefatura (Jefe de Obra, Jefe de Proyecto, jefe de área).
    const pasosRegla = gerencia ? regla.pasos.filter(c => !(A.gerencia_omite || []).includes(c)) : regla.pasos;
    const pasos = pasosRegla.map(cargo => {
      let d = null;
      if (cargo === 'Jefe de Obra' && proyecto && proyecto.jefe_obra) d = activos.find(x => x.user_id === proyecto.jefe_obra) || null;
      else d = activos.find(x => ((x.cargos || {})[cargo] || []).includes(o.empresa)) || null;

    });

  // Pasos que toca aprobar ahora. En modo secuencial, el primer pendiente y los siguientes consecutivos de la misma persona.
  function turno(ap, secuencial) {
    const pasos = (ap && ap.pasos) || [], i = pasos.findIndex(p => p.estado !== 'aprobado');
    if (i < 0) return [];

    const out = [i]; for (let k = i + 1; k < pasos.length && pasos[k].estado !== 'aprobado' && pasos[k].user_id && pasos[k].user_id === pasos[i].user_id; k++) out.push(k);
    return out;
  }
  const completa = ap => !!(ap && ap.pasos && ap.pasos.length && ap.pasos.every(p => p.estado === 'aprobado'));

  // ¿La orden viene de Gerencia? Área «Gerencia» o una persona con cargo de gerencia (Gerencia General u Operaciones) en cualquier empresa.
  function esGerencia(sol, directorio, A) {

    return !!(d && (d.area === 'Gerencia' || Object.entries(d.cargos || {}).some(([c, es]) => (A.cargos_gerencia || []).includes(c) && (es || []).length)));
  }
  // Vincula el equipo de la skill con los usuarios del CRM por nombre (sin tildes ni mayúsculas; nombre y apellido).
  const tokens = s => String(s || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/).filter(Boolean);

"pct": 10, "dias": 0}]}}},texto:"# ERP ÖRÖK · Contabilidad y Finanzas (C.L.A.R.A)\n\nReglas de trabajo del módulo Contabilidad y Finanzas del ERP ÖRÖK. Este archivo es la **fuente única**:\n- el ERP (servidor y pantalla) y el flujo n8n leen de aquí las reglas y los parámetros;\n- C.L.A.R.A usa este texto como sus instrucciones;\n- Claude lo usa como skill en cualquier conversación.\n\nPara cambiar una regla se cambia aquí: el texto y el bloque `clara-parametros` del final.\n\n## Empresas\n\n| Código | Razón social (SUNAT) | RUC | Carpeta Contabilidad (ID de Drive) |\n|---|---|---|---|\n| BMG | BMG DESARROLLADORA INMOBILIARIA S.A.C. (marca ÖRÖK) | 20615227685 | 1RqRBLFGervdPIjOHGfbA2kWUeFRHUjKY |\n| MZA | MONTEZUMA ARQUITECTOS GERENCIA Y CONSTRUCCION E.I.R.L. | 20602354785 | 1eOPFAhtYW6L-lkSRrnOruhBrAED3VEJ0 |\n| MAAS | MAAS CONSTRUCTORA S.A.C. | 20616628144 | 17Kb4z3EmySjkiBvBpMLkxlFrlFvj4HY6 |\n\n- Domicilio fiscal: Puquina 138, Maranga, San Miguel, Lima.\n- Teléfono correcto de BMG: 987 208 622. La ficha RUC dice 987 200 862; está mal.\n- Contadora de las tres empresas: Lleny S. Camán Huablocho, C.P.C. Mat. 53753, lleny_caman@hotmail.com.\n- MAAS inició actividades el 09/10/2026 y aún no figura como emisor electrónico.\n- Detecta la empresa por el **RUC del receptor**. Si un documento se dejó en la carpeta de otra empresa, avisa; no lo muevas por tu cuenta.\n\n## Regla de Gerencia sobre fechas\n\nSolo se usa información **desde el 1 de enero de 2025**.\n- Lo anterior no entra en totales, alertas, numeración ni análisis.\n- **Nunca se borra.** En Drive se archiva por año en `08 Histórico (antes de 2025)/AAAA`; en el ERP queda marcado como histórico.\n\n## Tributación (referencial; confirmar con la contadora)\n\n- IGV 18 %, solo en facturas.\n- Recibo por honorarios: sin IGV. Retención de 4.ª categoría de 8 % si el monto supera S/ 1,500.\n- Detracción (SPOT):\n  - se aplica desde S/ 700;\n  - se redondea a soles enteros;\n  - se deposita en la cuenta del proveedor en el Banco de la Nación;\n  - el porcentaje depende del bien o servicio; el 12 % para servicios es solo referencial;\n  - plazo: hasta el 5.º día hábil del mes siguiente al pago.\n- Neto al proveedor = total − detracción − retención.\n\n## Órdenes de compra y de servicio\n\n- **Numeración:** `OC|OS-EMPRESA-AAAA-NNNN`. Es correlativa por empresa y por tipo.\n- **Flujo:** Borrador → En aprobación → Aprobada → Enviada → Recibida → Facturada → Pagada → Cerrada (o Anulada). Las órdenes que vienen del Excel entran como «Importada» y Gerencia confirma su estado real.\n- **Firmas:**\n  - Firma electrónica simple: quedan el nombre, la fecha y hora de Lima y la huella SHA-256 de la orden.\n  - Si la orden cambia después de firmada, la firma queda inválida.\n  - Roles: Elaboró, Aprobó (solo Gerencia) y Recepción conforme (OC) o Conformidad del servicio (OS).\n- **Formato:** A4, con logo y colores de la empresa (BMG #85442A, MZA #1F1F1F, MAAS #2F3B45) y fuente Outfit. Incluye:\n  - las cajas Proveedor, Facturar a, Proyecto y Entrega/Ejecución;\n  - los ítems, las condiciones y los totales;\n  - las firmas y el código de verificación.\n- **Revisar siempre:**\n  - número repetido;\n  - subtotal distinto de cantidad × precio unitario;\n  - posible IGV duplicado (líneas que citan comprobantes ya emitidos);\n  - proveedor persona con IGV;\n  - orden sin partida;\n  - proveedor sin RUC;\n  - cuenta bancaria que se repite en varios proveedores (confirmarla antes de pagar).\n\n## Proyectos\n\nCada proyecto tiene tipo de servicio, fase (Prospecto, Propuesta, Contratado, En ejecución, Entregado, Cerrado) y módulos activos. Al elegir el tipo se proponen estos módulos:\n\n| Tipo | Módulos |\n|---|---|\n| Consultoría o asesoría | tesorería, honorarios |\n| Diseño de planos | logística, tesorería, presupuesto, honorarios |\n| Desarrollo inmobiliario | logística, tesorería, presupuesto, ventas (CRM), evaluación (M.O.R.A), obra |\n| Construcción | logística, tesorería, presupuesto, obra, honorarios |\n\n- Los módulos se pueden activar o apagar en cualquier fase.\n- Los resultados se reportan **por proyecto**: comprometido, presupuesto, avance, pagado, por pagar y vencido.\n\n## Aprobación de órdenes OC/OS\n\n- Cualquier área o persona habilitada por Gerencia en el ERP (administración, legal, obra, logística…) puede **elaborar** órdenes. Nadie puede saltarse la aprobación, ni siquiera Gerencia.\n- La orden no se emite (no hay PDF válido, correo ni envío al proveedor) hasta que **todos** los pasos de su cadena estén aprobados.\n- Cadena según empresa y tipo de proyecto (la primera regla que calza):\n\n| Empresa / proyecto | Aprueban, en este orden |\n|---|---|\n| MAAS · obra o construcción (o proyecto con control de obra) | Jefe de Obra → Gerencia de Operaciones → Gerencia General |\n| MAAS · consultorías y asesorías | Gerencia de Operaciones → Gerencia General |\n| MAAS · otros proyectos | Gerencia de Operaciones → Gerencia General |\n| ÖRÖK (BMG) · área inmobiliaria | Gerencia General |\n| Montezuma Arquitectos (MZA) | Gerencia General |\n\n- **Por ahora, si la orden la elabora Gerencia** (Gerencia General o Gerencia de Operaciones), no necesita la firma del Jefe de Obra, del Jefe de Proyecto ni del jefe de área: solo firman las gerencias de su cadena (parámetros `cargos_gerencia` y `gerencia_omite`).\n- Las órdenes de MAAS deben indicar un proyecto registrado.\n- **Jefe de Obra:** no hay uno fijo. Se asigna en cada obra (Proyectos) cuando empieza y puede cambiar según la obra o la necesidad. Debe ser una persona habilitada en Aprobaciones. Al cambiarlo, las órdenes que esperaban la firma del Jefe de Obra pasan al nuevo y se le avisa, y queda el historial de quién fue Jefe de Obra y desde cuándo. Mientras una obra en ejecución no tenga Jefe de Obra, sus órdenes no se envían y la campanita de Gerencia lo recuerda.\n- Jefe de Proyecto y Jefe de Obra son cargos distintos. El Jefe de Proyecto no forma parte de ninguna cadena de aprobación.\n- Equipo (elaboran órdenes en BMG, MZA y MAAS dentro de su área, salvo que se indique una sola empresa):\n\n| Persona | Área | Correo | Cargo de aprobación |\n|---|---|---|---|\n| Martín Montezuma | Gerencia | mmontezuma@orok.com.pe | Gerencia General (BMG, MZA, MAAS) |\n| César Dávalos | Obra | cdavalos@orok.com.pe | Gerencia de Operaciones |\n| Fernando Amiquero | Proyectos | teoc151@gmail.com | Jefe de Proyecto en Montezuma Arquitectos (MZA) y BMG; no es Jefe de Obra ni aprueba órdenes; no elabora en MAAS |\n| Antonio Garcés | Ventas | ventas@orok.com.pe | — (elabora órdenes) |\n| Carla García | Marketing | kkmgledesign@gmail.com | — (elabora órdenes) |\n- Cada aprobador recibe un correo de solicitud de aprobación cuando le toca su paso. Quien elaboró recibe un aviso si la orden se aprueba o se observa.\n- Si un aprobador observa la orden, vuelve a borrador con el motivo; al corregirla se envía de nuevo y la cadena empieza otra vez.\n- Si la orden cambia después de enviada, las aprobaciones dejan de valer: hay que reabrirla y volver a aprobar.\n\n## Control de obra\n\n- Cada valorización mensual registra el avance **acumulado** de cada partida presupuestada (0 a 100 %). El monto del periodo es la diferencia con la valorización aprobada anterior.\n- Avance físico = valorizado acumulado ÷ presupuesto. Se compara con el avance programado (curva del presupuesto) y con el costo comprometido en órdenes.\n- Revisar antes de aprobar:\n  - partidas con avance menor al de la valorización anterior;\n  - avance mayor a 100 %;\n  - atraso mayor a la tolerancia (`obra.tolerancia_atraso_pct`).\n- Gerencia aprueba. Aprobada ya no se edita: si hay error se anula y se crea otra.\n- El cuaderno de obra no se edita ni se borra: una corrección es un asiento nuevo.\n- En proyectos con cobranzas, una valorización aprobada puede generar el cobro al cliente por el monto del periodo.\n\n## Honorarios y cobranzas\n\n- Hitos de cobro por proyecto: concepto, monto sin IGV, comprobante (factura o recibo por honorarios) y fecha prevista. Flujo: Programado → Facturado → cobros parciales → Cobrado (o Anulado).\n- Con factura: IGV 18 % y detracción que el cliente deposita en la cuenta de detracciones de la empresa en el Banco de la Nación (contratos de construcción 4 %, demás servicios 12 %; referencial, confirmar con la contadora).\n- Con recibo por honorarios: sin IGV; si el cliente es agente de retención, retiene 8 % cuando el monto supera S/ 1,500.\n- Caja del proyecto = cobrado − pagado. Alertas: hitos por facturar, cobros vencidos, por vencer en 7 días y detracciones de clientes por confirmar.\n- El comprobante se emite en SUNAT o en el sistema de facturación; el ERP registra serie, fecha y plazo para el seguimiento.\n\n## Google Drive: carpeta Contabilidad de cada empresa\n\nSubcarpetas:\n- `01 Entrada`\n- `02 Comprobantes de proveedores/AAAA-MM`\n- `03 Órdenes OC-OS/AAAA-MM`\n- `04 Pagos y vouchers/AAAA-MM`\n- `05 Bancos/AAAA-MM`\n- `06 Reportes/AAAA-MM`\n- `07 Procesados por C.L.A.R.A`\n- `08 Histórico (antes de 2025)/AAAA`\n\n**Nombres estándar** (el mes sale de la fecha del documento, no de la fecha en que se subió):\n- Orden: `OC-BMG-2026-0045 PROVEEDOR.pdf`\n- Comprobante: `Factura electrónica F001-950 EMISOR 2026-10-20.pdf` (también `Recibo por honorarios`, `Boleta`, `Nota de crédito`)\n- Voucher: `Voucher op 99887 BENEFICIARIO 2026-10-27.jpg`\n- Estado de cuenta: `Estado de cuenta BANCO CUENTA AAAA-MM-DD.xlsx`\n- Reporte: `CLARA EMPRESA - Etiqueta AAAA-MM-DD.xlsx`\n\nEn la raíz de Contabilidad solo deben quedar las carpetas 01 a 08, `CLARA-BANDEJA.json` y `CLARA-INVENTARIO-*.json`.\n\n### Márgenes al mantener el orden\n\n- Trabaja solo dentro de las tres carpetas Contabilidad.\n- Puedes leer, renombrar con el nombre estándar, mover y crear subcarpetas.\n- **Nunca** borres, mandes a la papelera, cambies permisos ni compartas.\n- Antes de reorganizar carpetas que ya existían, haz un inventario y pide la aprobación de Gerencia.\n\n## Lectura de documentos (01 Entrada)\n\nExtrae los datos en JSON con esta forma:\n\n```json\n{\"tipo\":\"factura|recibo_honorarios|boleta|nota_credito|voucher|estado_cuenta|otro\",\"emisor\":{\"ruc\":\"\",\"razon\":\"\"},\"receptor\":{\"ruc\":\"\",\"razon\":\"\"},\"serie\":\"\",\"fecha\":\"AAAA-MM-DD\",\"vencimiento\":null,\"moneda\":\"PEN|USD\",\"subtotal\":0,\"igv\":0,\"total\":0,\"detraccion\":{\"aplica\":false,\"porcentaje\":null,\"monto\":null},\"retencion\":null,\"orden_referencia\":null,\"pago\":{\"banco\":\"\",\"operacion\":\"\",\"fecha\":\"\",\"monto\":0,\"beneficiario\":\"\"},\"movimientos\":[{\"fecha\":\"\",\"descripcion\":\"\",\"monto\":0}]}\n```\n\n- Usa `null` cuando un dato no se vea. No inventes.\n- En los movimientos bancarios, los cargos van en negativo y los abonos en positivo.\n- Cada lectura queda «por revisar» hasta que una persona la registra.\n- **Asociación sugerida:**\n  - una factura va con la orden del mismo proveedor (por RUC o nombre) y el mismo total (±S/ 1);\n  - un voucher va con el comprobante cuyo saldo coincide;\n  - un movimiento bancario se concilia con un pago del mismo monto (±S/ 1) y fecha cercana (±5 días); el ITF y las comisiones se clasifican aparte.\n\n## Estados financieros (controles)\n\n- Activo = pasivo + patrimonio.\n- El resultado del ejercicio en el balance es igual al del estado de resultados.\n- Señala: patrimonio negativo, deuda con accionistas que convendría capitalizar, falta de efectivo o bancos, liquidez corriente y endeudamiento.\n- Son estados de gestión: los oficiales los firma la contadora.\n\n## Forma de trabajar\n\n- La IA propone y Gerencia aprueba. No apruebes pagos ni firmes por nadie.\n- Usa solo datos del ERP o de los documentos. Si falta un dato, dilo.\n- Cifras en soles (S/ 1,234.56), fechas dd/mm/aaaa, horas de Lima.\n- Responde en español de Perú, breve, con la acción recomendada al final.\n- Las claves y secretos viven en n8n o en el directorio privado del servidor; nunca en el código, en el JSON ni en el chat."};

async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}catch(_){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))|0;return (h>>>0).toString(16).toUpperCase().padStart(24,'0')}}

const wq=new Map();
function writeDoc(col,obj){const k=col+'/'+obj.id;const prev=wq.get(k)||Promise.resolve();const p=prev.catch(()=>{}).then(()=>db.collection(col).doc(obj.id).set(cp(obj)));wq.set(k,p);p.finally(()=>{if(wq.get(k)===p)wq.delete(k)});return p}

async function put(col,obj,{silent}={}){
  obj.upd=new Date().toISOString();D[col]={...D[col],[obj.id]:obj};
  if(mode==='db'){try{await writeDoc(col,obj)}catch(e){writeErr(e)}}else if(mode==='crm'){try{const r=await crmRpc('claraPut',col,obj);if(r&&r.upd)obj.upd=r.upd}catch(e){toast(e.message||'No se pudo guardar en el CRM.')}}else saveLocal();
  if(!silent)schedule(true);
}
async function del(col,id){const n={...D[col]};delete n[id];D[col]=n;if(mode==='db'){try{await db.collection(col).doc(id).delete()}catch(e){writeErr(e)}}else if(mode==='crm'){try{await crmRpc('claraDelete',col,id)}catch(e){toast(e.message)}}else saveLocal();schedule(true)}

async function popUndo(){const u=undoStack.pop();if(!u)return;for(const [col,id,before] of u){if(before)await put(col,before,{silent:true});else await del(col,id)}schedule(true)}

async function crmRpc(name,...args){
  const r=await fetch('/api/rpc/db.'+name,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Orok-Request':'1',...(INSTALADA_?{'X-Orok-Instalada':'1'}:{})},body:JSON.stringify({args})});
  let j=null;try{j=await r.json()}catch(_){}
  if(r.status===401)throw Error('Tu sesión del CRM expiró. Vuelve a ingresar.');
  if(!r.ok)throw Error(j&&j.error||('El CRM respondió '+r.status));
  return j?j.value:null;
}
let crmAt=null;
function crmMerge(data){let ch=false;for(const c of COLS){for(const x of (data[c]||[])){if(x.eliminado){if(D[c][x.id]){const n={...D[c]};delete n[x.id];D[c]=n;ch=true}continue}const cur=D[c][x.id];if(!cur||String(cur.upd||'')<=String(x.upd||'')){D[c]={...D[c],[x.id]:x};ch=true}}}return ch}

    if(!S.firmante&&ME.name)S.firmante=ME.name;setInterval(crmPoll,20000);render();return}
  let d=null;

      e=>{if(e&&e.code==='revoked'){mode='ro';canWrite=false}toast('Se perdió la conexión en vivo con la base ('+c+'). Recarga la página.')})});
  }else{mode='local';loadLocal()}
  if(window.claude){try{userApi=await window.claude.use('user')}catch(_){}}

  if(!S.firmante&&ME.name)S.firmante=ME.name;
  if(window.claude){try{assetsApi=await window.claude.use('assets')}catch(_){assetsApi=null}}

}

/* ---------- cálculos ---------- */
function tot(o){
  const sub=r2((o.items||[]).reduce((a,i)=>a+r2((+i.cant||0)*(+i.pu||0)),0));
  const p=P(),igv=o.igv?r2(sub*p.igv):0, total=r2(sub+igv+(+o.otros||0));
  const det=(+o.detraccion_pct>0&&total>=p.detraccion.desde_monto)?Math.round(total*o.detraccion_pct/100):0;
  const ret=(o.comprobante==='Recibo por honorarios'&&sub>p.retencion_4ta.desde_monto)?r2(sub*p.retencion_4ta.tasa):0;
  return {sub,igv,total,det,ret,neto:r2(total-det-ret)};
}
const numero=o=>o.n?`${o.tipo}-${o.empresa}-${(o.fecha||'').slice(0,4)}-${pad(o.n)}${/-B$/.test(o.id)?'-B':''}`:`${o.tipo}-${o.empresa} · borrador sin número`;
const toPEN=(v,cur)=>cur==='USD'?v*(+((D.empresas.CONF||{}).tc)||3.75):v;
function provOf(o){return D.proveedores[o.empresa+'-'+slug(o.proveedor)]||null}
function canonical(o){const t=tot(o);return JSON.stringify({e:o.empresa,t:o.tipo,n:o.n,f:o.fecha,p:o.proveedor,c:o.comprobante,m:o.moneda,i:o.igv,d:o.detraccion_pct,it:(o.items||[]).map(i=>[i.descripcion,i.unidad,+i.cant,+i.pu]),pr:o.proyecto,pa:o.partida,co:o.condiciones,tot:t.total.toFixed(2)})}
const vcode=h=>h?[h.slice(0,4),h.slice(4,8),h.slice(8,12)].join('-'):'';
function ordFlags(o){
  const f=[],t=tot(o),g=o.origen;
  if(g){if(g.repetido)f.push('Número repetido en el Excel');if(g.n_hoja&&g.n_hoja!==pad(o.n))f.push(`La hoja dice ${g.n_hoja} y la orden ${pad(o.n)}`);
    if(g.subtotal&&Math.abs(g.subtotal-t.sub)>0.05)f.push(`El Excel suma ${nf(g.subtotal)} y cant × p.u. da ${nf(t.sub)}`);}
  if(!t.total&&o.estado!=='Anulada')f.push('Total en cero (sin precios)');
  if(o.igv&&(o.items||[]).some(i=>i.ref))f.push('Posible IGV duplicado: las líneas citan comprobantes ya emitidos');
  const p=provOf(o);
  if(p&&p.tipo==='Persona natural'&&o.igv)f.push('Proveedor persona con IGV: ¿es recibo por honorarios?');
  if(!o.partida)f.push('Sin partida de presupuesto');
  if(p&&!p.ruc)f.push('Proveedor sin RUC/DNI');
  if(p&&p.notas)f.push('Cuenta del proveedor por confirmar');
  return f;
}
function cxpCalc(c){
  const det=(+c.detraccion_pct>0&&c.total>=P().detraccion.desde_monto)?Math.round(c.total*c.detraccion_pct/100):0, ret=r2(+c.retencion||0);
  const pg=Object.values(D.pagos).filter(p=>p.cxp===c.id);
  const pProv=r2(pg.filter(p=>p.tipo!=='detraccion').reduce((a,p)=>a+(+p.monto||0),0)), pDet=r2(pg.filter(p=>p.tipo==='detraccion').reduce((a,p)=>a+(+p.monto||0),0));
  const neto=r2(c.total-det-ret), saldo=r2(neto-pProv), saldoDet=r2(det-pDet), vence=addDays(c.emision,c.plazo_dias||0);
  const pagado=c.estado==='anulado'?false:saldo<=0.01&&saldoDet<=0.01;
  const dias=diffDays(vence,today());
  return {det,ret,neto,pProv,pDet,saldo,saldoDet,vence,pagado,dias,pagos:pg};
}
function cxpEstado(c,k=cxpCalc(c)){if(c.estado==='anulado')return['Anulado','n'];if(k.pagado)return['Pagado','ok'];if(k.saldo<=0.01&&k.saldoDet>0)return['Falta detracción','w'];if(k.dias<0)return[`Vencido hace ${-k.dias} d`,'b'];if(k.dias===0)return['Vence hoy','b'];if(k.dias<=7)return[`Vence en ${k.dias} d`,'w'];return[c.estado==='aprobado'?'Aprobado para pago':'Pendiente','i']}
function alertas(){
  const A=[],hoy=today();
  for(const c of L('cxp')){if(c.estado==='anulado')continue;const k=cxpCalc(c);if(k.pagado)continue;
    const base={id:c.id,emp:c.empresa,tab:'cxp',monto:k.saldo>0?k.saldo:k.saldoDet,cur:c.moneda,ej:c.ejemplo};
    if(k.saldo>0.01){
      if(k.dias<0)A.push({...base,sev:'b',grp:'Vencidos',t:`${c.proveedor} · ${c.serie}`,d:`Venció el ${fdate(k.vence)} (hace ${-k.dias} días)${c.estado!=='aprobado'?' · falta aprobación de Gerencia':''}`});
      else if(k.dias===0)A.push({...base,sev:'b',grp:'Vence hoy',t:`${c.proveedor} · ${c.serie}`,d:`Vence hoy ${fdate(k.vence)}`});
      else if(k.dias<=7)A.push({...base,sev:'w',grp:'Por vencer (7 días)',t:`${c.proveedor} · ${c.serie}`,d:`Vence el ${fdate(k.vence)} · en ${k.dias} días`});
      else A.push({...base,sev:'i',grp:'Pendientes',t:`${c.proveedor} · ${c.serie}`,d:`Vence el ${fdate(k.vence)}`});
      if(c.estado!=='aprobado')A.push({...base,sev:'w',grp:'Por aprobar pago (Gerencia)',t:`${c.proveedor} · ${c.serie}`,d:'El comprobante está registrado pero el pago no está aprobado'});
    }
    if(k.saldoDet>0.01&&k.pProv>0)A.push({...base,monto:k.saldoDet,sev:'w',grp:'Detracciones por depositar',t:`${c.proveedor} · ${c.serie}`,d:`Detracción de ${S_(k.det)} en el Banco de la Nación. Plazo: hasta el 5.º día hábil del mes siguiente al pago (confirmar con Contabilidad)`});
  }
  for(const p of L('pagos')){if(!p.voucher&&p.tipo!=='detraccion')A.push({id:p.id,emp:p.empresa,tab:'pagos',sev:'n',grp:'Pagos sin voucher',t:`${p.proveedor} · ${fdate(p.fecha)}`,d:'Sube la foto o PDF del abono',monto:p.monto,cur:p.moneda,ej:p.ejemplo});
    else if(!p.correo&&p.tipo!=='detraccion')A.push({id:p.id,emp:p.empresa,tab:'pagos',sev:'n',grp:'Correos de pago sin enviar',t:`${p.proveedor} · ${fdate(p.fecha)}`,d:'Prepara el correo con el voucher para el proveedor',monto:p.monto,cur:p.moneda,ej:p.ejemplo})}
  for(const o of L('ordenes')){if(o.estado==='En aprobación'){const h=(o.hist||[]).filter(x=>x.e==='En aprobación').at(-1);const dd=h?diffDays(hoy,h.f):0;A.push({id:o.id,emp:o.empresa,tab:'orden',sev:dd>2?'w':'i',grp:'Órdenes por aprobar',t:`${numero(o)} · ${o.proveedor}`,d:`En aprobación desde hace ${dd} días`,monto:tot(o).total,cur:o.moneda})}}
  const nb=L('banco').filter(b=>!b.pago&&!b.cat&&b.monto<0).length;if(nb)A.push({id:'',tab:'bancos',sev:'n',grp:'Movimientos bancarios sin conciliar',t:`${nb} cargos sin explicar`,d:'Concilia con los pagos registrados o clasifícalos (comisión, ITF, impuestos…)',monto:L('banco').filter(b=>!b.pago&&!b.cat&&b.monto<0).reduce((a,b)=>a-b.monto,0)});
  cobAlertas(A);
  const ord={b:0,w:1,i:2,n:3};return A.sort((a,b)=>ord[a.sev]-ord[b.sev]);
}
function kpis(){
  const hoy=today(),mes=hoy.slice(0,7);let porPagar=0,venc=0,sem=0;
  for(const c of L('cxp')){if(c.estado==='anulado')continue;const k=cxpCalc(c);if(k.pagado)continue;const s=toPEN(Math.max(0,k.saldo)+Math.max(0,k.saldoDet),c.moneda);porPagar+=s;if(k.dias<0)venc+=s;else if(k.dias<=7)sem+=s}
  const anio=hoy.slice(0,4);const comp=L('ordenes').filter(o=>COMPROMETE.has(o.estado)&&(o.fecha||'').startsWith(anio)).reduce((a,o)=>a+toPEN(tot(o).total,o.moneda),0);
  const pagMes=L('pagos').filter(p=>(p.fecha||'').startsWith(mes)).reduce((a,p)=>a+toPEN(+p.monto||0,p.moneda),0);
  const banco=L('banco').reduce((a,b)=>a+(+b.monto||0),0);
  return {comp,porPagar,venc,sem,pagMes,banco,anio};
}

const chip=(t,c)=>`<span class="chip ${c}">${esc(t)}</span>`;
const ejChip=x=>x&&x.ejemplo?' '+chip('Ejemplo','ej'):'';
function estChip(e){const m={'Importada':'n','Borrador':'n','En aprobación':'w','Aprobada':'i','Enviada':'i','Recibida':'i','Facturada':'w','Pagada':'ok','Cerrada':'ok','Anulada':'b'};return chip(e,m[e]||'n')}
const ro=()=>!canWrite;
const dis=b=>b||ro()?' disabled':'';
function empCol(){return S.emp==='ALL'}
function sect(t,p,acts=''){return `<div class="sect-h"><div><h2>${t}</h2>${p?`<p>${p}</p>`:''}</div>${acts?`<div class="toolbar">${acts}</div>`:''}</div>`}
const V={};

/* ---------- Panel ---------- */
V.panel=()=>{
  const A=alertas(),k=kpis();
  const byP={};for(const o of L('ordenes'))if(COMPROMETE.has(o.estado)){const p=o.partida||'Sin partida';byP[p]=(byP[p]||0)+toPEN(tot(o).total,o.moneda)}
  const pr=Object.entries(byP).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...pr.map(x=>x[1]));
  const byV={};for(const o of L('ordenes'))if(COMPROMETE.has(o.estado)){byV[o.proveedor]=(byV[o.proveedor]||0)+toPEN(tot(o).total,o.moneda)}
  const pv=Object.entries(byV).sort((a,b)=>b[1]-a[1]).slice(0,8);const mv=Math.max(1,...pv.map(x=>x[1]));
  const fl=L('ordenes').filter(o=>ordFlags(o).some(f=>!/partida|RUC|Cuenta/.test(f)));
  const est={};L('ordenes').forEach(o=>est[o.estado]=(est[o.estado]||0)+1);
  return `${ro()?'<div class="ro-banner">Tienes acceso de solo lectura. Para registrar órdenes, pagos o movimientos pide acceso como Colaborador o Editor.</div>':''}
  ${sect('Panel financiero','Lo que está comprometido, lo que se debe y lo que vence, para la empresa elegida. Cambia de empresa arriba a la derecha.',`<button class="btn pri" data-act="new" data-tipo="OC"${dis()}>Nueva OC</button><button class="btn pri" data-act="new" data-tipo="OS"${dis()}>Nueva OS</button>`)}
  <div class="grid2">
    <div class="panel"><h3>Alertas prioritarias</h3>${A.length?`<ul class="alist">${A.slice(0,7).map(alertLi).join('')}</ul>${A.length>7?`<p class="note"><button class="btn" data-tab="alertas">Ver las ${A.length} alertas</button></p>`:''}`:'<p class="mut">Sin alertas. Todo lo registrado está al día.</p>'}</div>
    <div class="panel"><h3>Órdenes por estado</h3><div class="kv2">${ESTADOS.filter(e=>est[e]).map(e=>`<span>${estChip(e)}</span><b>${est[e]} orden${est[e]>1?'es':''}</b>`).join('')||'<span class="mut">Sin órdenes</span>'}</div>
      ${fl.length?`<p class="note">${fl.length} órdenes tienen observaciones del Excel original (número repetido, subtotal que no cuadra, posible IGV duplicado). <button class="btn x" data-act="filtro-obs">Ver</button></p>`:''}
      ${est['Importada']?`<p class="note">${est['Importada']} órdenes vienen del Excel con estado «Importada»: Gerencia confirma el estado real de cada una (pagada, cerrada…) desde su detalle.</p>`:''}</div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>Gasto comprometido por partida</h3>${pr.map(([p,v])=>`<div class="hb"><span>${esc(p)}</span><div class="bar"><span style="width:${v/mx*100}%"></span></div><b>${S_(v)}</b></div>`).join('')||'<p class="mut">Sin órdenes</p>'}</div>
    <div class="panel"><h3>Principales proveedores</h3>${pv.map(([p,v])=>`<div class="hb"><span>${esc(p)}</span><div class="bar"><span style="width:${v/mv*100}%"></span></div><b>${S_(v)}</b></div>`).join('')||'<p class="mut">Sin órdenes</p>'}</div>
  </div>`;
};
function alertLi(a){return `<li><span class="dot ${a.sev}"></span><span class="t">${esc(a.t)}${a.ej?' '+chip('Ejemplo','ej'):''}${empCol()&&a.emp?' '+chip(a.emp,'n'):''}</span><span class="amt">${a.monto?money(a.monto,a.cur):''}</span><span class="d">${esc(a.grp)} · ${esc(a.d)}</span><button class="btn x" data-go="${a.tab}" data-id="${esc(a.id)}">Abrir</button></li>`}

/* ---------- Alertas ---------- */
V.alertas=()=>{
  const A=alertas();const g={};A.forEach(a=>(g[a.grp]=g[a.grp]||[]).push(a));
  return sect('Alertas de pago','Se calculan con la fecha de hoy en Lima, los comprobantes registrados y sus plazos. C.L.A.R.A puede priorizarlas y armar el plan de pagos de la semana.',`<button class="btn" data-ask="Arma el plan de pagos de esta semana con las alertas actuales, priorizando vencidos y detracciones, y dime cuánto efectivo necesito.">Plan de pagos con C.L.A.R.A</button>`)+
  (A.length?Object.entries(g).map(([k,v])=>`<div class="panel"><h3>${esc(k)} · ${v.length} · ${S_(v.reduce((a,x)=>a+toPEN(x.monto||0,x.cur),0))}</h3><ul class="alist">${v.map(alertLi).join('')}</ul></div>`).join(''):'<div class="panel"><p class="mut">No hay alertas.</p></div>')+
  `<p class="note">Reglas: «por vencer» son comprobantes con saldo que vencen en 7 días o menos. La detracción se deposita en la cuenta del proveedor en el Banco de la Nación; el porcentaje depende del bien o servicio (confírmalo con Contabilidad). La retención de 8 % se aplica a recibos por honorarios mayores a S/ 1,500.</p>`;
};

/* ---------- Órdenes ---------- */
V.ordenes=()=>{
  const q=S.q.toLowerCase();
  let os=L('ordenes').filter(o=>(!S.fTipo||o.tipo===S.fTipo)&&(!S.fEst||(S.fEst==='obs'?ordFlags(o).length:o.estado===S.fEst))&&(!S.fProy||o.proyecto===S.fProy)&&(!q||[numero(o),o.proveedor,o.proyecto,o.partida,...(o.items||[]).map(i=>i.descripcion)].join(' ').toLowerCase().includes(q)));
  os.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||b.n-a.n);
  const proys=[...new Set(L('ordenes').map(o=>o.proyecto).filter(Boolean))];
  const sum=os.reduce((a,o)=>a+toPEN(tot(o).total,o.moneda),0);
  return sect('Órdenes de compra y de servicio',`${os.length} órdenes · ${S_(sum)}. Haz clic en una fila para ver, firmar o imprimir. Las órdenes del Excel llegan como «Importada» con sus observaciones.`,
   `<button class="btn pri" data-act="new" data-tipo="OC"${dis()}>Nueva OC</button><button class="btn pri" data-act="new" data-tipo="OS"${dis()}>Nueva OS</button>`)+
  `<div class="toolbar"><input type="search" id="fq" placeholder="Buscar proveedor, número, ítem…" value="${esc(S.q)}" data-ui="q">
   <select data-ui="fTipo"><option value="">OC y OS</option><option ${S.fTipo==='OC'?'selected':''}>OC</option><option ${S.fTipo==='OS'?'selected':''}>OS</option></select>
   <select data-ui="fEst"><option value="">Todos los estados</option><option value="obs" ${S.fEst==='obs'?'selected':''}>Con observaciones</option>${ESTADOS.map(e=>`<option ${S.fEst===e?'selected':''}>${e}</option>`).join('')}</select>
   <select data-ui="fProy"><option value="">Todos los proyectos</option>${proys.map(p=>`<option ${S.fProy===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
  <div class="tw"><table><thead><tr><th>Número</th>${empCol()?'<th>Emp.</th>':''}<th>Fecha</th><th>Proveedor</th><th>Proyecto · partida</th><th class="n">Total</th><th>Estado</th><th>Observaciones</th></tr></thead><tbody>
  ${os.map(o=>{const t=tot(o),f=ordFlags(o);return `<tr class="clk" data-open="${esc(o.id)}"><td><b>${esc(numero(o))}</b></td>${empCol()?`<td>${o.empresa}</td>`:''}<td>${fdate(o.fecha)}</td><td class="wrap">${esc(o.proveedor)}</td><td class="wrap">${esc(o.proyecto)}<br><span class="mut">${esc(o.partida||'Sin partida')}</span></td><td class="n">${money(t.total,o.moneda)}</td><td>${estChip(o.estado)}</td><td class="wrap">${f.map(x=>`<span class="flag">• ${esc(x)}</span>`).join('')||'<span class="mut">—</span>'}</td></tr>`}).join('')||`<tr><td colspan="8" class="mut">Sin órdenes con estos filtros.</td></tr>`}
  </tbody></table></div>`;
};

/* ---------- Detalle de orden ---------- */
let HASHES={},HASH_INPUTS={};
async function refreshHash(o){const input=canonical(o);if(HASH_INPUTS[o.id]===input&&HASHES[o.id])return HASHES[o.id];const h=await sha(input);if(D.ordenes[o.id]&&canonical(D.ordenes[o.id])!==input)return '';HASH_INPUTS[o.id]=input;if(HASHES[o.id]!==h){HASHES[o.id]=h;schedule()}return h}
V.orden=()=>{
  const o=D.ordenes[S.sel];if(!o)return sect('Orden no encontrada','Puede haberse eliminado.',`<button class="btn" data-tab="ordenes">Volver a órdenes</button>`);
  if(HASH_INPUTS[o.id]!==canonical(o)){delete HASHES[o.id];refreshHash(o)}
  const h=HASHES[o.id]||'',t=tot(o),lock=!['Borrador','Importada'].includes(o.estado)||ro(),f=ordFlags(o),p=provOf(o)||{};
  const provs=Object.values(D.proveedores).filter(x=>x.empresa===o.empresa);
  const partidas=[...new Set(Object.values(D.presupuesto).filter(x=>x.empresa===o.empresa).map(x=>x.partida).concat(Object.values(D.ordenes).filter(x=>x.empresa===o.empresa).map(x=>x.partida)).filter(Boolean))].sort();
  const proys=[...new Set(Object.values(D.proyectos).filter(x=>x.empresa===o.empresa).map(x=>x.nombre).concat(Object.values(D.ordenes).filter(x=>x.empresa===o.empresa).map(x=>x.proyecto)).concat(Object.values(D.presupuesto).filter(x=>x.empresa===o.empresa).map(x=>x.proyecto)).filter(Boolean))];
  const A=(f,v,typ='text',x='')=>`<input type="${typ}" data-col="ordenes" data-id="${esc(o.id)}" data-f="${f}" value="${esc(v??'')}" ${typ==='number'?'step="any"':''}${dis(lock)} ${x}>`;
  const cx=Object.values(D.cxp).filter(c=>c.orden===o.id);
  const idx=FLUJO.indexOf(o.estado);
  const sigs=(o.firmas||[]).map(s=>{const ok=s.hash===h;return `<div class="sig ${!h?'':ok?'ok':'bad'}"><span class="mut" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase">${esc(s.rol)}</span><b>${esc(s.nombre)}</b><span>${esc(s.cargo||'')}</span><small>${esc(s.fecha)} · ${!h?'Verificando firma…':ok?'código '+vcode(s.hash):'INVÁLIDA: la orden cambió después de firmar'}</small></div>`}).join('');
  const W=[];const G=GER();
  if(!ro()){
    if(o.estado==='En aprobación'&&!o.aprobacion&&G)W.push(`<button class="btn" data-act="reabrir">Volver a borrador para enviarla con su cadena</button>`);
    if(!SOL()){
    if(o.estado==='Aprobada'){W.push(`<button class="btn pri" data-act="mail-orden">Preparar correo al proveedor</button>`);W.push(`<button class="btn" data-act="wf" data-to="Enviada">Marcar como enviada</button>`)}
    if(o.estado==='Enviada'||o.estado==='Aprobada')W.push(`<button class="btn" data-act="wf" data-to="Recibida">Firmar conformidad / recepción</button>`);
    if(['Aprobada','Enviada','Recibida','Importada','Facturada'].includes(o.estado))W.push(`<button class="btn${o.estado==='Recibida'?' pri':''}" data-act="cxp-new">Registrar comprobante del proveedor</button>`);
    if(o.estado==='Pagada')W.push(`<button class="btn" data-act="wf" data-to="Cerrada">Cerrar orden</button>`);
    if(['Aprobada','Enviada','Recibida'].includes(o.estado)&&G)W.push(`<button class="btn" data-act="reabrir">Reabrir para corregir (nueva revisión)</button>`);
    if(!['Pagada','Cerrada','Anulada'].includes(o.estado)&&G)W.push(`<button class="btn x" data-act="anular">Anular</button>`);
    }
  }
  return `<div class="sect-h"><div><p><button class="btn x" data-tab="ordenes">← Órdenes</button></p><h2>${o.tipo==='OC'?'Orden de compra':'Orden de servicio'} ${esc(numero(o))} ${estChip(o.estado)}</h2>
    <p>${esc(EMP(o.empresa).razon)}${o.solicitante?' · elaboró '+esc(o.solicitante.nombre)+(o.solicitante.area?' ('+esc(o.solicitante.area)+')':''):''} · revisión ${o.revision||0}${o.origen?` · número anterior ${esc(o.origen.numero)} (hoja «${esc(o.origen.hoja)}»)`:''}</p>
    <ul class="steps">${FLUJO.map((e,i)=>`<li class="${e===o.estado?'on':i<idx?'done':''}">${e}</li>`).join('')}</ul></div>
    <div class="toolbar"><button class="btn${emitible(o)?' pri':''}" data-act="print">${emitible(o)?'Formato para imprimir / PDF':'Vista previa del formato'}</button><button class="btn" data-act="dup"${dis()}>Duplicar</button>${o.estado==='Borrador'&&!ro()?`<button class="btn x" data-act="del-orden">Eliminar borrador</button>`:''}</div></div>
  ${f.length?`<div class="panel"><h3>Observaciones</h3><ul class="chk">${f.map(x=>`<li><span class="dot w" style="margin-top:6px"></span>${esc(x)}</li>`).join('')}</ul>${f.some(x=>/partida/.test(x))&&!SOL()?`<p class="note"><button class="btn" data-ask="Propón la partida de presupuesto para las órdenes sin partida de ${esc(o.empresa)}, según el proveedor y los ítems, y aplícala si es obvia.">Que C.L.A.R.A proponga partidas</button></p>`:''}</div>`:''}
  <div class="ogrid"><div style="display:flex;flex-direction:column;gap:18px;min-width:0">
   <div class="panel"><h3>Datos generales</h3><div class="fields">
    <div class="f"><label>Empresa que emite</label><select data-act-change="mover-emp"${dis(o.estado!=='Borrador')}>${(SOL()?ME.empresas:['BMG','MZA','MAAS']).map(c=>`<option value="${c}" ${o.empresa===c?'selected':''}>${c} · ${esc(EMP(c).razon)}</option>`).join('')}</select></div>
    <div class="f"><label>Fecha</label>${A('fecha',o.fecha,'date')}</div>
    <div class="f"><label>Proveedor</label>${A('proveedor',o.proveedor,'text','list="dlProv"')}<datalist id="dlProv">${provs.map(x=>`<option value="${esc(x.nombre)}">`).join('')}</datalist></div>
    <div class="f"><label>Proyecto</label>${A('proyecto',o.proyecto,'text','list="dlProy"')}<datalist id="dlProy">${proys.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>
    <div class="f"><label>Partida de presupuesto</label><input data-col="ordenes" data-id="${esc(o.id)}" data-f="partida" value="${esc(o.partida||'')}" list="dlPart"${dis(lock)}><datalist id="dlPart">${partidas.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>
    <div class="f"><label>Comprobante esperado</label><select data-col="ordenes" data-id="${esc(o.id)}" data-f="comprobante"${dis(lock)}>${COMPROBANTES.map(c=>`<option ${o.comprobante===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="f"><label>Moneda</label><select data-col="ordenes" data-id="${esc(o.id)}" data-f="moneda"${dis(lock)}><option value="PEN" ${o.moneda!=='USD'?'selected':''}>Soles</option><option value="USD" ${o.moneda==='USD'?'selected':''}>Dólares</option></select></div>
    <div class="f"><label><input type="checkbox" data-col="ordenes" data-id="${esc(o.id)}" data-f="igv" data-t="bool" ${o.igv?'checked':''}${dis(lock)}> Afecta a IGV 18 %</label></div>
    <div class="f"><label>Detracción SPOT %</label>${A('detraccion_pct',o.detraccion_pct||0,'number')}</div>
    <div class="f"><label>Cotización / proforma</label>${A('proforma',o.proforma)}</div>
    <div class="f"><label>Requerimiento</label>${A('requerimiento',o.requerimiento)}</div>
   </div></div>
   <div class="panel"><h3>Ítems</h3><div class="tw"><table><thead><tr><th>#</th><th>Descripción</th><th>Und.</th><th class="n">Cant.</th><th class="n">P. unitario</th><th class="n">Parcial</th><th></th></tr></thead><tbody>
    ${(o.items||[]).map((i,k)=>`<tr><td>${k+1}</td><td><input class="w" style="min-width:280px" data-col="ordenes" data-id="${esc(o.id)}" data-f="items.${k}.descripcion" value="${esc(i.descripcion)}"${dis(lock)}>${i.ref?`<small class="mut">Comprobante ${esc(i.ref)}</small>`:''}</td><td><input class="xs" data-col="ordenes" data-id="${esc(o.id)}" data-f="items.${k}.unidad" value="${esc(i.unidad||'und')}"${dis(lock)}></td>
     <td class="n"><input class="s" type="number" step="any" data-t="num" data-col="ordenes" data-id="${esc(o.id)}" data-f="items.${k}.cant" value="${i.cant}"${dis(lock)}></td><td class="n"><input class="s" type="number" step="any" data-t="num" data-col="ordenes" data-id="${esc(o.id)}" data-f="items.${k}.pu" value="${i.pu}"${dis(lock)}></td><td class="n">${nf(r2((+i.cant||0)*(+i.pu||0)))}</td><td>${lock?'':`<button class="btn x" data-act="item-del" data-i="${k}" aria-label="Quitar ítem">✕</button>`}</td></tr>`).join('')}
   </tbody></table></div>${lock?'':`<p class="note"><button class="btn" data-act="item-add">Agregar ítem</button></p>`}
   <dl class="totals"><dt>Subtotal</dt><dd>${money(t.sub,o.moneda)}</dd><dt>${o.igv?'IGV 18 %':'IGV (no aplica)'}</dt><dd>${money(t.igv,o.moneda)}</dd><dt class="g">Total</dt><dd class="g">${money(t.total,o.moneda)}</dd>
    ${t.det?`<dt class="s">Detracción ${o.detraccion_pct} % (redondeada)</dt><dd class="s">${money(-t.det,o.moneda)}</dd>`:''}${t.ret?`<dt class="s">Retención 4.ª categoría 8 %</dt><dd class="s">${money(-t.ret,o.moneda)}</dd>`:''}${t.det||t.ret?`<dt><b>Neto al proveedor</b></dt><dd><b>${money(t.neto,o.moneda)}</b></dd>`:''}</dl></div>
   <div class="panel"><h3>${o.tipo==='OC'?'Entrega':'Ejecución del servicio'} y condiciones</h3><div class="fields">
    <div class="f"><label>Lugar</label>${A('destino.lugar',o.destino?.lugar)}</div><div class="f"><label>Dirección</label>${A('destino.direccion',o.destino?.direccion)}</div>
    <div class="f"><label>Contacto en obra</label>${A('destino.contacto',o.destino?.contacto)}</div><div class="f"><label>Horario / plazo</label>${A('destino.horario',o.destino?.horario)}</div>
    <div class="f"><label>Forma de pago</label>${A('condiciones.pago',o.condiciones?.pago,'text','placeholder="Ej.: 50 % adelanto, 50 % contra entrega"')}</div>
    <div class="f"><label>Plazo de pago (días desde la factura)</label>${A('condiciones.plazo_dias',o.condiciones?.plazo_dias??15,'number','data-t="num"')}</div>
    <div class="f"><label>Garantía</label>${A('condiciones.garantia',o.condiciones?.garantia)}</div><div class="f"><label>Penalidad</label>${A('condiciones.penalidad',o.condiciones?.penalidad)}</div>
   </div><div class="f" style="margin-top:10px"><label>Observaciones</label><textarea data-col="ordenes" data-id="${esc(o.id)}" data-f="obs" style="min-height:60px;font-family:var(--f-body)"${dis(lock)}>${esc(o.obs||'')}</textarea></div>
   ${o.cuenta_pago?`<p class="note">Cuenta anotada en el Excel: ${esc(o.cuenta_pago)}</p>`:''}</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:18px">
   <div class="panel"><h3>Aprobación</h3>${cadenaPanel(o)}</div>
   <div class="panel"><h3>Flujo y firmas</h3>
    <div class="fields" style="grid-template-columns:1fr 1fr"><div class="f"><label>Firmas como</label><input data-ui="firmante" value="${esc(S.firmante)}" placeholder="Tu nombre"></div><div class="f"><label>Cargo</label><input data-ui="cargo" value="${esc(S.cargo)}" placeholder="Ej.: Compras"></div></div>
    <div class="row" style="margin:10px 0">${W.join('')}</div>
    ${o.estado==='Importada'&&!ro()?`<div class="f"><label>Estado real de esta orden (Gerencia)</label><select data-act-change="estado-real"${G?'':' disabled'}><option value="">Elegir…</option>${['Aprobada','Enviada','Recibida','Facturada','Pagada','Cerrada','Anulada'].map(e=>`<option>${e}</option>`).join('')}</select></div>`:''}
    <div class="sigs" style="margin-top:10px">${sigs||'<p class="mut" style="margin:0">Sin firmas todavía.</p>'}</div>

/* ---------- Presupuesto y curva S ---------- */
function proyectos(){return [...new Set(L('presupuesto').map(p=>p.proyecto).concat(L('ordenes').map(o=>o.proyecto)).filter(Boolean))].sort()}
const ym=d=>(d||'').slice(0,7);
function nextYm(m){let [y,mm]=m.split('-').map(Number);mm++;if(mm>12){mm=1;y++}return y+'-'+String(mm).padStart(2,'0')}
function presModel(proy){
  const P=L('presupuesto').filter(p=>p.proyecto===proy);
  const O=L('ordenes').filter(o=>o.proyecto===proy&&COMPROMETE.has(o.estado));
  const oid=new Set(O.map(o=>o.id));
  const C=Object.values(D.cxp).filter(c=>oid.has(c.orden)&&c.estado!=='anulado');
  const Pg=Object.values(D.pagos).filter(p=>oid.has(p.orden)||(D.cxp[p.cxp]&&oid.has(D.cxp[p.cxp].orden)));
  const parts=[...new Set(P.map(p=>p.partida).concat(O.map(o=>o.partida||'Sin partida')))];
  const rows=parts.map(n=>{const pp=P.filter(p=>p.partida===n);const oo=O.filter(o=>(o.partida||'Sin partida')===n);const ids=new Set(oo.map(o=>o.id));
    const monto=pp.reduce((a,p)=>a+(+p.monto||0),0),comp=oo.reduce((a,o)=>a+toPEN(tot(o).total,o.moneda),0),dev=C.filter(c=>ids.has(c.orden)).reduce((a,c)=>a+toPEN(c.total,c.moneda),0),pag=Pg.filter(p=>ids.has(p.orden)||(D.cxp[p.cxp]&&ids.has(D.cxp[p.cxp].orden))).reduce((a,p)=>a+toPEN(+p.monto||0,p.moneda),0);
    return {n,pp,monto,comp,dev,pag,saldo:monto-comp,ej:pp.some(p=>p.ejemplo)}});
  // curva S
  let m0=null,m1=null;const sp=x=>{if(!x)return;if(!m0||x<m0)m0=x;if(!m1||x>m1)m1=x};
  P.forEach(p=>{if(p.inicio){sp(p.inicio);let m=p.inicio;for(let i=1;i<(+p.meses||1);i++)m=nextYm(m);sp(m)}});O.forEach(o=>sp(ym(o.fecha)));Pg.forEach(p=>sp(ym(p.fecha)));
  const months=[];if(m0){let m=m0;while(m<=m1&&months.length<120){months.push(m);m=nextYm(m)}}
  const plan={},comp={},pag={};
  P.forEach(p=>{let m=p.inicio;const k=Math.max(1,+p.meses||1);if(!m)return;for(let i=0;i<k;i++){plan[m]=(plan[m]||0)+(+p.monto||0)/k;m=nextYm(m)}});
  O.forEach(o=>{const m=ym(o.fecha);comp[m]=(comp[m]||0)+toPEN(tot(o).total,o.moneda)});Pg.forEach(p=>{const m=ym(p.fecha);pag[m]=(pag[m]||0)+toPEN(+p.monto||0,p.moneda)});
  let a=0,b=0,c=0;const hoy=ym(today());
  const curve=months.map(m=>{a+=plan[m]||0;b+=comp[m]||0;c+=pag[m]||0;return {m,plan:plan[m]||0,comp:comp[m]||0,pag:pag[m]||0,aPlan:a,aComp:m<=hoy?b:null,aPag:m<=hoy?c:null}});
  const tot_={monto:rows.reduce((x,r)=>x+r.monto,0),comp:rows.reduce((x,r)=>x+r.comp,0),dev:rows.reduce((x,r)=>x+r.dev,0),pag:rows.reduce((x,r)=>x+r.pag,0)};
  return {rows,curve,tot:tot_};
}
function sChart(curve){
  if(curve.length<2)return '<p class="mut">Se necesitan al menos dos meses con datos para dibujar la curva.</p>';
  const W=720,H=240,pl=64,pb=28,pt=10,pr=10,mx=Math.max(1,...curve.map(c=>Math.max(c.aPlan,c.aComp||0,c.aPag||0)));
  const x=i=>pl+i*(W-pl-pr)/(curve.length-1),y=v=>pt+(H-pt-pb)*(1-v/mx);
  const line=(k,col,dash)=>{const pts=curve.map((c,i)=>c[k]==null?null:`${x(i).toFixed(1)},${y(c[k]).toFixed(1)}`).filter(Boolean);return pts.length>1?`<polyline fill="none" stroke="${col}" stroke-width="2.4" ${dash?'stroke-dasharray="5 4"':''} points="${pts.join(' ')}"/>`:''};
  const ticks=[0,.25,.5,.75,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(mx*f)}" y2="${y(mx*f)}" stroke="currentColor" stroke-opacity=".12"/><text x="${pl-6}" y="${y(mx*f)+3}" text-anchor="end">${mx*f>=1e6?nf(mx*f/1e6,1)+' M':nf(mx*f/1e3,0)+' k'}</text>`).join('');
  const step=Math.ceil(curve.length/10);const xl=curve.map((c,i)=>i%step===0||i===curve.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${c.m.slice(2).replace('-','/')}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva S: plan, comprometido y pagado acumulados">${ticks}${xl}${line('aPlan','var(--muted)',1)}${line('aComp','var(--d2)')}${line('aPag','var(--accent)')}</svg>
  <div class="legend"><span><i style="background:var(--muted)"></i>Plan (presupuesto distribuido)</span><span><i style="background:var(--d2)"></i>Comprometido (órdenes)</span><span><i style="background:var(--accent)"></i>Pagado</span></div>`;
}
V.presupuesto=()=>{
  const ps=proyectos();if(!ps.includes(S.proy))S.proy=ps[0]||'';
  if(!S.proy)return sect('Presupuesto y curva S','Aún no hay proyectos para esta empresa.',`<button class="btn pri" data-act="part-new"${dis(S.emp==='ALL')}>Agregar partida</button>`);
  const M=presModel(S.proy);const T=M.tot;
  return sect('Presupuesto y curva S',`Presupuesto por partida contra lo comprometido en órdenes, lo facturado (devengado) y lo pagado. Las partidas «Ejemplo» son referenciales: reemplázalas por el presupuesto aprobado o impórtalo desde M.O.R.A.`,
   `<select data-ui="proy">${ps.map(p=>`<option ${p===S.proy?'selected':''}>${esc(p)}</option>`).join('')}</select><button class="btn pri" data-act="part-new"${dis(S.emp==='ALL')}>Agregar partida</button>`)+
  `<div class="big"><div><label>Presupuesto</label><output>${S_(T.monto)}</output></div><div><label>Comprometido</label><output>${S_(T.comp)}</output><small>${T.monto?nf(T.comp/T.monto*100,1)+' % del presupuesto':''}</small></div><div><label>Devengado (facturas)</label><output>${S_(T.dev)}</output></div><div><label>Pagado</label><output>${S_(T.pag)}</output></div></div>
  <div class="panel"><h3>Curva S · ${esc(S.proy)}</h3>${sChart(M.curve)}</div>
  <div class="tw"><table><thead><tr><th class="stick">Partida</th><th class="n">Presupuesto</th><th>Inicio</th><th class="n">Meses</th><th class="n">Comprometido</th><th class="n">Devengado</th><th class="n">Pagado</th><th class="n">Saldo por comprometer</th><th>Avance</th><th></th></tr></thead><tbody>

const BAL=[['Activo corriente',[['efectivo','Efectivo y equivalentes'],['cxc','Cuentas por cobrar'],['existencias','Existencias (inventario inmobiliario)'],['otros_activos_corr','Otros activos corrientes']]],['Activo no corriente',[['ime_neto','Inmuebles, maquinaria y equipo (neto)'],['otros_activos_nc','Otros activos no corrientes']]],
  ['Pasivo corriente',[['cxp_proveedores','Cuentas por pagar a proveedores'],['tributos','Tributos por pagar'],['cxp_accionistas','Cuentas por pagar a accionistas'],['deuda_banco','Obligaciones financieras']]],['Pasivo no corriente',[['pasivo_nc','Pasivo no corriente']]],
  ['Patrimonio',[['capital','Capital'],['resultados_acum','Resultados acumulados'],['resultado_ejercicio','Resultado del ejercicio']]]];
const ERR=[['ventas','Ventas netas',1],['costo_ventas','Costo de ventas',-1],['gastos_ventas','Gastos de ventas',-1],['gastos_adm','Gastos de administración',-1],['otros_ingresos','Otros ingresos',1],['otros_gastos','Otros gastos',-1],['ingresos_fin','Ingresos financieros',1],['gastos_fin','Gastos financieros',-1],['impuesto','Impuesto a la renta',-1]];
function eeffCalc(e){const b=e.balance||{},r=e.resultados||{},g=k=>+b[k]||0;
  const ac=g('efectivo')+g('cxc')+g('existencias')+g('otros_activos_corr'),anc=g('ime_neto')+g('otros_activos_nc'),pc=g('cxp_proveedores')+g('tributos')+g('cxp_accionistas')+g('deuda_banco'),pnc=g('pasivo_nc'),pat=g('capital')+g('resultados_acum')+g('resultado_ejercicio');
  const res=ERR.reduce((a,[k,,s])=>a+s*(+r[k]||0),0);
  return {ac,anc,act:ac+anc,pc,pnc,pas:pc+pnc,pat,res,dif:r2(ac+anc-(pc+pnc+pat)),difRes:r2(g('resultado_ejercicio')-res)}}
V.eeff=()=>{
  const es=L('eeff').sort((a,b)=>b.periodo.localeCompare(a.periodo));
  if(!es.length)return sect('Estados financieros','No hay estados registrados para esta empresa.',`<button class="btn pri" data-act="eeff-new"${dis(S.emp==='ALL')}>Nuevo periodo</button>`);
  if(!es.some(e=>e.id===S.eeff))S.eeff=es[0].id;const e=D.eeff[S.eeff],k=eeffCalc(e);
  const In=(grp,f)=>`<input type="number" step="any" data-t="num" data-col="eeff" data-id="${esc(e.id)}" data-f="${grp}.${f}" value="${(e[grp]||{})[f]??0}"${dis()}>`;
  const chk=[];
  chk.push(Math.abs(k.dif)<1?['ok','El balance cuadra: activo = pasivo + patrimonio.']:['b',`El balance no cuadra por ${S_(k.dif)}.`]);
  if(Math.abs(k.difRes)>=1)chk.push(['b',`El resultado del balance (${S_(+e.balance.resultado_ejercicio||0)}) no coincide con el estado de resultados (${S_(k.res)}): diferencia de ${S_(k.difRes)}. Pedir la conciliación al contador.`]);
  if(k.pat<0)chk.push(['b',`Patrimonio negativo (${S_(k.pat)}). Con ${S_(+e.balance.cxp_accionistas||0)} adeudados a accionistas, evaluar con el contador capitalizar esa deuda.`]);
  if(!(+e.balance.efectivo))chk.push(['w','No figura efectivo ni saldo en bancos: confirmar con los estados de cuenta (pestaña Bancos).']);
  if(k.pc>0)chk.push([k.ac/k.pc>=1?'ok':'w',`Liquidez corriente ${nf(k.ac/k.pc,2)} (activo corriente / pasivo corriente).`]);
  if(k.act>0)chk.push(['i',`Endeudamiento ${nf(k.pas/k.act*100,1)} % del activo.`]);
  const banco=L('banco').filter(b=>ym(b.fecha)<=e.periodo).reduce((a,b)=>a+(+b.monto||0),0);
  if(L('banco').length)chk.push(['i',`Saldo de bancos importado al cierre de ${e.periodo}: ${S_(banco)}.`]);
  return sect('Estados financieros','Estado de situación y de resultados por periodo, con controles de consistencia. Son estados de gestión: los oficiales los firma el contador.',
   `<select data-ui="eeff">${es.map(x=>`<option value="${esc(x.id)}" ${x.id===S.eeff?'selected':''}>${x.empresa} · ${x.periodo}</option>`).join('')}</select><button class="btn" data-act="eeff-new"${dis(S.emp==='ALL')}>Nuevo periodo</button><button class="btn" data-ask="Analiza los estados financieros del periodo elegido como un CFO: qué riesgos ves, qué le pedirías al contador y qué decisiones tomarías.">Análisis con C.L.A.R.A</button>`)+
  `<div class="panel"><h3>Controles · ${esc(e.empresa)} al cierre de ${esc(e.periodo)}</h3><ul class="chk">${chk.map(([s,t])=>`<li><span class="dot ${s}" style="margin-top:6px"></span>${esc(t)}</li>`).join('')}</ul>${e.fuente?`<p class="note">Fuente: ${esc(e.fuente)}</p>`:''}</div>
  <div class="grid2 eeff"><div class="tw"><table><thead><tr><th>Estado de situación financiera</th><th class="n">S/</th></tr></thead><tbody>
   ${BAL.map(([g,fs])=>`<tr class="grp"><td colspan="2">${g}</td></tr>${fs.map(([f,l])=>`<tr><td>${l}</td><td class="n">${In('balance',f)}</td></tr>`).join('')}`).join('')}
   <tr class="tot"><td>Total activo</td><td class="n">${nf(k.act)}</td></tr><tr class="tot"><td>Total pasivo + patrimonio</td><td class="n">${nf(k.pas+k.pat)}</td></tr></tbody></table></div>
   <div class="tw"><table><thead><tr><th>Estado de resultados</th><th class="n">S/</th></tr></thead><tbody>
   ${ERR.map(([f,l,s])=>`<tr><td>${s<0?'(−) ':'(+) '}${l}</td><td class="n">${In('resultados',f)}</td></tr>`).join('')}
   <tr class="tot"><td>Resultado del ejercicio</td><td class="n ${k.res<0?'neg':''}">${nf(k.res)}</td></tr></tbody></table></div></div>`;
};

function projStats(p){
  const os=Object.values(D.ordenes).filter(o=>o.empresa===p.empresa&&slug(o.proyecto)===slug(p.nombre)&&!o.historico&&COMPROMETE.has(o.estado)),ids=new Set(os.map(o=>o.id));
  const comp=os.reduce((a,o)=>a+toPEN(tot(o).total,o.moneda),0);
  const cx=Object.values(D.cxp).filter(c=>ids.has(c.orden)&&c.estado!=='anulado');let porPagar=0,venc=0;cx.forEach(c=>{const k=cxpCalc(c);if(!k.pagado){porPagar+=toPEN(Math.max(0,k.saldo)+Math.max(0,k.saldoDet),c.moneda);if(k.dias<0)venc+=toPEN(Math.max(0,k.saldo),c.moneda)}});
  const pag=Object.values(D.pagos).filter(x=>ids.has(x.orden)).reduce((a,x)=>a+toPEN(+x.monto||0,x.moneda),0);
  const pres=Object.values(D.presupuesto).filter(x=>x.empresa===p.empresa&&slug(x.proyecto)===slug(p.nombre)).reduce((a,x)=>a+(+x.monto||0),0);
  const cb=cobStats(hitosOf(p)),ob=modOn(p,'obra')?obraModel(p).last:null;
  return {n:os.length,comp,porPagar,venc,pag,pres,avance:pres?comp/pres:null,cb,fisico:ob?ob.real:null,programado:ob?ob.plan:null,margen:cb.cobrado-pag};
}

function gateTab(tab){const p=projSel(),m=TAB_MOD[tab];if(!p||!m||modOn(p,m))return '';return `<div class="panel"><h3>${esc(MODS[m][0])} no está activo en ${esc(p.nombre)}</h3><p class="note" style="margin-top:0">El proyecto es de tipo «${esc(p.tipo)}». Si en esta fase lo necesitas, actívalo; se puede apagar después.</p><div class="row"><button class="btn pri" data-act="mod-on" data-m="${m}"${dis()}>Activar ${esc(MODS[m][0])}</button><button class="btn" data-act="proy-todos">Ver todos los proyectos</button></div></div>`}
async function projNew(emp,nombre){const id=emp+'-'+slug(nombre);if(D.proyectos[id])return id;const tipo=emp==='MZA'?'Diseño de planos':emp==='MAAS'?'Construcción':'Desarrollo inmobiliario';
