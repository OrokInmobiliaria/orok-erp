    <td><div class="row" style="gap:4px;flex-wrap:nowrap"><button class="btn x" data-act="cab-dup" data-i="${i}" title="Repetir este piso encima" aria-label="Repetir ${esc(r.nivel)} encima">⧉</button><button class="btn x" data-act="cab-del" data-i="${i}" aria-label="Eliminar ${esc(r.nivel)}">✕</button></div></td></tr>`).join('');
  const dif=t.vend-M.techV,difMed=t.areaMedidas?t.areaMedidas-T:0;
  return `<div class="panel" id="cabAreas"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px"><h3 style="margin:0">Cálculo de áreas por piso</h3>
    <div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn" data-act="cab-piso">+ Piso encima</button><button class="btn" data-act="cab-sotano">+ Sótano</button><button class="btn" data-act="cab-azotea">+ Azotea</button><button class="btn" data-act="cab-regenerar">Recalcular desde datos generales</button><button class="btn" data-act="cab-llevar">Llevar al cuadro de unidades</button><button class="btn" data-act="cab-usar">Usar área común en el modelo</button></div></div>
  <p class="note" style="margin-top:0">Parte de los datos generales y de los parámetros del certificado municipal. Cada piso: <b>techada = circulación + muros y ductos + áreas comunes + vendible</b>. Escribe en % o en m² (se convierten solos); ⧉ repite un piso encima. Este cuadro es la base: su vendible y su área libre por piso alimentan el <b>cuadro de áreas vendibles</b> de abajo, donde va cada departamento con su área techada y libre.</p>
  <h4 style="margin:6px 0">Terreno y parámetros urbanísticos</h4>
  <div class="fields" style="margin-bottom:10px">
    <div class="f src"><label for="i-p-areaTerreno">Área del terreno total (m²)</label>${inp('p.areaTerreno',S.p.areaTerreno)}</div>
    <div class="f"><label for="i-cab-param-frente">Frente (m)</label>${inp('cab.param.frente',P.frente)}</div>
    <div class="f"><label for="i-cab-param-fondo">Fondo (m)</label>${inp('cab.param.fondo',P.fondo)}</div>
    <div class="f"><label>Área por medidas (frente × fondo)</label><div style="padding:8px 0">${t.areaMedidas?nf(t.areaMedidas,2)+' m² '+(Math.abs(difMed)<0.5?'<span class="chip ok">coincide</span>':`<span class="chip w">difiere ${nf(difMed,2)} m²</span> <button class="btn x" data-act="cab-medidas">Usar como área del terreno</button>`):'<span class="mut">ingresa frente y fondo si los tienes</span>'}</div></div>
    <div class="f src"><label for="i-cab-param-libreMin">Área libre mínima (%)</label>${inp('cab.param.libreMin',P.libreMin)}</div>
    <div class="f src"><label for="i-cab-param-alturaModo">Altura máxima (según municipalidad)</label><select data-k="cab.param.alturaModo" id="i-cab-param-alturaModo"><option value="pisos"${P.alturaModo!=='metros'?' selected':''}>En número de pisos</option><option value="metros"${P.alturaModo==='metros'?' selected':''}>En metros</option></select></div>
    ${P.alturaModo==='metros'?`<div class="f src"><label for="i-cab-param-alturaM">Altura máxima (m)</label>${inp('cab.param.alturaM',P.alturaM)}</div>
    <div class="f"><label for="i-cab-param-alturaP1">Altura del primer piso (m)</label>${inp('cab.param.alturaP1',P.alturaP1)}</div>
    <div class="f"><label for="i-cab-param-entrepiso">Altura de entrepiso, piso a piso (m)</label>${inp('cab.param.entrepiso',P.entrepiso)}</div>
    <div class="f"><label>Pisos que entran en esa altura</label><div style="padding:8px 0"><b>${t.pisosMax} pisos</b> <span class="mut">(${nf(+P.alturaP1||3,2)} m + ${Math.max(0,t.pisosMax-1)} × ${nf(+P.entrepiso||2.7,2)} m = ${nf(cabAltura(P,t.pisosMax),2)} m)</span></div></div>`:`<div class="f src"><label for="i-cab-param-pisosMax">Altura máxima (pisos)</label>${inp('cab.param.pisosMax',P.pisosMax)}</div>`}
    <div class="f src"><label for="i-cab-param-azoteaTechable">Azotea techable (% de la huella)</label>${inp('cab.param.azoteaTechable',P.azoteaTechable)}</div>
    <div class="f"><label for="i-cab-param-retiro">Retiro frontal (m)</label>${inp('cab.param.retiro',P.retiro)}</div>
    <div class="f"><label for="i-cab-param-eficMeta">Eficiencia objetivo (vendible/techado %)</label>${inp('cab.param.eficMeta',P.eficMeta)}</div>
  </div>
  <div class="tw"><table><thead><tr><th>Nivel</th><th>Uso</th><th class="n">Techada m²</th><th class="n">% terreno</th><th>Circulación</th><th>Muros y ductos</th><th>Áreas comunes</th><th class="n">Vendible m²</th><th class="n">Área libre m²</th><th class="n">Libre vendible m²</th><th class="n">Und / Estac.</th><th></th></tr></thead>
  <tbody>${filas}<tr class="tot"><td colspan="2">Total</td><td class="n">${nf(t.tech,2)}</td><td class="n">${T?pc(t.tech/T,0):'—'}</td><td class="n">${nf(t.circ,2)} m² · ${pc(t.tech?t.circ/t.tech:0,1)}</td><td class="n">${nf(t.muros,2)} m² · ${pc(t.tech?t.muros/t.tech:0,1)}</td><td class="n">${nf(t.comun,2)} m² · ${pc(t.tech?t.comun/t.tech:0,1)}</td><td class="n"><b>${nf(t.vend,2)}</b><div style="font-size:11px">${pc(t.efic,1)}</div></td><td class="n">${nf(t.libre,2)}</td><td class="n">${nf(t.libreV,2)}</td><td class="n">${nf(t.und,0)} / ${nf(t.estac,0)}</td><td></td></tr></tbody></table></div>
  <div class="grid2" style="margin-top:10px"><div class="tw"><table><tbody>
    <tr><td>Área del terreno</td><td class="n">${nf(T,2)} m²${t.areaMedidas?`<div class="mut" style="font-size:11px">${nf(P.frente,2)} m × ${nf(P.fondo,2)} m</div>`:''}</td><td></td></tr>
    <tr><td>Área techada total (incl. sótanos)</td><td class="n">${nf(t.tech,2)} m²</td><td></td></tr>
    <tr><td>Área techada sobre el terreno (sin sótanos)</td><td class="n">${nf(t.techSobre,2)} m²</td><td></td></tr>
    <tr><td>Área libre del primer piso (incluye retiro)</td><td class="n">${nf(t.libreP1,2)} m² · ${pc(t.libreP1Pct,1)}</td><td>${chip(t.libreP1Pct*100>=P.libreMin-1e-6,'cumple '+nf(P.libreMin,0)+'%','menor al '+nf(P.libreMin,0)+'% exigido')}</td></tr>
    <tr><td>Pisos sobre el terreno</td><td class="n">${t.pisos}${P.alturaModo==='metros'?`<div class="mut" style="font-size:11px">altura aprox. ${nf(t.altura,2)} m de ${nf(+P.alturaM||0,2)} m</div>`:''}</td><td>${t.pisosMax>0?chip(t.pisos<=t.pisosMax,'dentro de la altura máxima ('+t.pisosMax+' pisos)','supera la altura máxima ('+t.pisosMax+' pisos)'):'<span class="mut">sin dato de altura</span>'}</td></tr>
    ${P.retiro>0&&P.frente>0?`<tr><td>Área de retiro (frente × retiro)</td><td class="n">${nf(P.retiro*P.frente,2)} m²</td><td class="mut">parte del área libre</td></tr>`:''}
  </tbody></table></div><div class="tw"><table><tbody>
    <tr><td>Área vendible techada</td><td class="n"><b>${nf(t.vend,2)} m²</b></td><td></td></tr>
    <tr><td>Eficiencia total (vendible / techado)</td><td class="n">${pc(t.efic,1)}</td><td></td></tr>
    <tr><td>Eficiencia sobre el terreno (sin sótanos)</td><td class="n">${pc(t.eficSobre,1)}</td><td>${chip(t.eficSobre*100>=P.eficMeta-1e-6,'≥ objetivo '+nf(P.eficMeta,0)+'%','bajo el objetivo '+nf(P.eficMeta,0)+'%')}</td></tr>
    <tr><td>No vendible techado (circulación + muros + comunes)</td><td class="n">${nf(t.tech-t.vend,2)} m²</td><td class="mut">área común del modelo: ${nf(+S.p.comunTechada||0,2)} m²</td></tr>
    <tr><td>Vendible según cuadro de unidades</td><td class="n">${nf(M.techV,2)} m²</td><td>${Math.abs(dif)<1?'<span class="chip ok">cuadra</span>':`<span class="chip w">${dif>0?'faltan':'sobran'} ${nf(Math.abs(dif),2)} m² por asignar</span>`}</td></tr>
    <tr><td>Área libre vendible (patios, terrazas)</td><td class="n">${nf(t.libreV,2)} m²</td><td class="mut">cuadro de unidades: ${nf(M.libreV,2)} m²</td></tr>
  </tbody></table></div></div></div>`;
}

function salesControls(){const base=Number(S.p.velocidad)||.8;return `<div class="panel"><h3>Escenario de velocidad de venta</h3><div class="fields" role="radiogroup" aria-label="Escenario de velocidad de venta">${[['base','Base','velocidad',base],['optimista','Optimista','velocidadOptimista',S.p.velocidadOptimista??base*1.25],['pesimista','Pesimista','velocidadPesimista',S.p.velocidadPesimista??base*.7]].map(([key,name,field,value])=>`<div class="f"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="radio" name="salesScenario" data-k="p.escenarioVenta" value="${key}" ${(S.p.escenarioVenta||'base')===key?'checked':''} style="width:16px;height:16px;margin:0;accent-color:var(--accent)">${name} (unidades/mes)</label><input type="number" min="0.05" step="any" id="i-p-${field}" data-k="p.${field}" aria-label="Velocidad ${name} (unidades/mes)" value="${esc(value)}"></div>`).join('')}</div><p class="note">Activo: ${nf(M.p.velocidad,2)} unidades/mes · última venta: ${ml(M.finVentas)}. Cambia ventas, cobranzas, financiamiento y plazo; conserva precios y costos. Las ventas registradas del CRM se conservan en Seguimiento.</p></div>`}
function monthAt(offset){const [y,m]=S.p.inicio.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+offset,1));return d.toISOString().slice(0,7)}
function dateControl(key,offset){return `<input type="month" aria-label="Fecha ${esc(key)}" data-date="${key}" value="${monthAt(offset)}">`}
function scheduleControls(){
 const max=Math.min(600,Math.max(60,M.H+12)),ph=[
 ['Diseño, estudios y licencias','disenoInicio',M.designStart,M.designEnd-M.designStart+1,'durDiseno'],
 ['Preventa y ventas','mesLanz',M.lanz,M.finVentas-M.lanz+1,null],
 ['Construcción','inicioObra',M.io,M.dur,'durObra'],
 ['Independización y desembolsos','inicioIndep',M.indStart,M.ind,'indep'],
 ['Posventa','inicioPosventa',M.postStart,M.postDur,'durPosventa']];
 const date=(key,t,name)=>`<input type="month" data-calendar="${key}" aria-label="Inicio ${esc(name)}" value="${monthAt(t)}">`;
 const move=(key,t,d,name)=>`<div class="phase-track"><div class="phase-band" style="--start:${100*t/max}%;left:var(--start);width:${Math.max(.5,100*d/(max+1))}%"></div><input type="range" min="0" max="${max}" step="1" value="${t}" data-calendar="${key}" aria-label="Mover ${esc(name)}"><output>Mes ${t} · ${ml(t)}</output></div>`;
 return `<div class="panel calendar-editor"><div class="row"><label>Inicio del proyecto ${inp('p.inicio',S.p.inicio,'','month')}</label><p class="note">Mes 0 = ${ml(0)}. Cambiar esta fecha desplaza todo el calendario.</p></div><p class="note">Arrastra el control de cada fase o selecciona una fecha y duración. Al soltar se recalculan obra, ventas, cobranzas y financiamiento vinculados. Los pagos fijados a un mes concreto conservan ese mes.</p><div class="calendar-scale"><span>${ml(0)}</span><span>${ml(Math.floor(max/2))}</span><span>${ml(max)}</span></div>
 ${ph.map(([name,key,t,d,dur])=>`<section class="calendar-phase"><div class="phase-title"><strong>${name}</strong><span>${ml(t)} → ${ml(t+d-1)}</span></div>${move(key,t,d,name)}<div class="phase-controls"><label>Inicio ${date(key,t,name)}</label>${dur?`<label>Duración (meses)<input type="number" min="1" max="600" step="1" data-calendar="${dur}" aria-label="Duración ${esc(name)}" value="${d}"></label>`:`<span class="note">Fin calculado por velocidad: ${nf(M.p.velocidad,2)} unidades/mes.</span>`}</div></section>`).join('')}
 <h3>Hitos adicionales</h3><p class="note">Arrastra o elige el mes de cada compromiso. Estos hitos amplían el calendario cuando corresponde; no generan pagos por sí solos.</p>
 ${(S.p.hitos||[]).map((h,i)=>`<section class="calendar-phase"><div class="phase-title"><label>Nombre del hito ${inp('p.hitos.'+i+'.nombre',h.nombre,'','text')}</label><button data-act="del-hito" data-i="${i}">Quitar</button></div>${move('hito.'+i,h.mes,1,h.nombre)}<div class="phase-controls"><label>Fecha ${date('hito.'+i,h.mes,h.nombre)}</label><label>Mes del proyecto<input type="number" min="0" max="600" step="1" data-calendar="hito.${i}" aria-label="Mes del hito ${i+1}" value="${h.mes}"></label></div></section>`).join('')}
 <button class="btn" data-act="add-hito">Agregar hito</button><p role="status" id="scheduleMsg"></p></div>`;
}
V.supuestos=()=>`<div class="sect-h"><h2>Supuestos del modelo</h2><p>Parámetros tributarios, comerciales, de obra y financieros. Valores referenciales para Lima; verifica UIT y tasas vigentes.</p></div>
  <div class="panel"><h3>Tributarios (Perú)</h3><div class="fields">${fld('p.uit','UIT vigente (S/)')}${fld('p.igv','IGV (%)')}${fld('p.baseGravada','Base gravada de la venta (%) · deducción terreno 50%')}${fld('p.prorrata','Crédito fiscal utilizable (%)')}${fld('p.ir','Impuesto a la renta (%)')}${fld('p.alcabala','Alcabala (%) sobre exceso de 10 UIT')}${fld('p.detraccion','Detracción venta de inmuebles (%)')}${fld('p.autovaluo','Autovalúo del predio (S/)')}</div>
  <div class="row" style="margin-top:10px"><label class="row"><input type="checkbox" data-k="p.detracOn" id="i-p-detracOn" ${S.p.detracOn?'checked':''}> Aplicar detracciones a las cobranzas</label></div></div>
  <div class="panel"><h3>Comerciales</h3><div class="fields">${fld('p.velocidad','Velocidad de venta (und/mes)')}${fld('p.inicial','Cuota inicial (%)')}${fld('p.descProm','Descuento promedio (%)')}${fld('p.tc','Tipo de cambio SUNAT · venta (automático)')}</div><p class="note" data-rate-status>${rateError||mRateNote()}</p></div>
  ${salesControls()}
  <div class="panel"><h3>Obra</h3><div class="fields">${fld('p.supervisionM2','Supervisión (S/ por m²)')}${fld('p.contingencia','Contingencia vecinos (% construcción)')}${fld('p.ggPct','GG implícito en el costo/m² (% CD)')}${fld('p.utilPct','Utilidad contratista implícita (% CD)')}</div></div>
  <div class="panel"><h3>Financieros</h3><div class="fields">${fld('p.financiaPct','Financiamiento banco (% de construcción)')}${fld('p.preventaMin','Preventa mínima para desembolso (%)')}${fld('p.tea','TEA línea promotor (%)')}${fld('p.tasaDesc','Tasa de descuento / COK anual (%)')}</div>
  <div class="row" style="margin-top:10px"><label class="row"><input type="checkbox" data-k="p.bancoOn" id="i-p-bancoOn" ${S.p.bancoOn?'checked':''}> Usar financiamiento bancario (crédito promotor)</label></div>
  <p class="note">Convenciones de pago en las tablas de costos: un número es el mes (0 = inicio), "a-b" reparte en partes iguales, "2:20,4:80" son hitos con porcentaje, y las palabras clave son proyecto, diseño, obra, curva, ventas, cobros, entrega, independizacion, posventa, banco y cierre.</p></div>`;

V.valores=()=>{
  const sc=sum(S.vu.cat.map(c=>+c[1]));const pis={};M.units.forEach(u=>{pis[u.piso]=(pis[u.piso]||0)+(+u.tech||0)});
  const floors=Object.keys(pis).map(Number).sort((a,b)=>a-b);const nv=M.areaTech-M.techV;const tv=M.techV||1;
  let tot=0,area=0;const rows=floors.map(f=>{const a=pis[f]+nv*pis[f]/tv;const fac=f>=5?S.vu.f5:1;const v=a*sc*S.vu.inei*fac;tot+=v;area+=a;return `<tr><td>Piso ${f}</td><td class="n">${nf(a,2)}</td><td class="n">${nf(sc,2)}</td><td class="n">${nf(S.vu.inei,3)}</td><td class="n">${nf(fac,2)}</td><td class="n">${S_(v,2)}</td></tr>`}).join('');
  return `<div class="sect-h"><h2>Valores unitarios oficiales</h2><p>Valor de obra para declaratoria de fábrica (Ley 27157): área × suma de categorías × factor INEI × factor por altura.</p></div>
  <div class="grid2"><div class="panel"><h3>Cuadro de categorías (S/ por m²)</h3><div class="tw"><table><thead><tr><th>Componente</th><th class="n">Valor</th></tr></thead><tbody>
  ${S.vu.cat.map((c,i)=>`<tr><td>${esc(c[0])}</td><td>${inp(`vu.cat.${i}.1`,c[1],'s')}</td></tr>`).join('')}<tr class="tot"><td>Suma de categorías</td><td class="n">${nf(sc,2)}</td></tr></tbody></table></div>
  <div class="fields" style="margin-top:12px">${fld('vu.inei','Factor de reajuste INEI')}${fld('vu.f5','Factor desde el 5° piso')}</div>
  <p class="note">Los valores precargados son los de la hoja original (Costa 2019). Reemplázalos por el cuadro oficial vigente del MVCS antes de usar el resultado en trámites.</p></div>
  <div class="panel"><h3>Valor de la obra por piso</h3><div class="tw"><table><thead><tr><th>Nivel</th><th class="n">Área m²</th><th class="n">Σ cat.</th><th class="n">INEI</th><th class="n">Altura</th><th class="n">Valor</th></tr></thead><tbody>${rows}
  <tr class="tot"><td>Total</td><td class="n">${nf(area,2)}</td><td colspan="3"></td><td class="n">${S_(tot,2)}</td></tr></tbody></table></div>
  <div class="tw" style="margin-top:12px"><table><tbody><tr><td>Valor de obra por m²</td><td class="n">${S_(tot/area,2)}</td></tr><tr><td>Derecho de inscripción SUNARP (3‰ del valor de obra)</td><td class="n">${S_(tot*0.003,2)}</td></tr><tr><td>Derecho de calificación (tasa fija referencial)</td><td class="n">S/ 40.00</td></tr></tbody></table></div>
  <p class="note">El área común se prorratea por piso según el área vendible de cada nivel.</p></div></div>`;
};

V.venta=()=>{
  const tc=S.p.tc;const rows=M.units.map((u,i)=>{const m2=u.tech+u.libre*S.p.factorLibre;return `<tr><td>${esc(u.id)}</td><td>${esc(u.tipo)}</td><td class="n">${u.piso}</td><td class="n">${nf(u.tech,2)}</td><td class="n">${nf(u.libre,2)}</td><td>${inp(`units.${i}.aj`,u.aj||0,'xs')}</td>
  <td class="n">${S_(u.lista)}</td><td class="n">US$ ${nf(u.lista/tc)}</td><td class="n">${S_(u.lista/(u.tech||1))}</td><td class="n">${S_(u.neto)}</td><td class="n">${S_(u.neto/(1+M.igvEf))}</td></tr>`}).join('');
  const pol=[['Crédito hipotecario, inicial 10%',1],['Crédito hipotecario, inicial fuerte',2],['Compra al contado (40% o más)',3],['Bróker / primeras 5 unidades',5]];
  return `<div class="sect-h"><h2>Valor de venta por departamento</h2><p>Precio de lista = (área techada + área libre × factor) × precio/m² × (1 + ajuste por unidad). Incluye IGV efectivo de ${pc(M.igvEf)}.</p></div>
  <div class="panel"><div class="tw"><table><thead><tr><th>Unidad</th><th>Tipología</th><th class="n">Piso</th><th class="n">Techada</th><th class="n">Libre</th><th>Ajuste %</th><th class="n">Precio lista</th><th class="n">Lista US$</th><th class="n">S/ por m² techado</th><th class="n">Precio neto</th><th class="n">Valor sin IGV</th></tr></thead>
  <tbody>${rows}<tr><td>Est.</td><td>Estacionamientos × ${S.p.nEstac}</td><td colspan="4"></td><td class="n">${S_(S.p.nEstac*S.p.precioEstac)}</td><td class="n">US$ ${nf(S.p.nEstac*S.p.precioEstac/tc)}</td><td></td><td class="n">${S_(M.vEst)}</td><td class="n">${S_(M.vEst/(1+M.igvEf))}</td></tr>
  <tr class="tot"><td colspan="6">Total recaudación</td><td class="n">${S_(sum(M.units.map(u=>u.lista))+S.p.nEstac*S.p.precioEstac)}</td><td class="n">US$ ${nf((sum(M.units.map(u=>u.lista))+S.p.nEstac*S.p.precioEstac)/tc)}</td><td class="n">${S_(M.vDept/M.techV)}</td><td class="n">${S_(M.ventas)}</td><td class="n">${S_(M.ventasSin)}</td></tr></tbody></table></div>
  <p class="note">Ajuste % permite primas por vista, piso o dúplex. Precio neto aplica el descuento promedio de Supuestos (${nf(S.p.descProm,1)}%).</p></div>
  <div class="panel"><h3>Política de descuentos (referencia de la hoja original)</h3><div class="tw"><table><thead><tr><th>Condición</th><th class="n">Descuento máx.</th><th class="n">Impacto en ventas</th><th class="n">Impacto en utilidad neta</th></tr></thead><tbody>
  ${pol.map(([t,d])=>{const r=compute(S,{descProm:d});return `<tr><td>${t}</td><td class="n">${d}%</td><td class="n neg">${S_(r.ventas-M.ventas)}</td><td class="n neg">${S_(r.neta-M.neta)}</td></tr>`}).join('')}</tbody></table></div>
  <p class="note">Cada punto de descuento sobre toda la venta equivale a ${S_(M.ventas/100)} de ingreso.</p></div>`;
};

V.construccion=()=>{
  const tw=sum(S.part.map(x=>+x.pct))||1;const m2=M.areaTech;const gg=M.cd*S.p.ggPct/100,ut=M.cd*S.p.utilPct/100;
  const rows=S.part.map((x,i)=>{const v=M.cd*x.pct/tw;return `<tr><td>${inp(`part.${i}.n`,x.n,'w','text')}</td><td>${inp(`part.${i}.pct`,x.pct,'xs')}</td><td class="n">${S_(v)}</td><td class="n"><input type="number" min="0" step="any" aria-label="Costo por m² de ${esc(x.n)}" data-part-cost="${i}" value="${Number((v/m2).toFixed(6))}"></td><td class="n">US$ ${nf(v/m2/S.p.tc,2)}</td><td><div class="bar"><span style="width:${(x.pct/tw*100/30*100).toFixed(1)}%;max-width:100%"></span></div></td></tr>`}).join('');
  return `<div class="sect-h"><h2>Costos de construcción</h2><p>Presupuesto por partidas derivado del costo/m² de la cabida. Las incidencias provienen del presupuesto de obra de la hoja original.</p></div>
  <div class="big"><div><label>Costo directo</label><output>${S_(M.cd)}</output><small>${S_(M.cd/m2,2)} por m²</small></div><div><label>Gastos generales</label><output>${S_(gg)}</output><small>${nf(S.p.ggPct,2)}% del CD</small></div>
  <div><label>Utilidad contratista</label><output>${S_(ut)}</output><small>${nf(S.p.utilPct,2)}% del CD</small></div><div><label>Total con IGV</label><output>${S_(M.constrSub*(1+S.p.igv/100))}</output><small>${S_(M.constrSub/m2,2)} por m² sin IGV</small></div></div>
  <div class="panel"><div class="fields">${fld('p.costoM2','Costo total por m² sin IGV (incluye GG y utilidad)')}</div><h3>Partidas del costo directo</h3><div class="tw"><table><thead><tr><th>Partida</th><th>Incidencia %</th><th class="n">Monto</th><th class="n">S/ por m²</th><th class="n">US$ por m²</th><th>Peso</th></tr></thead><tbody>${rows}
  <tr class="tot"><td>Costo directo</td><td class="n">${nf(tw,2)}%</td><td class="n">${S_(M.cd)}</td><td class="n">${S_(M.cd/m2,2)}</td><td class="n">US$ ${nf(M.cd/m2/S.p.tc,2)}</td><td></td></tr>
  <tr class="sub"><td>Gastos generales</td><td></td><td class="n">${S_(gg)}</td><td class="n">${S_(gg/m2,2)}</td><td></td><td></td></tr>
  <tr class="sub"><td>Utilidad</td><td></td><td class="n">${S_(ut)}</td><td class="n">${S_(ut/m2,2)}</td><td></td><td></td></tr>
  <tr class="sub"><td>Subtotal</td><td></td><td class="n">${S_(M.constrSub)}</td><td class="n">${S_(S.p.costoM2,2)}</td><td></td><td></td></tr>
  <tr class="sub"><td>IGV ${S.p.igv}%</td><td></td><td class="n">${S_(M.constrSub*S.p.igv/100)}</td><td></td><td></td><td></td></tr>
  <tr class="tot"><td>Total construcción</td><td></td><td class="n">${S_(M.constrSub*(1+S.p.igv/100))}</td><td class="n">${S_(S.p.costoM2*(1+S.p.igv/100),2)}</td><td class="n">US$ ${nf(S.p.costoM2*(1+S.p.igv/100)/S.p.tc,2)}</td><td></td></tr></tbody></table></div>
  <p class="note">Editar el S/m² de una partida conserva los costos de las demás y recalcula el total y las incidencias. Editar una incidencia mantiene el total y redistribuye proporcionalmente las demás. Estructuras + acabados representan ${pc(((+S.part[1]?.pct||0)+(+S.part[3]?.pct||0))/tw)} del costo directo.</p></div>`;
};

V.gg=()=>{
  const base=M.constrSub;const dur=M.dur;let tot=0;
  const rows=S.gg.map((g,i)=>{let v=0,q=g.link?dur:+g.q;if(g.u==='%')v=base*g.q/100;else if(g.u==='mes')v=q*(+g.ded)*(+g.pu);else v=(+g.q)*(+g.pu);tot+=v;
    return `<tr><td>${inp(`gg.${i}.n`,g.n,'w','text')}</td><td>${g.u==='%'?'% obra':g.u}</td><td>${g.u==='mes'&&g.link?`<span class="mut">${dur} (obra)</span>`:inp(`gg.${i}.q`,g.q,'xs')}</td><td>${g.u==='mes'?inp(`gg.${i}.ded`,g.ded,'xs'):'<span class="mut">—</span>'}</td><td>${g.u==='%'?'<span class="mut">—</span>':inp(`gg.${i}.pu`,g.pu,'s')}</td><td class="n">${S_(v)}</td><td><button class="btn x" data-act="del" data-g="gg" data-i="${i}" aria-label="Eliminar">✕</button></td></tr>`}).join('');
  const impl=M.cd*S.p.ggPct/100;const d=tot-impl;
  return `<div class="sect-h"><h2>Gastos generales de obra</h2><p>Detalle de gastos fijos y variables. Se concilia con el GG implícito en el costo/m² para validar el insumo de la cabida.</p></div>
  <div class="big"><div><label>GG detallado</label><output>${S_(tot)}</output><small>${pc(tot/M.cd)} del CD</small></div><div><label>GG implícito en costo/m²</label><output>${S_(impl)}</output><small>${nf(S.p.ggPct,2)}% del CD</small></div>
  <div><label>Diferencia</label><output class="${d>0?'neg':'pos'}">${S_(d)}</output><small>${d>0?'el costo/m² está subestimado':'holgura dentro del costo/m²'}</small></div><div><label>GG mensual</label><output>${S_(tot/dur)}</output><small>${dur} meses de obra</small></div></div>
  <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Partidas de gastos generales</h3><button class="btn" data-act="add-gg">+ Agregar</button></div>
  <div class="tw"><table><thead><tr><th>Descripción</th><th>Und</th><th>Cantidad / %</th><th>Dedicación</th><th>P.U. (S/)</th><th class="n">Total</th><th></th></tr></thead><tbody>${rows}<tr class="tot"><td colspan="5">Total gastos generales</td><td class="n">${S_(tot)}</td><td></td></tr></tbody></table></div>
  <p class="note">Las partidas en % se calculan sobre el presupuesto de obra sin IGV (${S_(base)}). Las mensuales enlazadas toman la duración de obra de Supuestos.</p></div>`;
};

function costTable(g,title){
  const items=S[g];const lines=M.L.filter(o=>o.g===g);const eg=M.egresos;
  const rows=items.map((it,i)=>{const o=lines.find(l=>l.i===i)||{q:0,sub:0,igv:0,tot:0};const pct=String(it.d).startsWith('pct');
    return `<tr><td>${g==='com'?`<select data-k="${g}.${i}.cat" id="i-${g}-${i}-cat">${['Marketing','Ventas','Posventa'].map(c=>`<option ${c===it.cat?'selected':''}>${c}</option>`).join('')}</select>`:''}${inp(`${g}.${i}.n`,it.n,'w','text')}</td>
    <td><select data-k="${g}.${i}.d" id="i-${g}-${i}-d">${Object.entries(DRV).map(([k,l])=>`<option value="${k}" ${k===it.d?'selected':''}>${l}</option>`).join('')}</select></td>
    <td>${it.d==='manual'?inp(`${g}.${i}.q`,it.q,'xs'):`<span class="n mut" style="font-family:var(--f-mono)">${pct?S_(o.q):nf(o.q,2)}</span>`}</td>
    <td>${it.d==='predial'?`<span class="mut">${S_(M.pred.total,2)}/año</span>`:inp(`${g}.${i}.pu`,it.pu,'s')}</td>
    <td style="text-align:center"><input type="checkbox" data-k="${g}.${i}.igv" id="i-${g}-${i}-igv" ${it.igv?'checked':''} aria-label="Afecto a IGV"></td>
    <td>${inp(`${g}.${i}.pago`,it.pago,'s','text')}</td><td class="n">${S_(o.sub)}</td><td class="n">${S_(o.igv)}</td><td class="n">${S_(o.tot)}</td><td class="n">${pc(o.tot/eg,2)}</td>
    <td><button class="btn x" data-act="del" data-g="${g}" data-i="${i}" aria-label="Eliminar">✕</button></td></tr>`}).join('');
  const t=lines.reduce((a,o)=>({s:a.s+o.sub,i:a.i+o.igv,t:a.t+o.tot}),{s:0,i:0,t:0});
  return `<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">${title}</h3><button class="btn" data-act="add" data-g="${g}">+ Agregar</button></div>
  <div class="tw"><table><thead><tr><th>Concepto</th><th>Base de cálculo</th><th>Cantidad</th><th>P.U. / %</th><th>IGV</th><th>Pago</th><th class="n">Subtotal</th><th class="n">IGV</th><th class="n">Total</th><th class="n">% egresos</th><th></th></tr></thead>
  <tbody>${rows}<tr class="tot"><td colspan="6">Total</td><td class="n">${S_(t.s)}</td><td class="n">${S_(t.i)}</td><td class="n">${S_(t.t)}</td><td class="n">${pc(t.t/eg,2)}</td><td></td></tr></tbody></table></div></div>`;
}
V.inmobiliarios=()=>{
  const pr=M.pred;
  return `<div class="sect-h"><h2>Costos inmobiliarios, legales, financieros y comerciales</h2><p>Cada concepto se calcula desde su base (m² de terreno, m² techados, unidades, meses o % de ventas) y se programa en el flujo según su forma de pago.</p></div>
  ${costTable('inm','Costos inmobiliarios')}${costTable('leg','Gastos legales')}${costTable('fin','Gastos financieros fijos')}${costTable('com','Marketing, ventas y posventa')}
  <div class="grid2"><div class="panel"><h3>Impuesto predial anual</h3><div class="tw"><table><thead><tr><th>Tramo de autovalúo</th><th class="n">Base</th><th class="n">Alícuota</th><th class="n">Impuesto</th></tr></thead><tbody>
  ${pr.rows.map((r,i)=>`<tr><td>${['Hasta 15 UIT','Más de 15 hasta 60 UIT','Más de 60 UIT'][i]}</td><td class="n">${S_(r.base,2)}</td><td class="n">${nf(r.r*100,1)}%</td><td class="n">${S_(r.imp,2)}</td></tr>`).join('')}
  <tr class="tot"><td colspan="3">Predial anual × ${M.anios} años</td><td class="n">${S_(pr.total*M.anios,2)}</td></tr></tbody></table></div></div>
  <div class="panel"><h3>Lectura</h3><p class="note" style="margin-top:0">Los intereses de la línea bancaria no figuran aquí: se calculan mes a mes en el flujo de caja (${S_(M.intTot)}) y se suman en el Perfil económico.</p>
  <p class="note">Las formas de pago reemplazan las hojas FC Arquitectura, FC Cálculo, FC Especialidades y FC Gerenciamiento: por ejemplo, "2:20,4:15,5:25,6:30,8:10" reproduce los hitos de pago del proyectista.</p></div></div>`;
};

V.perfil=()=>{
  const g=M.groups;const eg=M.egresos;
  const det=CATS.map(c=>{const ls=M.L.filter(o=>o.cat===c);const extra=c==='Financieros'?[{n:'Intereses línea promotor (desde flujo)',sub:M.intTot,igv:0,tot:M.intTot}]:[];
    return `<tr class="grp"><td>${c}</td><td class="n">${S_(g[c].sub)}</td><td class="n">${S_(g[c].igv)}</td><td class="n">${S_(g[c].tot)}</td><td class="n">${pc(g[c].tot/eg,2)}</td><td class="n">${pc(g[c].tot/M.ventas,2)}</td></tr>`+
    ls.concat(extra).map(o=>`<tr class="sub"><td style="padding-left:22px">${esc(o.n)}</td><td class="n">${S_(o.sub)}</td><td class="n">${S_(o.igv)}</td><td class="n">${S_(o.tot)}</td><td class="n">${pc(o.tot/eg,2)}</td><td class="n">${pc(o.tot/M.ventas,2)}</td></tr>`).join('')}).join('');
  const v=M.ventas,igvf=1+M.igvEf;
  const ing=[['Vivienda techada',M.techV*S.p.precioM2*(1-S.p.descProm/100)],['Área libre vendible',M.libreV*S.p.factorLibre*S.p.precioM2*(1-S.p.descProm/100)],['Ajustes por unidad',M.vDept-(M.techV+M.libreV*S.p.factorLibre)*S.p.precioM2*(1-S.p.descProm/100)],['Estacionamientos',M.vEst]];
  return `<div class="sect-h"><h2>Perfil económico</h2><p>Estado de resultados del proyecto completo, con IGV detallado e impuesto a la renta.</p></div>
  <div class="panel"><h3>Ingresos</h3><div class="tw"><table><thead><tr><th>Concepto</th><th class="n">Valor venta</th><th class="n">IGV</th><th class="n">Total</th><th class="n">%</th></tr></thead><tbody>
  ${ing.filter(x=>Math.abs(x[1])>0.5).map(([n,t])=>`<tr><td>${n}</td><td class="n">${S_(t/igvf)}</td><td class="n">${S_(t-t/igvf)}</td><td class="n">${S_(t)}</td><td class="n">${pc(t/v)}</td></tr>`).join('')}
  <tr class="tot"><td>Total ingresos</td><td class="n">${S_(M.ventasSin)}</td><td class="n">${S_(M.igvVentas)}</td><td class="n">${S_(v)}</td><td class="n">100%</td></tr></tbody></table></div></div>
  <div class="panel"><h3>Egresos</h3><div class="tw"><table><thead><tr><th>Concepto</th><th class="n">Subtotal</th><th class="n">IGV</th><th class="n">Total</th><th class="n">% egresos</th><th class="n">% ventas</th></tr></thead><tbody>${det}
  <tr class="tot"><td>Total egresos</td><td class="n">${S_(eg-M.igvComprasTot)}</td><td class="n">${S_(M.igvComprasTot)}</td><td class="n">${S_(eg)}</td><td class="n">100%</td><td class="n">${pc(eg/v)}</td></tr></tbody></table></div></div>
  <div class="grid2"><div class="panel"><h3>Resultado</h3><div class="tw"><table><tbody>
  <tr><td>Ingresos totales</td><td class="n">${S_(v)}</td><td></td></tr><tr><td>Egresos totales</td><td class="n neg">${S_(-eg)}</td><td></td></tr>
  <tr><td>IGV neto pagado al fisco</td><td class="n neg">${S_(-M.igvPagado)}</td><td></td></tr>
  <tr class="tot"><td>Utilidad antes de impuestos</td><td class="n">${S_(M.uai)}</td><td class="n">${pc(M.mSv)}</td></tr>
  <tr><td>Impuesto a la renta (${S.p.ir}%)</td><td class="n neg">${S_(-M.ir)}</td><td></td></tr>
  <tr class="tot"><td>Utilidad neta</td><td class="n">${S_(M.neta)}</td><td class="n">${pc(M.mN)}</td></tr></tbody></table></div></div>
  <div class="panel"><h3>Rentabilidad</h3><div class="tw"><table><tbody>
  <tr><td>Rentabilidad sobre ventas (antes de IR)</td><td class="n">${pc(M.mSv)}</td></tr><tr><td>Rentabilidad sobre costos</td><td class="n">${pc(M.mSc)}</td></tr>
  <tr><td>ROS · margen neto</td><td class="n">${pc(M.mN)}</td></tr><tr><td>ROE · utilidad neta / aporte máximo</td><td class="n">${pc(M.roe)}</td></tr>
  <tr><td>TIR del proyecto (anual)</td><td class="n">${M.tirE==null?'—':pc(M.tirE)}</td></tr><tr><td>VAN del proyecto @ ${S.p.tasaDesc}%</td><td class="n">${S_(M.vanE)}</td></tr>
  <tr><td>TIR del accionista (anual)</td><td class="n">${M.tirQ==null?'—':pc(M.tirQ)}</td></tr><tr><td>VAN del accionista @ ${S.p.tasaDesc}%</td><td class="n">${S_(M.vanQ)}</td></tr></tbody></table></div></div></div>`;
};

V.estructura=()=>{
  const eg=M.egresos;const g=M.groups;
  const rows=CATS.map(c=>{const p=g[c].tot/eg*100;const [lo,hi]=BENCH[c];return `<tr><td>${c}</td><td class="n">${S_(g[c].tot)}</td><td class="n">${nf(p,2)}%</td><td class="n mut">${lo}% – ${hi}%</td>
  <td><div class="bar" style="width:220px"><em style="left:${lo/70*100}%;width:${(hi-lo)/70*100}%"></em><span style="width:${Math.min(100,p/70*100)}%"></span></div></td><td>${chipR(p,lo,hi)}</td><td class="n">${pc(g[c].tot/M.ventas,2)}</td></tr>`}).join('');
  let x=0;const W=700;const cols=['var(--accent)','var(--warn)','var(--neg)','var(--ok)','var(--muted)','var(--ink)','var(--accent)','var(--warn)','var(--neg)'];
  const segs=CATS.map((c,i)=>{const w=g[c].tot/M.ventas*W;const s=`<rect x="${x}" y="22" width="${Math.max(0,w)}" height="30" fill="${cols[i]}" opacity="${i>5?0.55:0.9}"><title>${c}: ${pc(g[c].tot/M.ventas)}</title></rect>`;x+=w;return s}).join('');
  return `<div class="sect-h"><h2>Estructura de costos</h2><p>Peso de cada grupo sobre el total de egresos frente a los rangos de referencia del mercado de Lima usados en la hoja original.</p></div>
  <div class="panel"><h3>Composición del precio de venta</h3><svg class="chart" viewBox="0 0 ${W} 74" role="img" aria-label="Composición del precio de venta">${segs}<rect x="${x}" y="22" width="${Math.max(0,W-x)}" height="30" fill="var(--sunk)" stroke="var(--accent)" stroke-dasharray="3 3"/>
  <text x="0" y="14">0%</text><text x="${W}" y="14" text-anchor="end">100% de ventas</text><text x="${Math.min(W-4,x+4)}" y="68" text-anchor="${x>W-120?'end':'start'}">utilidad e IGV neto ${pc((M.ventas-eg)/M.ventas)}</text></svg>
  <div class="row" style="margin-top:6px;font-size:12px">${CATS.map((c,i)=>`<span class="row" style="gap:4px"><i style="width:10px;height:10px;border-radius:2px;background:${cols[i]};opacity:${i>5?0.55:0.9};display:inline-block"></i>${c}</span>`).join('')}</div></div>
  <div class="panel"><div class="tw"><table><thead><tr><th>Grupo</th><th class="n">Total</th><th class="n">% egresos</th><th class="n">Rango</th><th>Posición</th><th>Estado</th><th class="n">% ventas</th></tr></thead><tbody>${rows}
  <tr class="tot"><td>Total</td><td class="n">${S_(eg)}</td><td class="n">100%</td><td></td><td></td><td></td><td class="n">${pc(eg/M.ventas)}</td></tr></tbody></table></div>
  <p class="note">La banda gris marca el rango de referencia; la barra, el valor del proyecto.</p></div>`;
};

V.igv=()=>{
  const d=sum(M.igvD),c=M.igvComprasTot*S.p.prorrata/100;const obra=sum(M.L.filter(o=>o.cat==='Construcción'||o.cat==='Contingencias').map(o=>o.igv));
  const sf=Math.max(0,c-d);
  return `<div class="sect-h"><h2>IGV y tributos</h2><p>Venta de inmuebles: el IGV grava solo la construcción (se deduce 50% por terreno), por lo que la tasa efectiva es ${pc(M.igvEf)} del precio sin IGV. El crédito fiscal se toma de todas las compras afectas.</p></div>
  <div class="big"><div><label>IGV de ventas (débito)</label><output>${S_(d)}</output><small>base gravada ${S.p.baseGravada}%</small></div><div><label>IGV de compras (crédito)</label><output>${S_(c)}</output><small>${S_(obra)} de obra</small></div>
  <div><label>IGV pagado al fisco</label><output>${S_(M.igvPagado)}</output><small>pagos mensuales por desfase</small></div><div><label>Saldo a favor no aplicado</label><output class="${sf>0?'neg':''}">${S_(M.creditoFinal)}</output><small>${M.creditoFinal>1?'termina como costo':'sin saldo remanente'}</small></div></div>
  <div class="grid2"><div class="panel"><h3>Liquidación teórica</h3><div class="tw"><table><thead><tr><th>Concepto</th><th class="n">Total</th><th class="n">Base</th><th class="n">IGV</th></tr></thead><tbody>
  <tr><td>Ventas</td><td class="n">${S_(M.ventas)}</td><td class="n">${S_(M.ventasSin)}</td><td class="n">${S_(M.igvVentas)}</td></tr>
  <tr><td>Compras relacionadas a obra</td><td class="n">${S_(sum(M.L.filter(o=>o.cat==='Construcción'||o.cat==='Contingencias').map(o=>o.tot)))}</td><td class="n">${S_(sum(M.L.filter(o=>o.cat==='Construcción'||o.cat==='Contingencias').map(o=>o.sub)))}</td><td class="n">${S_(obra)}</td></tr>
  <tr><td>Compras no relacionadas a obra</td><td class="n">${S_(sum(M.L.filter(o=>o.cat!=='Construcción'&&o.cat!=='Contingencias').map(o=>o.tot)))}</td><td class="n">${S_(sum(M.L.filter(o=>o.cat!=='Construcción'&&o.cat!=='Contingencias').map(o=>o.sub)))}</td><td class="n">${S_(M.igvComprasTot-obra)}</td></tr>
  <tr class="tot"><td>Débito − crédito</td><td></td><td></td><td class="n ${d-c<0?'neg':''}">${S_(d-c)}</td></tr></tbody></table></div>
  <p class="note">${d<c?'El crédito supera al débito: el excedente no es recuperable por devolución en el régimen general y queda como mayor costo, por eso el egreso ya se registra con IGV incluido.':'El débito supera al crédito: la diferencia se paga mensualmente según el desfase entre cobranzas y compras.'}</p></div>
  <div class="panel"><h3>Otros tributos del proyecto</h3><div class="tw"><table><tbody>
  <tr><td>Alcabala (${S.p.alcabala}% sobre exceso de 10 UIT)</td><td class="n">${S_(M.L[1].tot)}</td></tr>
  <tr><td>Impuesto predial (${M.anios} años)</td><td class="n">${S_(M.pred.total*M.anios)}</td></tr>
  <tr><td>Detracciones retenidas (${S.p.detracOn?S.p.detraccion+'%':'no aplica'})</td><td class="n">${S_(sum(M.det))}</td></tr>
  <tr><td>Liberación de detracciones</td><td class="n">mes ${Math.min(M.H,M.ent+M.ind+1)} · ${ml(Math.min(M.H,M.ent+M.ind+1))}</td></tr>
  <tr><td>Impuesto a la renta (${S.p.ir}%)</td><td class="n">${S_(M.ir)}</td></tr>
  <tr class="tot"><td>Carga tributaria total (IGV neto + IR + alcabala + predial)</td><td class="n">${S_(M.igvPagado+M.ir+M.L[1].tot+M.pred.total*M.anios)}</td></tr></tbody></table></div>
  <p class="note">La detracción de 4% sobre cada cobranza se deposita en la cuenta del Banco de la Nación y se libera al final; afecta caja, no resultado.</p></div></div>`;
};

function sChart(arr,labels){
  const W=720,Hh=220,pl=44,pr=10,pt=10,pb=26;const n=arr.length;const mx=Math.max(...arr,0.0001);const bw=(W-pl-pr)/n;
  let cum=0;const pts=arr.map((v,i)=>{cum+=v;return [pl+bw*(i+0.5),pt+(Hh-pt-pb)*(1-cum)]});
  const bars=arr.map((v,i)=>{const h=(Hh-pt-pb)*v/mx*0.45;return `<rect x="${pl+bw*i+bw*0.18}" y="${Hh-pb-h}" width="${bw*0.64}" height="${h}" fill="var(--accent)" opacity=".28"/>`}).join('');
  const grid=[0,0.25,0.5,0.75,1].map(g=>{const y=pt+(Hh-pt-pb)*(1-g);return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${g*100}%</text>`}).join('');
  const xl=labels.map((l,i)=>i%Math.ceil(n/12)===0?`<text x="${pl+bw*(i+0.5)}" y="${Hh-8}" text-anchor="middle">${l}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Curva S de avance de obra">${grid}${bars}<polyline fill="none" stroke="var(--accent)" stroke-width="2.2" points="${pts.map(p=>p.join(',')).join(' ')}"/><circle cx="${pts[n-1][0]}" cy="${pts[n-1][1]}" r="3.5" fill="var(--accent)"/>${xl}</svg>`;
}
V.cronograma=()=>{
  const N=M.dur;const pc_=partCurves(S.part,N);const tw=sum(S.part.map(x=>+x.pct))||1;
  const hdr=Array.from({length:N},(_,j)=>`<th class="n">M${j+1}<br><span style="font-weight:400">${ml(M.io+j)}</span></th>`).join('');
  const rows=S.part.map((x,i)=>{const v=M.cd*x.pct/tw;return `<tr><td class="stick">${esc(x.n)}</td><td class="n">${S_(v)}</td>${pc_[i].map(w=>`<td class="n">${w>0.0001?nf(v*w):'<span class="mut">·</span>'}</td>`).join('')}</tr>`}).join('');
  const cdM=Array.from({length:N},(_,j)=>sum(S.part.map((x,i)=>M.cd*x.pct/tw*pc_[i][j])));
  const gg=M.cd*S.p.ggPct/100,ut=M.cd*S.p.utilPct/100;
  const sub=cdM.map(v=>v+gg/N+ut*v/M.cd);let ac=0;const acum=sub.map(v=>{ac+=v*(1+S.p.igv/100);return ac});
  const r=(n,a,cls='sub')=>`<tr class="${cls}"><td class="stick">${n}</td><td class="n">${S_(sum(a))}</td>${a.map(v=>`<td class="n">${nf(v)}</td>`).join('')}</tr>`;
  return `<div class="sect-h"><h2>Cronograma valorizado de obra</h2><p>Distribución mensual de cada partida a partir de los porcentajes de avance de la hoja original, reescalada a ${N} meses de obra.</p></div>
  <div class="panel"><h3>Curva S · avance acumulado</h3>${sChart(M.curve,Array.from({length:N},(_,j)=>ml(M.io+j)))}<p class="note">Inicio de obra en ${ml(M.io)} (mes ${M.io}) y entrega en ${ml(M.ent)}. El mes de mayor avance concentra ${pc(Math.max(...M.curve))} del presupuesto.</p></div>
  <div class="panel"><h3>Valorización mensual (S/)</h3><div class="tw"><table><thead><tr><th class="stick">Partida</th><th class="n">Total</th>${hdr}</tr></thead><tbody>${rows}
  ${r('Costo directo',cdM,'tot')}${r('Gastos generales',cdM.map(()=>gg/N))}${r('Utilidad',cdM.map(v=>ut*v/M.cd))}${r('Subtotal',sub,'tot')}${r('IGV '+S.p.igv+'%',sub.map(v=>v*S.p.igv/100))}${r('Total valorizado',sub.map(v=>v*(1+S.p.igv/100)),'tot')}
  <tr class="sub"><td class="stick">Acumulado</td><td></td>${acum.map(v=>`<td class="n">${nf(v)}</td>`).join('')}</tr>
  <tr class="sub"><td class="stick">% avance</td><td></td>${M.curve.map(v=>`<td class="n">${pc(v,0)}</td>`).join('')}</tr></tbody></table></div></div>
  <div class="panel"><h3>Curvas por partida (% de cada mes, base 14 meses)</h3><div class="tw"><table><thead><tr><th class="stick">Partida</th>${Array.from({length:14},(_,j)=>`<th class="n">M${j+1}</th>`).join('')}<th class="n">Suma</th></tr></thead><tbody>
  ${S.part.map((x,i)=>`<tr><td class="stick">${esc(x.n)}</td>${x.c.map((v,j)=>`<td>${inp(`part.${i}.c.${j}`,v,'xs')}</td>`).join('')}<td class="n ${Math.abs(sum(x.c)-100)>0.5?'neg':''}">${nf(sum(x.c),0)}%</td></tr>`).join('')}</tbody></table></div>
  <p class="note">Edita los porcentajes para ajustar la secuencia constructiva. Si una fila no suma 100% se normaliza.</p></div>`;
};

V.calendario=()=>{
 const H=M.H;
  const phases=[['Diseño, estudios y licencias',M.designStart,M.designEnd,'m'],['Preventa y ventas',M.lanz,M.finVentas,'w'],['Construcción',M.io,M.ent-1,''],['Independización y desembolsos',M.indStart,M.indStart+M.ind-1,'w'],['Posventa',M.postStart,M.postStart+M.postDur-1,'m']];
  const bs=M.F.bankStart;if(bs!=null)phases.push(['Línea bancaria activa',bs,Math.max(bs,M.F.amort.findLastIndex(v=>v>0)),'']);
  const header=Array.from({length:H+1},(_,t)=>`<th scope="col" class="n" style="padding:5px 3px;font-size:10px">M${t}<br><span style="font-weight:400;white-space:nowrap">${ml(t)}</span></th>`).join('');
  const bars=phases.map(([name,start,end,color])=>`<tr><th scope="row" class="stick">${esc(name)}</th><td class="n mut" style="white-space:nowrap">${ml(start)} → ${ml(end)}</td>${Array.from({length:H+1},(_,t)=>`<td class="c">${t>=start&&t<=end?`<span class="on ${color}" title="${esc(name)} · ${ml(t)}"></span>`:''}</td>`).join('')}</tr>`).join('');
  const hitos=[['Compra del terreno',0],['Lanzamiento comercial',M.lanz],['Inicio de obra',M.io],[`Preventa mínima ${S.p.preventaMin}% alcanzada`,M.soldCum.findIndex(v=>v>=S.p.preventaMin/100-1e-9)],['Fin de obra y entrega',M.ent],['Última venta',M.finVentas],['Cierre del proyecto',H]];
  return `<div class="sect-h"><h2>Calendario del proyecto</h2><p>Programa las fases e hitos aquí: ${M.H+1} meses desde ${ml(0)} hasta ${ml(H)}.</p></div>
  <div class="panel"><h3>Vista general · fases e hitos</h3><p class="note">Este calendario refleja los ajustes de abajo. Las barras muestran la duración de cada fase y los rombos señalan los hitos.</p><div class="tw gantt"><table aria-label="Calendario visual de fases e hitos"><thead><tr><th scope="col" class="stick">Fase / hito</th><th scope="col">Periodo / fecha</th>${header}</tr></thead><tbody>${bars}
  ${[...hitos,...(S.p.hitos||[]).map(x=>[x.nombre,x.mes])].filter(([,t])=>t>=0).map(([name,t])=>`<tr><th scope="row" class="stick">◇ ${esc(name)}</th><td class="n mut">${ml(t)}</td>${Array.from({length:H+1},(_,j)=>`<td class="c" style="text-align:center;color:var(--accent)">${j===Number(t)?`<span title="${esc(name)} · ${ml(t)}">◆</span>`:''}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div></div>
  <details id="calendarAdjust" class="calendar-adjust"><summary><span>Ajustar fechas, fases e hitos</span><span class="adjust-open">Desplegar</span><span class="adjust-close">Contraer</span></summary><p class="note">Los controles actualizan la vista general y los cálculos vinculados.</p>
  ${scheduleControls()}</details>
  <div class="panel"><h3>Hitos vinculados · cálculo automático</h3><p class="note">Lanzamiento, obra y entrega siguen las fases de arriba. Preventa mínima, última venta y cierre siguen los resultados del modelo.</p><div class="tw"><table><thead><tr><th>Hito</th><th class="n">Mes</th><th>Fecha</th><th>Estado</th></tr></thead><tbody>
  ${hitos.map(([n,t])=>`<tr><td>${esc(n)}</td><td class="n">${t<0?'—':t}</td><td>${t<0?'no se alcanza':ml(t)}</td><td>${t<0?'<span class="chip b">sin cumplir</span>':(n.startsWith('Preventa')&&t>M.io?'<span class="chip w">después del inicio de obra</span>':'<span class="chip ok">programado</span>')}</td></tr>`).join('')}</tbody></table></div></div>`;
};

function cfChart(){
  const a=M.econ,n=a.length,W=760,Hh=240,pl=56,pr=10,pt=12,pb=26;let c=0;const cum=a.map(v=>c+=v);
  const mx=Math.max(...a,...cum,1),mn=Math.min(...a,...cum,-1);const y=v=>pt+(Hh-pt-pb)*(mx-v)/(mx-mn);const bw=(W-pl-pr)/n;
  const step=Math.pow(10,Math.floor(Math.log10((mx-mn)/4)));const st=Math.ceil((mx-mn)/4/step)*step;const ticks=[];for(let v=Math.ceil(mn/st)*st;v<=mx;v+=st)ticks.push(v);
  const grid=ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===0?'stroke-width="1.5" stroke="var(--muted)"':''}/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${nf(v/1000)}k</text>`).join('');
  const bars=a.map((v,i)=>`<rect x="${pl+bw*i+bw*0.15}" y="${Math.min(y(v),y(0))}" width="${bw*0.7}" height="${Math.abs(y(v)-y(0))}" fill="${v>=0?'var(--accent)':'var(--warn)'}" opacity=".75"><title>${ml(i)}: ${S_(v)}</title></rect>`).join('');
  const line=cum.map((v,i)=>`${pl+bw*(i+0.5)},${y(v)}`).join(' ');
  const xl=a.map((_,i)=>i%3===0?`<text x="${pl+bw*(i+0.5)}" y="${Hh-8}" text-anchor="middle">${ml(i)}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Flujo de caja económico mensual y acumulado">${grid}${bars}<polyline fill="none" stroke="var(--ink)" stroke-width="1.8" points="${line}"/><circle cx="${pl+bw*(n-0.5)}" cy="${y(cum[n-1])}" r="3.5" fill="var(--ink)"/>${xl}</svg>
  <div class="row" style="font-size:12px;gap:14px"><span class="row" style="gap:4px"><i style="width:10px;height:10px;background:var(--accent);display:inline-block;border-radius:2px"></i>flujo positivo</span><span class="row" style="gap:4px"><i style="width:10px;height:10px;background:var(--warn);display:inline-block;border-radius:2px"></i>flujo negativo</span><span class="row" style="gap:4px"><i style="width:14px;height:2px;background:var(--ink);display:inline-block"></i>acumulado</span></div>`;
}
V.flujo=()=>{
  const H=M.H,F=M.F;const T=Array.from({length:H+1},(_,t)=>t);
  const pctMode=fcMode==='%';
  const row=(n,a,cls='',neg=false,und=false)=>{const tt=sum(a),z=und?0.005:0.5;return `<tr class="${cls}"><td class="stick">${n}</td><td class="n">${pctMode?'100%':und?nf(tt,0):S_(neg?-tt:tt)}</td>${a.map(v=>`<td class="n ${(neg?-v:v)<-z?'neg':''}">${Math.abs(v)<z?'<span class="mut">·</span>':pctMode?(tt?pc(v/tt,1):'—'):und?nf(v,2):nf(neg?-v:v)}</td>`).join('')}</tr>`};
  const hdr=`<tr><th class="stick">Concepto</th><th class="n">Total</th>${T.map(t=>`<th class="n">M${t}<br><span style="font-weight:400">${ml(t)}</span></th>`).join('')}</tr>`;
  const net=T.map(t=>M.cobro[t]-M.det[t]+M.detRel[t]);
  const op=T.map(t=>M.E[t]-M.Efin[t]);let c=0;const cumE=M.econ.map(v=>c+=v);let c2=0;const cumQ=M.eq.map(v=>c2+=v);
  return `<div class="sect-h"><h2>Flujo de caja</h2><p>Proyección mensual de ${H+1} meses: cobranzas, egresos por grupo, IGV, impuesto a la renta y fondeo con banco y accionistas.</p>
  <div class="seg" role="group" aria-label="Unidades"><button data-fc="S/" aria-pressed="${!pctMode}">S/</button><button data-fc="%" aria-pressed="${pctMode}">% del total</button></div></div>
  ${salesControls()}<div class="panel"><h3>Flujo económico mensual y acumulado</h3>${cfChart()}</div>
  <div class="big"><div><label>Máxima exposición económica</label><output>${S_(M.peakE)}</output><small>sin financiamiento</small></div><div><label>Recupero</label><output>${M.payback==null?'—':'Mes '+M.payback}</output><small>${M.payback==null?'':ml(M.payback)}</small></div>
  <div><label>TIR proyecto</label><output>${M.tirE==null?'—':pc(M.tirE)}</output><small>VAN ${S_(M.vanE)}</small></div><div><label>TIR accionista</label><output>${M.tirQ==null?'—':pc(M.tirQ)}</output><small>VAN ${S_(M.vanQ)}</small></div></div>
  <div class="panel"><h3>Detalle mensual</h3><div class="tw" style="max-height:640px"><table><thead>${hdr}</thead><tbody>
  <tr class="grp"><td class="stick">Ventas</td><td colspan="${H+2}"></td></tr>
  ${row('Unidades vendidas',M.sold,'',false,true)}
  <tr class="sub"><td class="stick">Avance de ventas</td><td></td>${M.soldCum.map(v=>`<td class="n">${pc(v,0)}</td>`).join('')}</tr>
  ${row('Cobranzas (inicial + hipotecario)',M.cobro)}${row('Detracciones retenidas',M.det,'sub',true)}${row('Liberación de detracciones',M.detRel,'sub')}${row('Ingresos netos',net,'tot')}
  <tr class="grp"><td class="stick">Egresos</td><td colspan="${H+2}"></td></tr>
  ${CATS.filter(k=>k!=='Financieros').map(k=>row(k,M.byCat[k],'',true)).join('')}
  ${row('IGV pagado',F.igvPay,'',true)}${row('Impuesto a la renta',T.map(t=>t===H?M.ir:0),'',true)}
  ${row('Total egresos operativos',T.map(t=>op[t]+F.igvPay[t]+(t===H?M.ir:0)),'tot',true)}
  ${row('Flujo de caja económico',M.econ,'tot')}
  <tr class="sub"><td class="stick">Acumulado económico</td><td></td>${cumE.map(v=>`<td class="n ${v<0?'neg':''}">${nf(v)}</td>`).join('')}</tr>
  <tr class="grp"><td class="stick">Financiamiento</td><td colspan="${H+2}"></td></tr>
  ${row('Gastos financieros fijos',M.Efin,'',true)}${row('Desembolsos banco',F.draw)}${row('Amortización banco',F.amort,'',true)}${row('Intereses banco',F.intr,'',true)}
  <tr class="sub"><td class="stick">Saldo deuda</td><td></td>${F.bankBal.map(v=>`<td class="n">${v>0.5?nf(v):'<span class="mut">·</span>'}</td>`).join('')}</tr>
  ${row('Aportes de accionistas',F.aporte,'',true)}${row('Distribuciones a accionistas',F.dist)}${row('Flujo del accionista',M.eq,'tot')}
  <tr class="sub"><td class="stick">Acumulado accionista</td><td></td>${cumQ.map(v=>`<td class="n ${v<0?'neg':''}">${nf(v)}</td>`).join('')}</tr>
  </tbody></table></div><p class="note">El flujo económico excluye gastos e intereses bancarios. El flujo del accionista resulta de cubrir cada déficit mensual con banco (si se cumple la preventa) y luego con aportes; los excedentes se distribuyen tras cancelar la deuda reservando los egresos pendientes.</p></div>`;
};

V.banca=()=>{
  const F=M.F;const ap=sum(F.aporte),dr=F.drawn;const used=M.egresos+M.igvPagado;const ventasFund=Math.max(0,used-ap-dr);
  const tm=Array.from({length:M.H+1},(_,t)=>t).filter(t=>F.draw[t]||F.amort[t]||F.intr[t]>0.5);
  const scen=[[0,'Sin banco'],[40,'Banco 40%'],[60,'Banco 60%'],[80,'Banco 80%']].map(([f,l])=>{const r=compute(S,{financiaPct:f,bancoOn:f>0});return [l,r]});
  return `<div class="sect-h"><h2>Estructura bancaria</h2><p>Crédito promotor: el banco financia hasta ${S.p.financiaPct}% de la construcción una vez alcanzada una preventa de ${S.p.preventaMin}%, con cobranzas en cuenta recaudadora para amortizar.</p></div>
  <div class="big"><div><label>Línea aprobada</label><output>${S_(M.bankLim)}</output><small>${S.p.financiaPct}% de ${S_(M.constrTot)}</small></div><div><label>Desembolsado</label><output>${S_(dr)}</output><small>${pc(dr/(M.bankLim||1))} de la línea</small></div>
  <div><label>Intereses</label><output>${S_(M.intTot)}</output><small>TEA ${S.p.tea}%</small></div><div><label>Primer desembolso</label><output>${F.bankStart==null?'—':ml(F.bankStart)}</output><small>${F.bankStart==null?'condición no alcanzada en obra':'mes '+F.bankStart}</small></div></div>
  <div class="grid2"><div class="panel"><h3>Fuentes de fondeo de los egresos</h3><div class="tw"><table><thead><tr><th>Fuente</th><th class="n">Monto</th><th class="n">%</th></tr></thead><tbody>
  <tr><td>Aportes de accionistas (incluye terreno)</td><td class="n">${S_(ap)}</td><td class="n">${pc(ap/used)}</td></tr><tr><td>Crédito promotor</td><td class="n">${S_(dr)}</td><td class="n">${pc(dr/used)}</td></tr>
  <tr><td>Cobranzas de clientes</td><td class="n">${S_(ventasFund)}</td><td class="n">${pc(ventasFund/used)}</td></tr><tr class="tot"><td>Total egresos + IGV pagado</td><td class="n">${S_(used)}</td><td class="n">100%</td></tr></tbody></table></div>
  ${F.bankEnd>1?`<p class="note neg">La deuda no se cancela dentro del horizonte (${S_(F.bankEnd)} pendientes). Revisa velocidad de venta o porcentaje financiado.</p>`:''}</div>
  <div class="panel"><h3>Escenarios de apalancamiento</h3><div class="tw"><table><thead><tr><th>Escenario</th><th class="n">Aporte máx.</th><th class="n">Intereses</th><th class="n">Utilidad neta</th><th class="n">ROE</th><th class="n">TIR acc.</th></tr></thead><tbody>
  ${scen.map(([l,r])=>`<tr><td>${l}</td><td class="n">${S_(r.peak)}</td><td class="n">${S_(r.intTot)}</td><td class="n">${S_(r.neta)}</td><td class="n">${pc(r.roe)}</td><td class="n">${r.tirQ==null?'—':pc(r.tirQ)}</td></tr>`).join('')}</tbody></table></div></div></div>
  <div class="panel"><h3>Movimientos de la línea</h3><div class="tw" style="max-height:420px"><table><thead><tr><th>Mes</th><th>Fecha</th><th class="n">Avance ventas</th><th class="n">Desembolso</th><th class="n">Interés</th><th class="n">Amortización</th><th class="n">Saldo</th></tr></thead><tbody>
  ${tm.length?tm.map(t=>`<tr><td>${t}</td><td>${ml(t)}</td><td class="n">${pc(M.soldCum[t],0)}</td><td class="n">${F.draw[t]?nf(F.draw[t]):'·'}</td><td class="n">${nf(F.intr[t])}</td><td class="n">${F.amort[t]?nf(F.amort[t]):'·'}</td><td class="n">${nf(F.bankBal[t])}</td></tr>`).join(''):`<tr><td colspan="7" class="mut">No hay desembolsos: la preventa mínima no se alcanza antes de terminar la obra o el banco está desactivado.</td></tr>`}</tbody></table></div></div>`;
};

V.inversion=()=>{
  const rows=S.inv.map((v,i)=>{const it=v.monto*v.tasa/100*v.plazo/12;return `<tr><td>${inp(`inv.${i}.n`,v.n,'w','text')}</td><td>${inp(`inv.${i}.monto`,v.monto,'s')}</td><td>${inp(`inv.${i}.tasa`,v.tasa,'xs')}</td><td>${inp(`inv.${i}.plazo`,v.plazo,'xs')}</td><td class="n">${S_(it)}</td><td class="n">${S_(v.monto+it)}</td><td class="n">${pc(it/v.monto)}</td><td><button class="btn x" data-act="del" data-g="inv" data-i="${i}" aria-label="Eliminar">✕</button></td></tr>`}).join('');
  const T=sum(S.inv.map(v=>+v.monto)),I=sum(S.inv.map(v=>v.monto*v.tasa/100*v.plazo/12));const wavg=T?I/T:0;const pz=T?sum(S.inv.map(v=>v.monto*v.plazo))/T:0;
  const ef=pz?Math.pow(1+wavg,12/pz)-1:0;const cover=Math.min(1,T/(M.peak||1));
  const roeNew=(M.neta-I*(1-S.p.ir/100))/Math.max(1,M.peak-T);
  return `<div class="sect-h"><h2>Estructura para inversionistas</h2><p>Préstamos privados documentados (pagaré o mutuo con garantía) para reducir el aporte de los socios. Pago único de capital más interés al vencimiento.</p></div>
  <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Corrida de inversionistas</h3><button class="btn" data-act="add-inv">+ Agregar tramo</button></div>
  <div class="tw"><table><thead><tr><th>Tramo</th><th>Monto (S/)</th><th>Tasa anual %</th><th>Plazo meses</th><th class="n">Interés</th><th class="n">Pago al vencimiento</th><th class="n">Rend. total</th><th></th></tr></thead><tbody>${rows}
  <tr class="tot"><td>Totales</td><td class="n">${S_(T)}</td><td></td><td class="n">${nf(pz,1)}</td><td class="n">${S_(I)}</td><td class="n">${S_(T+I)}</td><td class="n">${pc(wavg)}</td><td></td></tr></tbody></table></div></div>
  <div class="grid3"><div class="panel"><h3>Costo del fondeo</h3><div class="tw"><table><tbody><tr><td>Rendimiento ponderado total</td><td class="n">${pc(wavg)}</td></tr><tr><td>Equivalente anual efectivo</td><td class="n">${pc(ef)}</td></tr><tr><td>Escudo fiscal de intereses</td><td class="n">${S_(I*S.p.ir/100)}</td></tr><tr><td>Costo neto después de IR</td><td class="n">${S_(I*(1-S.p.ir/100))}</td></tr></tbody></table></div></div>
  <div class="panel"><h3>Cobertura del aporte</h3><div class="tw"><table><tbody><tr><td>Aporte máximo requerido</td><td class="n">${S_(M.peak)}</td></tr><tr><td>Fondeo de inversionistas</td><td class="n">${S_(T)}</td></tr><tr><td>Cobertura</td><td class="n">${pc(cover)}</td></tr><tr><td>Aporte de socios restante</td><td class="n">${S_(Math.max(0,M.peak-T))}</td></tr></tbody></table></div></div>
  <div class="panel"><h3>Efecto en los socios</h3><div class="tw"><table><tbody><tr><td>ROE sin inversionistas</td><td class="n">${pc(M.roe)}</td></tr><tr><td>ROE con inversionistas</td><td class="n ${roeNew>M.roe?'pos':'neg'}">${pc(roeNew)}</td></tr><tr><td>Utilidad neta de socios</td><td class="n">${S_(M.neta-I*(1-S.p.ir/100))}</td></tr><tr><td>Vencimiento promedio</td><td class="n">${ml(Math.round(M.io+pz))}</td></tr></tbody></table></div></div></div>
  <div class="panel"><h3>Tabla de tasas por tramo</h3><div class="tw"><table><thead><tr><th>Desde (S/)</th><th>Hasta (S/)</th><th>Tasa anual %</th></tr></thead><tbody>${S.tramos.map((t,i)=>`<tr><td>${inp(`tramos.${i}.0`,t[0],'s')}</td><td>${inp(`tramos.${i}.1`,t[1],'s')}</td><td>${inp(`tramos.${i}.2`,t[2],'xs')}</td></tr>`).join('')}</tbody></table></div>
  <p class="note">Garantía sugerida: cesión parcial de flujos o contrato privado con firmas legalizadas. Conviene que el vencimiento caiga después de los desembolsos hipotecarios (${ml(M.ent)} – ${ml(M.ent+M.ind-1)}).</p></div>`;
};

function insights(){
  const out=[];const g=M.groups,eg=M.egresos;
  out.push(M.mSv>=0.18?['ok',`Margen sobre ventas de ${pc(M.mSv)}: por encima del 18% que suelen exigir bancos y fondos para proyectos de vivienda en Lima.`]:M.mSv>=0.12?['w',`Margen sobre ventas de ${pc(M.mSv)}: aceptable pero ajustado. Con 15–18% el banco suele aprobar con menos condiciones.`]:['b',`Margen sobre ventas de ${pc(M.mSv)}: insuficiente para absorber desvíos de costo o precio.`]);
  out.push(M.tit<=0.2?['ok',`Incidencia del terreno sobre ventas de ${pc(M.tit)}: dentro del rango sano (≤20%).`]:['w',`Incidencia del terreno sobre ventas de ${pc(M.tit)}: alta; el terreno pesa demasiado frente al valor vendible.`]);
  CATS.forEach(c=>{const p=g[c].tot/eg*100;const [lo,hi]=BENCH[c];if(p>hi)out.push(['w',`${c} representa ${nf(p,2)}% de los egresos, sobre el rango de ${lo}–${hi}%.`])});
  const be=breakEven(S);out.push([be<S.p.precioM2*0.85?'ok':'w',`Precio de equilibrio: ${S_(be)} por m², ${pc(1-be/S.p.precioM2)} por debajo del precio actual. Es tu colchón ante una caída de precios.`]);
  const pm=M.soldCum.findIndex(v=>v>=S.p.preventaMin/100-1e-9);
  if(S.p.bancoOn){if(pm<0||pm>=M.ent)out.push(['b',`La preventa del ${S.p.preventaMin}% no se alcanza durante la obra: el banco no desembolsa y toda la obra se fondea con aportes.`]);else if(pm>M.io)out.push(['w',`La preventa del ${S.p.preventaMin}% llega en ${ml(pm)}, ${pm-M.io} meses después del inicio de obra; esos meses se cubren con aportes.`]);else out.push(['ok',`La preventa del ${S.p.preventaMin}% se alcanza en ${ml(pm)}, antes del inicio de obra.`])}
  if(M.finVentas>M.ent)out.push(['w',`Al ritmo de ${S.p.velocidad} und/mes las ventas terminan en ${ml(M.finVentas)}, ${M.finVentas-M.ent} meses después de la entrega. Subir la velocidad o lanzar antes reduce el aporte.`]);
  if(M.creditoFinal>1)out.push(['w',`Queda un saldo a favor de IGV de ${S_(M.creditoFinal)} sin aplicar; ya está considerado como costo.`]);
  out.push((M.tirQ||0)>=S.p.tasaDesc/100?['ok',`La TIR del accionista (${pc(M.tirQ)}) supera el costo de oportunidad de ${S.p.tasaDesc}%.`]:['b',`La TIR del accionista (${M.tirQ==null?'—':pc(M.tirQ)}) no supera el costo de oportunidad de ${S.p.tasaDesc}%.`]);
  return out;
}

  <div class="grid2"><div class="panel"><h3>M.O.R.A · lectura del proyecto</h3><ul class="lola">${insights().map(([c,t])=>`<li class="${c}"><i>${c==='ok'?'✓':c==='w'?'!':'×'}</i><span>${t}</span></li>`).join('')}</ul></div>
  <div class="panel"><h3>Análisis previo y posterior al flujo</h3><div class="tw"><table><tbody>
  <tr class="grp"><td colspan="2">Cifras</td></tr><tr><td>Total ventas</td><td class="n">${S_(M.ventas)}</td></tr><tr><td>Total costos</td><td class="n">${S_(M.egresos)}</td></tr>
  <tr><td>Premio de gestión 3% de la utilidad</td><td class="n">${S_(M.uai*0.03)}</td></tr><tr><td>Margen de socios después de premios, antes de IR</td><td class="n">${S_(M.uai*0.97)}</td></tr>
  <tr class="grp"><td colspan="2">Terreno y construcción</td></tr><tr><td>Costo del terreno por m² de terreno</td><td class="n">${S_(M.terr/S.p.areaTerreno)}</td></tr><tr><td>Costo del terreno por m² vendible</td><td class="n">${S_(M.terr/M.techV)}</td></tr><tr><td>Incidencia del terreno sobre ventas</td><td class="n">${pc(M.tit)}</td></tr>
  <tr><td>Construcción sobre costos totales</td><td class="n">${pc(M.groups['Construcción'].tot/M.egresos)}</td></tr><tr><td>Costo total por m² vendible</td><td class="n">${S_(M.egresos/M.techV)}</td></tr><tr><td>Precio de equilibrio por m²</td><td class="n">${S_(breakEven(S))}</td></tr>
  <tr class="grp"><td colspan="2">Retorno y plazo</td></tr><tr><td>Meses de proyecto</td><td class="n">${M.H+1}</td></tr><tr><td>Unidades</td><td class="n">${M.nU} + ${S.p.nEstac} est.</td></tr><tr><td>Velocidad de venta exigida</td><td class="n">${nf(M.nU/Math.max(1,M.ent-M.lanz),2)} und/mes para vender todo antes de la entrega</td></tr>

  <div class="grid2"><div class="panel"><h3>Sensibilidad · margen neto</h3><div class="tw heat"><table><thead><tr><th>Costo ↓ · Precio →</th>${dp.map(p=>`<th class="n">${p>0?'+':''}${p}%</th>`).join('')}</tr></thead><tbody>
  ${dc.map((c,i)=>`<tr><td><b>${c>0?'+':''}${c}%</b> <span class="mut">${S_(S.p.costoM2*(1+c/100))}</span></td>${sens[i].map(cell).join('')}</tr>`).join('')}</tbody></table></div><p class="note">Precio base ${S_(S.p.precioM2)} por m², costo base ${S_(S.p.costoM2)} por m². Verde ≥10%, ámbar 5–10%, rojo &lt;5%.</p></div>
  <div class="panel"><h3>Sensibilidad · velocidad de venta</h3><div class="tw"><table><thead><tr><th class="n">Und/mes</th><th>Última venta</th><th class="n">Aporte máx.</th><th class="n">Utilidad neta</th><th class="n">TIR acc.</th></tr></thead><tbody>

function moraEvalPayload(){
  const slug=String(S.p.nombre).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const ym=t=>{const [y,m]=String(S.p.inicio).split('-').map(Number);const k=(m-1)+t;return (y+Math.floor(k/12))+'-'+String(k%12+1).padStart(2,'0')};
  const B=baseModel(),pr=proyeccion();
  return {id:(slug+'-'+String(S.base.fecha||'').replace(/-/g,'')).slice(0,100),engine_version:'mora-1',active:true,
    project:{id:slug,nombre:S.p.nombre,direccion:S.p.direccion,uso:S.p.uso},
    inputs:Object.fromEntries(['p','units','vu','inm','leg','fin','com','gg','part'].map(k=>[k,S[k]])),
    analysis:{mercado:mercadoResumen(),baseline:{nombre:S.base.nombre,fecha:S.base.fecha,kpis:kpiSnap(B)},current:{kpis:kpiSnap(M)},projection:{kpis:kpiSnap(pr.PM)},estrategia:S.estr,
      plan_comercial:{velocidad:S.p.velocidad,metas_mensuales:B.sold.map((v,t)=>({fecha:ym(t),unidades:Math.round(v*100)/100})).filter(x=>x.unidades>0)}},
    summary:{hitos:[['Lanzamiento comercial',M.lanz],['Inicio de obra',M.io],['Entrega',M.ent],['Cierre',M.H]].map(([n,t])=>({nombre:n,mes:ym(t)}))}};
}

/* ---------- Seguimiento: línea base, estrategia de precios y proyección ---------- */
function ym2t(ym,ini){const [y,m]=String(ym||'').split('-').map(Number);const [y0,m0]=String(ini||S.p.inicio).split('-').map(Number);if(!y||!m)return 0;return (y-y0)*12+(m-m0)}
function ladder(frac){const e=(S.estr.escalera||[]).slice().sort((a,b)=>a[0]-b[0]);for(const [h,a] of e){if(frac*100<+h-1e-9)return +a}return e.length?+e[e.length-1][1]:0}
function baseModel(){return compute(Object.assign({},S,JSON.parse(JSON.stringify(S.base.snap))))}
function proyeccion(){
  const st=S.estr,cut=ym2t(st.corte);const byId=Object.fromEntries(M.units.map(u=>[String(u.id),u]));const seen=new Set();
  const reales=S.ventas.filter(v=>byId[String(v.u)]&&!seen.has(String(v.u))&&seen.add(String(v.u))).map(v=>({t:Math.max(0,ym2t(v.f)),v:+v.precio||0,id:String(v.u),real:true,m2:+byId[String(v.u)].tech||1,lista:byId[String(v.u)].lista})).sort((a,b)=>a.t-b.t);
  const sold=new Set(reales.map(r=>r.id));const rest=M.units.filter(u=>!sold.has(String(u.id)));
  const vel=Math.max(0.05,+st.velocidad||0.05);let n=reales.length;
  const proj=rest.map((u,k)=>{const t=Math.max(cut+1,0)+Math.floor(k/vel+1e-9);const esc=ladder(n/M.nU);const f=(1+esc/100)*Math.pow(1+(+st.reajuste||0)/100,t-cut)*(1-(+st.desc||0)/100);n++;return {t,v:u.lista*f,id:String(u.id),real:false,m2:+u.tech||1,lista:u.lista,esc,f}});
  return {cut,reales,proj,PM:compute(S,{plan:[...reales,...proj]})};
}
function lineChart({series,n,fmt,mark,label,h}){
  const W=760,Hh=h||250,pl=62,pr=12,pt=14,pb=28;const vals=series.flatMap(s=>s.data.filter(v=>v!=null&&isFinite(v)));
  let mx=Math.max(...vals,0),mn=Math.min(...vals,0);if(mx===mn)mx=mn+1;const pad=(mx-mn)*0.06;mx+=pad;if(mn<0)mn-=pad;
  const x=i=>pl+(W-pl-pr)*(n<=1?0:i/(n-1)),y=v=>pt+(Hh-pt-pb)*(mx-v)/(mx-mn);
  const raw=(mx-mn)/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].map(k=>k*mag).find(k=>k>=raw)||raw;const ticks=[];for(let v=Math.ceil(mn/st)*st;v<=mx+1e-9;v+=st)ticks.push(v);
  let g=ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${Math.abs(v)<1e-9?'stroke="var(--muted)"':''}/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`).join('');
  const step=Math.max(1,Math.ceil(n/12));for(let i=0;i<n;i+=step)g+=`<text x="${x(i)}" y="${Hh-9}" text-anchor="middle">${label(i)}</text>`;
  if(mark!=null&&mark>=0&&mark<n)g+=`<line x1="${x(mark)}" x2="${x(mark)}" y1="${pt}" y2="${Hh-pb}" stroke="var(--warn)" stroke-dasharray="3 3"/><text x="${x(mark)+4}" y="${pt+9}" style="fill:var(--warn)">corte</text>`;

  const mx=Math.max(...bars.map(b=>Math.max(b.y0,b.y1)))*1.06,y=v=>pt+(H-pt-pb)*(1-v/mx),bw=(W-pl-pr)/n;

   return `<rect class="grow" x="${pl+bw*i+bw*0.16}" y="${top}" width="${bw*0.68}" height="${h}" fill="${c}" rx="3"><title>${b.n}: ${S_(b.v)}</title></rect>${i<n-1?`<line x1="${pl+bw*i+bw*0.84}" x2="${pl+bw*(i+1)+bw*0.16}" y1="${y(b.y1)}" y2="${y(b.y1)}" stroke="var(--muted)" stroke-dasharray="2 2"/>`:''}

function donut(segs,center,sub){

    const d=`M${x0},${y0} A${R},${R} 0 ${L} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${L} 0 ${x3},${y3} Z`;a=a1;return `<path d="${d}" fill="${s.c||VCOL[i%5]}" stroke="var(--surface)" stroke-width="2"><title>${s.n}: ${S_(s.v)} (${pc(s.v/tot)})</title></path>`}).join('');

const RULES=`Eres M.O.R.A (Motor de Optimización, Riesgo y Análisis), la agente de IA del Evaluador Inmobiliario, módulo del ERP de una desarrolladora en Lima, Perú. Tu función es evaluar proyectos: optimizar la rentabilidad, medir el riesgo y analizar cada cifra antes de invertir. Este módulo alimenta luego al CRM inmobiliario, donde trabaja L.O.L.A, la agente comercial: le entrega inventario, precios, metas de venta y presupuesto de marketing. No eres L.O.L.A; si preguntan por gestión de clientes o ventas en curso, aclara que eso corresponde a L.O.L.A en el CRM. Combinas criterio de:
- Finanzas de proyecto: TIR, VAN, ROE, aporte de capital, crédito promotor con preventa mínima, apalancamiento y sensibilidad.
- Contabilidad y tributación peruana: IGV en primera venta de inmuebles (base gravada 50% por terreno), crédito fiscal, detracciones, IR 29.5%, alcabala, predial y arbitrios.
- Construcción: presupuestos por partidas, costo/m², gastos generales, curva S, plazos y riesgos de obra.
- Desarrollo y comercialización: cabida, tipologías, absorción, precios y descuentos en Lima.
Reglas:
1. Responde en español, breve y concreto, usando las cifras reales del modelo que recibes. Cita montos en S/.
2. Antes de recomendar un cambio numérico, usa simular_escenario para cuantificar el efecto en utilidad neta, margen, TIR y aporte.
3. Usa aplicar_cambios SOLO cuando el usuario pida explícitamente cambiar, aplicar o ajustar algo. Luego confirma qué cambiaste y el nuevo resultado.
4. Si un dato depende del mercado o de normas vigentes que no están en el modelo (precios de la zona, UIT, tasas bancarias), dilo y da un rango referencial.
5. No inventes cifras del modelo: si necesitas otra pestaña, usa leer_pestana. Para precios de la zona usa la pestaña Estudio de mercado (id mercado): distingue lanzamiento, en venta, últimas ventas y usados, recuerda que los avisos son precios de lista y que \"desde\" sobrestima el S/ por m², y antes de proponer un precio simula su efecto.
6. Formato: párrafos cortos y listas con guiones; sin tablas largas.
7. Seguimiento: existe una línea base congelada (lo aprobado) y una proyección que usa las ventas reales del CRM (estado separada, vendida o desembolsada) más la estrategia de precios (rutas estr.corte, estr.velocidad, estr.reajuste, estr.desc, estr.escalera.<i>.<0 hasta%|1 ajuste%>). Para comparar ambas usa leer_pestana con 'tablero'. Nunca modifiques la línea base.
8. CRM R28 de L.O.L.A: aplicación web (Node 22, PostgreSQL, n8n) con embudo Cita Asistida, Calificado, Evaluación GNB, Separación, Inicial, Minuta, Venta; inventario de unidades y atribución por campaña. Sus principios rigen aquí: la IA propone y una persona aprueba; solo gerencia aprueba la estrategia de precios (no cambies estr.estado); no se anuncian precios no aprobados.`;

const XC={dk:'FF35190F',br:'FF85442A',ac:'FFEB6834',soft:'FFF6EEE8',line:'FFE6D8CF',mut:'FF6B625C',white:'FFFFFFFF'};

function xlsNum(t){
  if(t===''||t==='—'||t==='–'||t==='·')return {v:''};
  const s=t.replace(/−/g,'-').replace(/ /g,' ');
  const m=s.match(/^([+-])?\s*(S\/|US\$|\$)?\s*([+-])?\s*(\d{1,3}(?:,\d{3})+|\d+)(\.\d+)?\s*(%|x|pp)?$/);
  if(!m)return {v:t};
  const neg=m[1]==='-'||m[3]==='-',n=+(m[4].replace(/,/g,'')+(m[5]||''))*(neg?-1:1),dec=m[5]?Math.min(m[5].length-1,2):0,d=dec?'.'+'0'.repeat(dec):'';
  if(m[6]==='%')return {v:n/100,f:'0'+d+'%;[Red]-0'+d+'%'};
  if(m[6]==='x')return {v:n,f:'0.00"x"'};
  if(m[6]==='pp')return {v:n,f:'+0.0" pp";[Red]-0.0" pp"'};
  if(m[2]){const c=m[2]==='S/'?'"S/ "':'"US$ "';return {v:n,f:c+'#,##0'+d+';[Red]-'+c+'#,##0'+d}}
  if(!m[4].includes(',')&&!m[5]&&Math.abs(n)<10000)return {v:n};
  return {v:n,f:'#,##0'+d+';[Red]-#,##0'+d};
}
function xlsText(el){let o='';for(const n of el.childNodes){if(n.nodeType===3)o+=n.nodeValue;else if(n.nodeType===1){if(n.tagName==='BR')o+=' ';else if(!/^(svg|button|style|script)$/i.test(n.tagName))o+=' '+xlsText(n)+' '}}return o}
function xlsCell(el){
  const i=el.querySelector('input,select');let t;
  if(i){if(i.type==='checkbox')return {v:i.checked?'Sí':'No'};
    if(i.tagName==='SELECT')t=(i.options[i.selectedIndex]||{}).text||i.value;
    else{t=i.value;if(i.type==='number'&&t!==''&&isFinite(+t)){const n=+t;return Number.isInteger(n)?(n>=1900&&n<=2100?{v:n}:{v:n,f:'#,##0'}):{v:n,f:'#,##0.00'}}}}
  else t=xlsText(el);
  return xlsNum(String(t==null?'':t).replace(/\s+/g,' ').trim());
}

function xlsFinish(st){

function xlsLine(st,vals,o={}){const row=st.ws.getRow(st.r);vals.forEach((x,i)=>{if(x==null)return;const v=typeof x==='object'?x:{v:x};const c=row.getCell(i+1);c.value=v.v;if(v.f)c.numFmt=v.f;if(i===0)c.font={color:{argb:o.key?XC.mut:'FF1C1917'},bold:!!o.bold};if(i===1&&o.big)c.font={bold:true,size:12,color:{argb:XC.dk}};if(i>=2)c.font={size:9.5,color:{argb:XC.mut}};if(i<2)xw(st,i+1,i===0&&String(v.v).length>60?'x'.repeat(60):v.v)});st.cols=Math.max(st.cols,vals.length);st.r++}
function xlsTable(st,tb){

function xlsWalk(node,st){
  for(const el of node.children){
    const tg=el.tagName.toUpperCase();
    if(['SVG','BUTTON','TEXTAREA','STYLE','SCRIPT','DETAILS','FIELDSET','LEGEND'].includes(tg))continue;
    if(el.id==='xlsPanel')continue;
    if(el.matches('.sect-h')){const h=el.querySelector('h2');if(h){if(st.r>4)st.r++;xlsTitle(st,h.textContent,15)}const p=el.querySelector(':scope>p');if(p)xlsNote(st,p.textContent);st.r++;continue}
    if(tg==='H2'||tg==='H3'||tg==='H4'){if(st.r>4)st.r++;xlsTitle(st,el.textContent,tg==='H2'?15:11.5);continue}
    if(tg==='TABLE'){if(st.firstTable==null)st.firstTable=st.r;xlsTable(st,el);continue}
    if(el.matches('.f')){const l=el.querySelector('label'),i=el.querySelector('input,select');if(l&&i)xlsLine(st,[l.textContent.trim(),xlsCell(el)],{key:1});continue}
    if(el.matches('.big>div,.hero>div,.kpi,.scen>div')){
      const l=el.querySelector('label'),o=el.querySelector('output'),sm=el.querySelector(':scope>small');
      if(l||o)xlsLine(st,[l?l.textContent.trim():'',o?xlsNum(o.textContent.replace(/\s+/g,' ').trim()):'',sm?sm.textContent.replace(/\s+/g,' ').trim():null],{key:1,big:1});
      const dts=el.querySelectorAll('dt');dts.forEach(dt=>{const dd=dt.nextElementSibling;xlsLine(st,['   '+dt.textContent.trim(),dd?xlsNum(dd.textContent.trim()):''],{key:1})});
      const p=el.querySelector(':scope>p');if(p)xlsNote(st,p.textContent);continue}
    if(el.matches('.lola li')){const c=el.cloneNode(true);c.querySelectorAll('i').forEach(x=>x.remove());xlsLine(st,['• '+c.textContent.replace(/\s+/g,' ').trim()]);continue}
    if(el.matches('.risks>div')){const b=el.querySelector('b');xlsLine(st,[b?b.textContent.trim():'',[...el.querySelectorAll('p')].map(p=>p.textContent.replace(/\s+/g,' ').trim()).join(' · ')],{bold:1});continue}
    if(el.matches('.miles>div')){xlsLine(st,['• '+el.textContent.replace(/\s+/g,' ').trim()]);continue}
    if(el.matches('.leg li,.hb')){const c=el.cloneNode(true);c.querySelectorAll('b,small,output,.bar,svg').forEach(x=>x.remove());
      xlsLine(st,[c.textContent.replace(/\s+/g,' ').trim(),...[...el.querySelectorAll('b,output')].map(x=>xlsNum(x.textContent.replace(/\s+/g,' ').trim())),...[...el.querySelectorAll('small')].map(x=>x.textContent.replace(/\s+/g,' ').trim())],{key:1});continue}
    if(tg==='P'&&(el.matches('.note')||el.closest('.narr'))){xlsNote(st,el.textContent);continue}
    if(el.matches('.chip')){continue}
    xlsWalk(el,st);
  }
}

async function exportXLSX(tabs,etiqueta){
  if(xlsBusy)return;xlsBusy=true;xlsMsg('Preparando el Excel…');const fcPrev=fcMode;

    const XL=await loadExcel();const wb=new XL.Workbook();wb.creator='ÖRÖK · M.O.R.A';wb.company='ÖRÖK';wb.title=`${S.p.nombre} · ${etiqueta}`;wb.created=new Date();
    const used=new Set(),names={},sts=[];fcMode='S/';
    const multi=tabs.length>1;used.add('resumen');
    tabs.forEach(t=>{let n=String(xlsLabel(t)).replace(/[\[\]\*\?\/\\:]/g,' ').replace(/\s+/g,' ').trim().slice(0,31);let k=n,i=2;while(used.has(k.toLowerCase()))k=n.slice(0,27)+' ('+(i++)+')';used.add(k.toLowerCase());names[t]=k});
    if(multi){const u=new Set();xlsFinish(xlsResumen(wb,u,tabs,etiqueta,names));}
    for(const t of tabs){
      const used1=new Set(Object.values(names).filter(n=>n!==names[t]).map(n=>n.toLowerCase()).concat(['resumen']));
      const st=xlsSheet(wb,names[t],used1);st.ws.getCell(1,1).value='ÖRÖK · Evaluador Inmobiliario M.O.R.A — '+xlsLabel(t);
      try{const host=document.createElement('div');host.innerHTML=V[t]();xlsWalk(host,st)}catch(e){xlsNote(st,'No se pudo exportar esta sección: '+(e&&e.message||e))}
      xlsFinish(st);
    }
    fcMode=fcPrev;
    const buf=await wb.xlsx.writeBuffer(),blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const name=`MORA ${S.p.nombre} - ${etiqueta} ${limaDate()}.xlsx`.replace(/[\\/:*?"<>|]/g,'');
    if(downloadsApi===undefined)downloadsApi=window.claude?await window.claude.use('downloads'):null;
    if(!downloadsApi){if(window.top===window||CRM){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);xlsMsg('Excel listo: '+name)}else xlsMsg('Esta vista no permite descargar archivos. Ábrela en Claude o en tu navegador para exportar.');return}
    await downloadsApi.save({filename:name,data:blob});xlsMsg('Excel listo: '+name);
  }catch(e){xlsMsg(e&&e.code==='declined'?'Descarga cancelada.':e&&e.message==='load'?'No se pudo cargar el generador de Excel. Revisa la conexión y vuelve a intentarlo.':'No se pudo generar el Excel.');console.error(e)}
